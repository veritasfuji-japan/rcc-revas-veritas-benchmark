name: Final 128 V11 Receipt Handoff Provider-Free
on:
  pull_request:
    paths:
      - "scripts/final_128_v11_receipt_handoff_v1.py"
      - ".github/workflows/final-128-v11-receipt-handoff-provider-free.yml"
permissions: {contents: read}
jobs:
  proof:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ""
      VERITAS_DATABASE_URL: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11.16"}
      - name: Prove V11 consume receipt to provider boundary provider-free
        run: python scripts/final_128_v11_receipt_handoff_v1.py --provider-free-preflight
