name: Task4 364 Prospective Live AB Preflight Default Deny
on:
  pull_request:
    paths:
      - "contracts/TASK4_364_PROSPECTIVE_LIVE_AB_PREFLIGHT_V1.json"
      - "scripts/task4_364_prospective_live_ab_preflight_v1.py"
      - "tests/test_task4_364_prospective_live_ab_preflight_v1.py"
      - "docs/TASK4_364_PROSPECTIVE_LIVE_AB_PREFLIGHT_V1.md"
      - ".github/workflows/task4-364-prospective-live-ab-preflight.yml"
permissions:
  contents: read
jobs:
  offline-plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
      - name: Offline contract tests and report
        run: |
          set -euo pipefail
          python -m pip install pytest==9.1.1
          python -m pytest -q -o addopts= tests/test_task4_364_prospective_live_ab_preflight_v1.py
          mkdir -p task4-364-artifact
          python -m scripts.task4_364_prospective_live_ab_preflight_v1 > task4-364-artifact/audit.json
          cp contracts/TASK4_364_PROSPECTIVE_LIVE_AB_PREFLIGHT_V1.json task4-364-artifact/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: task4-364-prospective-ab-default-deny-v1
          path: task4-364-artifact/
          if-no-files-found: error
          retention-days: 30
