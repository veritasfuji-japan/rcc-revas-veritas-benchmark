permissions:
  contents: read
  actions: read
jobs:
  refund-receipt-store:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ""
      VERITAS_DATABASE_URL: ""
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      GH_TOKEN: ${{ github.token }}
      REPLAY_ARTIFACT_ZIP: /tmp/source-controlled-replay-v1.zip
      V13_ARTIFACT_ZIP: /tmp/source-v13-execution-records.zip
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
      - name: Verify immutable integration proof sources
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object contracts/TASK15_REFUND_RECEIPT_RESERVATION_CONSUMPTION_V1.json)" = "43036a575eb40e5daf69e0db35cc36415eab257e"
          test "$(git hash-object scripts/task15_refund_receipt_reservation_consumption_audit_v1.py)" = "2f1138a70e8c68a61928a256bb7a137b2e04c36f"
          echo PASS_TASK15_REFUND_DESIGN_LOCAL_SOURCE_PINS
      - name: Checkout exact native runtime pins
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _pins
          git clone https://github.com/ethz-spylab/agentdojo.git _pins/agentdojo
          git -C _pins/agentdojo checkout a75aba7631d3ca5fb7ab938965c97ead2f9ff84b
          git clone https://github.com/effacermonexistence/rcc-revas-veritas-benchmark.git _pins/rcc
          git -C _pins/rcc checkout 1d3782d3aae5ff9c88036709c1a5642320cc53c2
          git clone https://github.com/veritasfuji-japan/veritas_os.git _pins/veritas
          git -C _pins/veritas checkout a1d66aef02262cf8a913295270c3aafd159c6adb
      - name: Install pinned provider-free native proof runtime
        shell: bash
        run: |
          set -euo pipefail
          pip install --no-deps -e ./_pins/agentdojo -e ./_pins/veritas
          pip install "pytest==9.1.1" "cryptography==50.0.0" "openai==1.109.1" "pydantic==2.11.10" "idna==3.15" "httpx==0.28.1" "requests==2.34.2" "PyYAML==6.0.3"
          python scripts/final_128_v12_locked_agentdojo_requirements_v1.py \
            --lock _pins/agentdojo/uv.lock \
            --output /tmp/task15-refund-design-locked-direct.txt
          pip install -r /tmp/task15-refund-design-locked-direct.txt
          pip install "pydantic==2.11.10" "pydantic-core==2.33.2" "annotated-types==0.8.0" "typing-extensions==4.13.2" "typing-inspection==0.4.2" "docstring-parser==0.16" "pytest==9.1.1" "iniconfig==2.3.1" "packaging==25.0" "pluggy==1.6.0" "pygments==2.21.0"
      - name: Download existing immutable evidence only
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/$GITHUB_REPOSITORY/actions/artifacts/11472402060/zip > "$REPLAY_ARTIFACT_ZIP"
          test "$(sha256sum "$REPLAY_ARTIFACT_ZIP" | awk '{print $1}')" = "449443501266eea9aa83ab08f261740acf2296787483a80853469c6a02684b95"
          gh api repos/$GITHUB_REPOSITORY/actions/artifacts/11466539107/zip > "$V13_ARTIFACT_ZIP"
          test "$(sha256sum "$V13_ARTIFACT_ZIP" | awk '{print $1}')" = "9fbb2a1614c237e92c4239bb5d60f83d40d33b81e0092d3f82958931969c9e7a"
      - name: Audit atomic shared receipt reservation consumption and terminal unknown
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          cp /tmp/task15-refund-design-locked-direct.txt results/task15-refund-design-locked-direct.txt
          pip freeze > results/task15-refund-design-dependency-observation.txt
          python scripts/task15_refund_receipt_reservation_consumption_audit_v1.py \
            --agentdojo-root _pins/agentdojo \
            --rcc-root _pins/rcc \
            --veritas-root _pins/veritas \
            --replay-artifact "$REPLAY_ARTIFACT_ZIP" \
            --v13-artifact "$V13_ARTIFACT_ZIP" \
            --output-dir results \
            | tee results/task15-refund-receipt-reservation-consumption-v1.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: task15-refund-receipt-reservation-consumption-v1-${{ github.run_id }}
          path: |
            results/task15-*
            results/controlled-*
          if-no-files-found: error
