name: Final 128 V5 Target Freeze V1
on:
  pull_request:
    paths:
      - "contracts/AGENTDOJO_FINAL_128_V5_TARGET_FREEZE_v1.json"
      - ".github/workflows/final-128-v5-target-freeze-v1.yml"
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify frozen target
        shell: python
        run: |
          import json, subprocess
          from pathlib import Path
          c=json.loads(Path("contracts/AGENTDOJO_FINAL_128_V5_TARGET_FREEZE_v1.json").read_text())
          t=c["exact_target"]
          for path,key in [(t["wrapper_path"],"wrapper_git_blob_sha"),(t["runner_path"],"runner_git_blob_sha"),(t["workflow_path"],"workflow_git_blob_sha")]:
              got=subprocess.check_output(["git","hash-object",path],text=True).strip()
              assert got==t[key],(path,got,t[key])
          s=c["current_state"]
          assert s["v5_issued"] is False
          assert s["v5_consumed"] is False
          assert s["provider_dispatch_authorized"] is False
          assert s["provider_api_called"] is False
          assert s["final_128_executed"] is False
          assert c["cost_boundary"]["maximum_usd"]==5
          assert c["cost_boundary"]["confirmation_received"] is False
          print("PASS_FINAL_128_V5_TARGET_FREEZE_V1")
