name: Final 128 V8 Burned No Result Audit
on:
  pull_request:
    paths:
      - "contracts/AGENTDOJO_FINAL_128_V8_BURNED_NO_RESULT_v1.json"
      - "scripts/final_128_v8_burned_no_result_audit_v1.py"
      - ".github/workflows/final-128-v8-burned-no-result-audit.yml"
  workflow_dispatch:
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11.16"}
      - run: python scripts/final_128_v8_burned_no_result_audit_v1.py
