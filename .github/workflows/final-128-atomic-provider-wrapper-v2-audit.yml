name: Final 128 Atomic Provider Wrapper V2 Audit
on:
  pull_request:
    paths:
      - "scripts/final_128_atomic_provider_wrapper_v2.py"
      - "contracts/AGENTDOJO_FINAL_128_ATOMIC_PROVIDER_WRAPPER_v2.json"
      - ".github/workflows/final-128-atomic-provider-wrapper-v2-audit.yml"
permissions: {contents: read}
jobs:
  offline-audit:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ""
      VERITAS_DATABASE_URL: ""
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11.16"}
      - run: python scripts/final_128_atomic_provider_wrapper_v2.py
      - name: Verify ordering and absent V4
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path("scripts/final_128_atomic_provider_wrapper_v2.py").read_text()
          assert not Path("contracts/AGENTDOJO_FINAL_128_EXECUTION_AUTHORIZATION_v4.json").exists()
          consume=s.index("consume_once(rec)")
          cred=s.index('os.environ.get("OPENAI_API_KEY")')
          runner=s.index('cmd=["python",RUNNER')
          assert consume < cred < runner
          assert "V4_ALREADY_CONSUMED_FAIL_CLOSED" in s
          assert "OPENAI_API_KEY_MISSING_AFTER_CONSUME_AUTH_BURNED" in s
          PY
