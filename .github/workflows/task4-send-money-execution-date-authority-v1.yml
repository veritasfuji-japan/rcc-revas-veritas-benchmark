name: Task4 Send Money Execution Date Authority V1
on:
  pull_request:
    paths:
      - "contracts/TASK4_SEND_MONEY_EXECUTION_DATE_AUTHORITY_V1.json"
      - "scripts/task4_send_money_execution_date_authority_audit_v1.py"
      - ".github/workflows/task4-send-money-execution-date-authority-v1.yml"
  push:
    branches: [main]
    paths:
      - "contracts/TASK4_SEND_MONEY_EXECUTION_DATE_AUTHORITY_V1.json"
      - "scripts/task4_send_money_execution_date_authority_audit_v1.py"
      - ".github/workflows/task4-send-money-execution-date-authority-v1.yml"
permissions:
  contents: read
  actions: read
jobs:
  authority-audit:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ""
      VERITAS_DATABASE_URL: ""
      GH_TOKEN: ${{ github.token }}
      REPLAY_ARTIFACT_ZIP: /tmp/task4-source-controlled-replay-v1.zip
      AGENTDOJO_ROOT: _pins/agentdojo
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
      - name: Verify immutable Task4 proof sources
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object contracts/TASK4_SEND_MONEY_EXECUTION_DATE_AUTHORITY_V1.json)" = "27df2d5fb3d6eb75ec173a9273b0bc6834fd0c1c"
          test "$(git hash-object scripts/task4_send_money_execution_date_authority_audit_v1.py)" = "f45b0d4c98b2b63d42a409e668efce391d2574e5"
          echo PASS_TASK4_LOCAL_PROOF_SOURCE_PINS
      - name: Checkout exact native banking source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _pins
          git clone --no-checkout https://github.com/ethz-spylab/agentdojo.git "$AGENTDOJO_ROOT"
          git -C "$AGENTDOJO_ROOT" checkout a75aba7631d3ca5fb7ab938965c97ead2f9ff84b
      - name: Install isolated native model dependencies
        run: python -m pip install "pydantic==2.11.10" "pydantic-core==2.33.2" "annotated-types==0.8.0" "typing-extensions==4.16.0" "typing-inspection==0.4.4"
      - name: Download frozen controlled replay result
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/$GITHUB_REPOSITORY/actions/artifacts/11472402060/zip > "$REPLAY_ARTIFACT_ZIP"
          test "$(sha256sum "$REPLAY_ARTIFACT_ZIP" | awk '{print $1}')" = "449443501266eea9aa83ab08f261740acf2296787483a80853469c6a02684b95"
      - name: Audit native date semantics and unresolved authority
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          python scripts/task4_send_money_execution_date_authority_audit_v1.py \
            --agentdojo-root "$AGENTDOJO_ROOT" \
            --replay-artifact "$REPLAY_ARTIFACT_ZIP" \
            --output results/task4-send-money-execution-date-authority-v1.json \
            | tee results/task4-send-money-execution-date-authority-v1.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: task4-send-money-execution-date-authority-v1-${{ github.run_id }}
          path: results/task4-send-money-execution-date-authority-v1.*
          if-no-files-found: error
