name: Task15 Signed Admin Revocation V1
on:
  pull_request:
    paths:
      - ".github/workflows/task15-signed-admin-revocation-v1.yml"
      - "task15_signed_admin_revocation_v1.py"
      - "scripts/task15_signed_admin_docker_broker_v1.py"
      - "scripts/task15_signed_admin_revocation_audit_v1.py"
      - "docker/task15_signed_admin_revocation_v1.Dockerfile"
      - "tests/test_task15_signed_admin_revocation_v1.py"
      - "contracts/TASK15_SIGNED_ADMIN_REVOCATION_V1.json"
      - "docs/TASK15_SIGNED_ADMIN_REVOCATION_V1.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/task15-signed-admin-revocation-v1.yml"
      - "task15_signed_admin_revocation_v1.py"
      - "scripts/task15_signed_admin_docker_broker_v1.py"
      - "scripts/task15_signed_admin_revocation_audit_v1.py"
      - "docker/task15_signed_admin_revocation_v1.Dockerfile"
      - "tests/test_task15_signed_admin_revocation_v1.py"
      - "contracts/TASK15_SIGNED_ADMIN_REVOCATION_V1.json"
      - "docs/TASK15_SIGNED_ADMIN_REVOCATION_V1.md"
permissions:
  contents: read
jobs:
  signed-admin-revocation-mock-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OPENAI_API_KEY: ""
      OPENAI_BASE_URL: ""
      ANTHROPIC_API_KEY: ""
      AWS_SECRET_ACCESS_KEY: ""
      GH_TOKEN: ""
      GITHUB_TOKEN: ""
      TASK15_STOLEN_SESSION_PROOF: "1"
      TASK15_SIGNED_ADMIN_PROOF: "1"
      PYTHONPATH: "."
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
      - name: Install pinned TEST-only cryptographic dependency
        run: python -m pip install "cryptography==50.0.0"
      - name: Prove 18 negative administrator authorization cases
        run: python -m unittest discover -s tests -p 'test_task15_signed_admin_revocation_v1.py' -v
      - name: Prove signed admin revocation in two networkless Docker brokers
        run: |
          set -euo pipefail
          mkdir -p results
          python scripts/task15_signed_admin_revocation_audit_v1.py --output-dir results | tee results.log
      - name: Archive two signed mock authority ledgers and raw Docker evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: task15-signed-admin-revocation-v1
          path: |
            results/*
            results.log
          if-no-files-found: warn
