name: Task4 Trusted Execution Date Profile V1
on:
  pull_request:
    paths:
      - "contracts/TASK4_TRUSTED_EXECUTION_DATE_PROFILE_V1.json"
      - "task4_trusted_execution_date_profile_v1.py"
      - "tests/test_task4_trusted_execution_date_profile_v1.py"
      - "scripts/task4_trusted_execution_date_profile_audit_v1.py"
      - ".github/workflows/task4-trusted-execution-date-profile-v1.yml"
  push:
    branches: [main]
    paths:
      - "contracts/TASK4_TRUSTED_EXECUTION_DATE_PROFILE_V1.json"
      - "task4_trusted_execution_date_profile_v1.py"
      - "tests/test_task4_trusted_execution_date_profile_v1.py"
      - "scripts/task4_trusted_execution_date_profile_audit_v1.py"
      - ".github/workflows/task4-trusted-execution-date-profile-v1.yml"
permissions:
  contents: read
jobs:
  date-profile-proof:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ""
      VERITAS_DATABASE_URL: ""
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
      - name: Verify immutable date-profile proof sources
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object contracts/TASK4_TRUSTED_EXECUTION_DATE_PROFILE_V1.json)" = "faef166fc6f4c55c3e345e9b9b50e3ff240a164f"
          test "$(git hash-object scripts/task4_trusted_execution_date_profile_audit_v1.py)" = "63164cb3159d027667d497718b9041281ea7ebac"
          echo PASS_TASK4_DATE_PROFILE_LOCAL_SOURCE_PINS
      - name: Install proof test dependency
        run: python -m pip install "pytest==9.1.1"
      - name: Audit standalone date profile and rejection cases
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          python scripts/task4_trusted_execution_date_profile_audit_v1.py \
            --output-dir results \
            | tee results/task4-trusted-execution-date-profile-v1.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: task4-trusted-execution-date-profile-v1-${{ github.run_id }}
          path: results/task4-trusted-execution-date-profile-v1.*
          if-no-files-found: error
