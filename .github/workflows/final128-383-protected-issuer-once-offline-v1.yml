name: Final128 383 Task1 Protected Issuer Global Once Offline Gate
on:
  pull_request:
    paths:
      - ".github/workflows/final128-383-protected-issuer-once-offline-v1.yml"
      - "scripts/final128_383_task1_global_once_issuer_gate_offline_v1.py"
      - "tests/test_final128_383_task1_global_once_issuer_gate_offline_v1.py"
      - "docs/optimization/FINAL128_383_GLOBAL_SINGLE_USE_PROTECTED_ISSUER_OFFLINE_V1.md"
      - "scripts/final128_382_first_two_responses_once_transport_v1.py"
      - "scripts/final128_381_task1_real_responses_capture_contract_v1.py"
      - "scripts/final128_351_task1_durable_lease_preflight_v1.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/final128-383-protected-issuer-once-offline-v1.yml"
      - "scripts/final128_383_task1_global_once_issuer_gate_offline_v1.py"
      - "tests/test_final128_383_task1_global_once_issuer_gate_offline_v1.py"
      - "docs/optimization/FINAL128_383_GLOBAL_SINGLE_USE_PROTECTED_ISSUER_OFFLINE_V1.md"
permissions:
  contents: read
jobs:
  protected-issuer-contract-offline-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      FINAL128_381_AGENTDOJO_ROOT: "_pins/agentdojo"
      FINAL128_380_AGENTDOJO_ROOT: "_pins/agentdojo"
      FINAL128_379_AGENTDOJO_ROOT: "_pins/agentdojo"
      FINAL128_378_AGENTDOJO_ROOT: "_pins/agentdojo"
      FINAL128_377_AGENTDOJO_ROOT: "_pins/agentdojo"
      OPENAI_API_KEY: ""
      TASK4_OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      OPENAI_BASE_URL: ""
      GITHUB_TOKEN: ""
      GH_TOKEN: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ethz-spylab/agentdojo
          ref: a75aba7631d3ca5fb7ab938965c97ead2f9ff84b
          path: _pins/agentdojo
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
      - name: Verify source pins, no secrets, NO GitHub ref writes or live sender
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git -C _pins/agentdojo rev-parse HEAD)" = "a75aba7631d3ca5fb7ab938965c97ead2f9ff84b"
          test "$(git -C _pins/agentdojo hash-object src/agentdojo/default_suites/v1/tools/banking_client.py)" = "941c27467b7890cced7ab70e5fd5ca32241f99a5"
          for name in OPENAI_API_KEY TASK4_OPENAI_API_KEY ANTHROPIC_API_KEY OPENAI_BASE_URL GITHUB_TOKEN GH_TOKEN; do
            test -z "$(printenv "$name" || true)"
          done
          python -m py_compile \
            scripts/final128_383_task1_global_once_issuer_gate_offline_v1.py \
            scripts/final128_382_first_two_responses_once_transport_v1.py \
            tests/test_final128_383_task1_global_once_issuer_gate_offline_v1.py
          mkdir -p results
          git rev-parse HEAD > results/final128-383-exact-head.txt
      - name: Install frozen Native AgentDojo and test framework
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check "pytest==9.1.1"
          python -m pip install --disable-pip-version-check -e _pins/agentdojo
      - name: Verify fixed-global-once issuer, no live grant and Native regressions
        env:
          PYTHONPATH: "."
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q -o addopts= \
            tests/test_final128_383_task1_global_once_issuer_gate_offline_v1.py \
            tests/test_final128_382_first_two_responses_once_transport_v1.py \
            tests/test_final128_381_task1_real_responses_capture_contract_v1.py \
            tests/test_final128_380_mock_call_id_native_continuity_v1.py \
            tests/test_final128_379_task1_native_mock_provider_bridge_v1.py \
            tests/test_final128_378_native_paired_model_input_seam_v1.py \
            tests/test_final128_377_native_preterminal_spending_projection_v1.py \
            tests/test_final128_350_task1_responses_once_budget_v1.py \
            tests/test_final128_351_task1_durable_lease_preflight_v1.py \
            --junitxml=results/final128-383-junit.xml \
            | tee results/final128-383-tests.log
          python - <<'PY'
          import hashlib,json,xml.etree.ElementTree as ET,os
          from pathlib import Path
          from scripts.final128_383_task1_global_once_issuer_gate_offline_v1 import (
              candidate_context,inspect_candidate,proposed_git_ref_create_request,
              OfflineOnlyFakeGitRefs,rehearse_offline_atomic_once)
          root=ET.parse("results/final128-383-junit.xml").getroot()
          suites=[root] if root.tag=="testsuite" else list(root.findall("testsuite"))
          assert suites
          counts={k:sum(int(s.attrib.get(k,"0")) for s in suites)
                  for k in ("tests","failures","errors","skipped")}
          assert counts["tests"]>=240 and all(
              counts[k]==0 for k in ("failures","errors","skipped"))
          sha=Path("results/final128-383-exact-head.txt").read_text().strip()
          ctx=candidate_context(main_sha=sha,run_id=os.environ["GITHUB_RUN_ID"])
          plan=inspect_candidate(ctx)
          spec=proposed_git_ref_create_request(ctx)
          fake=OfflineOnlyFakeGitRefs()
          proof=rehearse_offline_atomic_once(
              ctx=ctx,store=fake,
              evidence_path=Path("results/final128-383-fake-ref-journal.jsonl"))
          assert proof["local_fake_create_attempts"]==1
          assert proof["real_github_ref_created"] is False
          assert proof["actual_paid_provider_calls"]==0
          assert proof["official_utility_or_attack_scores"] is None
          assert plan["live_dispatch_authorized"] is False
          assert spec["external_post_executed"] is False
          report={
            "schema":"veritas.final128.task1-383-issuer-offline-gate-evidence.v1",
            "exact_head":sha,
            "pinned_agentdojo_sha":"a75aba7631d3ca5fb7ab938965c97ead2f9ff84b",
            "test_counts":counts,
            "proposed_plan_sha256":hashlib.sha256(
              json.dumps(plan,sort_keys=True,separators=(",",":")).encode()).hexdigest(),
            "proposed_git_api_tag_packet_sha256":hashlib.sha256(
              json.dumps(spec,sort_keys=True,separators=(",",":")).encode()).hexdigest(),
            "mock_rehearsal_result":proof,
            "real_github_tag_created":False,
            "actual_external_permission_issued":False,
            "actual_provider_posts":0,
            "actual_spend_usd":"0.00",
            "native_scorer_calls":0,
            "new_real_model_task1_ab_scores":None,
            "external_env_ruleset_billing_verified":False,
          }
          raw=lambda x:json.dumps(x,sort_keys=True,separators=(",",":"),allow_nan=False).encode()
          report["self_sha256"]=hashlib.sha256(raw(report)).hexdigest()
          Path("results/final128-383-issuer-evidence.json").write_text(
              json.dumps(report,sort_keys=True,indent=2)+"\n")
          print("FINAL128_383_OFFLINE_GLOBAL_SINGLETON_REF_REHEARSED_NO_REAL_ISSUER_NO_PROVIDER")
          PY
          sha256sum \
            scripts/final128_383_task1_global_once_issuer_gate_offline_v1.py \
            tests/test_final128_383_task1_global_once_issuer_gate_offline_v1.py \
            docs/optimization/FINAL128_383_GLOBAL_SINGLE_USE_PROTECTED_ISSUER_OFFLINE_V1.md \
            results/final128-383-issuer-evidence.json \
            results/final128-383-fake-ref-journal.jsonl \
            results/final128-383-junit.xml > results/final128-383-source-evidence-sha256.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: final128-383-global-once-issuer-offline-no-live
          path: results/final128-383-*
          if-no-files-found: warn
