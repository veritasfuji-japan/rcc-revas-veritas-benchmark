name: Task15 Native Address Request Profile Issuance V1
on:
  pull_request:
    paths:
      - "contracts/TASK15_NATIVE_ADDRESS_REQUEST_PROFILE_ISSUANCE_V1.json"
      - "scripts/task15_native_address_request_profile_issuance_audit_v1.py"
      - "task15_native_address_request_profile_issuance_v1.py"
      - "tests/test_task15_native_address_request_profile_issuance_v1.py"
      - "docs/TASK15_NATIVE_ADDRESS_REQUEST_PROFILE_ISSUANCE_V1.md"
      - ".github/workflows/task15-native-address-request-profile-issuance-v1.yml"
      - "contracts/TASK15_ORIGINAL_REQUEST_NATIVE_ADDRESS_FIELD_MAPPING_V1.json"
      - "scripts/task15_original_request_native_address_field_mapping_audit_v1.py"
      - "task15_original_request_native_address_field_mapping_v1.py"
      - "tests/test_task15_original_request_native_address_field_mapping_v1.py"
      - "docs/TASK15_ORIGINAL_REQUEST_NATIVE_ADDRESS_FIELD_MAPPING_V1.md"
      - ".github/workflows/task15-original-request-native-address-field-mapping-v1.yml"
      - "contracts/CONTROLLED_CANDIDATE_BINDING_MISMATCH_CAUSE_DECOMPOSITION_V1.json"
      - "scripts/controlled_candidate_binding_mismatch_cause_decomposition_audit_v1.py"
      - "docs/CONTROLLED_CANDIDATE_BINDING_MISMATCH_CAUSE_DECOMPOSITION_V1.md"
      - ".github/workflows/controlled-candidate-binding-mismatch-cause-decomposition-v1.yml"
      - "agentdojo_constraint_resolver_v0_1.py"
      - "contracts/CONTROLLED_GOVERNANCE_TREATMENT_DELTA_ANALYSIS_V1.json"
      - "contracts/PAIRWISE_PROTECTED_CANDIDATE_REPLAY_HARNESS_V1.json"
      - "contracts/TASK6_TRUSTED_SCHEDULE_DATE_POLICY_DESIGN_V1.json"
      - "original_request_authority_lineage_v1.py"
      - "scripts/agentdojo_clean_ab_canonical_final_runner_v2_8.py"
      - "scripts/controlled_governance_treatment_delta_analysis_audit_v1.py"
      - "scripts/pairwise_protected_candidate_control_v1_1.py"
      - "scripts/pairwise_protected_candidate_replay_harness_v1.py"
      - "scripts/task4_send_money_execution_date_authority_audit_v1.py"
  push:
    branches: [main]
    paths:
      - "contracts/TASK15_NATIVE_ADDRESS_REQUEST_PROFILE_ISSUANCE_V1.json"
      - "scripts/task15_native_address_request_profile_issuance_audit_v1.py"
      - "task15_native_address_request_profile_issuance_v1.py"
      - "tests/test_task15_native_address_request_profile_issuance_v1.py"
      - "docs/TASK15_NATIVE_ADDRESS_REQUEST_PROFILE_ISSUANCE_V1.md"
      - ".github/workflows/task15-native-address-request-profile-issuance-v1.yml"
      - "contracts/TASK15_ORIGINAL_REQUEST_NATIVE_ADDRESS_FIELD_MAPPING_V1.json"
      - "scripts/task15_original_request_native_address_field_mapping_audit_v1.py"
      - "task15_original_request_native_address_field_mapping_v1.py"
      - "tests/test_task15_original_request_native_address_field_mapping_v1.py"
      - "docs/TASK15_ORIGINAL_REQUEST_NATIVE_ADDRESS_FIELD_MAPPING_V1.md"
      - ".github/workflows/task15-original-request-native-address-field-mapping-v1.yml"
      - "contracts/CONTROLLED_CANDIDATE_BINDING_MISMATCH_CAUSE_DECOMPOSITION_V1.json"
      - "scripts/controlled_candidate_binding_mismatch_cause_decomposition_audit_v1.py"
      - "docs/CONTROLLED_CANDIDATE_BINDING_MISMATCH_CAUSE_DECOMPOSITION_V1.md"
      - ".github/workflows/controlled-candidate-binding-mismatch-cause-decomposition-v1.yml"
      - "agentdojo_constraint_resolver_v0_1.py"
      - "contracts/CONTROLLED_GOVERNANCE_TREATMENT_DELTA_ANALYSIS_V1.json"
      - "contracts/PAIRWISE_PROTECTED_CANDIDATE_REPLAY_HARNESS_V1.json"
      - "contracts/TASK6_TRUSTED_SCHEDULE_DATE_POLICY_DESIGN_V1.json"
      - "original_request_authority_lineage_v1.py"
      - "scripts/agentdojo_clean_ab_canonical_final_runner_v2_8.py"
      - "scripts/controlled_governance_treatment_delta_analysis_audit_v1.py"
      - "scripts/pairwise_protected_candidate_control_v1_1.py"
      - "scripts/pairwise_protected_candidate_replay_harness_v1.py"
      - "scripts/task4_send_money_execution_date_authority_audit_v1.py"
permissions:
  contents: read
  actions: read
jobs:
  request-profile-audit:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ""
      VERITAS_DATABASE_URL: ""
      GH_TOKEN: ${{ github.token }}
      REPLAY_ARTIFACT_ZIP: /tmp/source-controlled-replay-v1.zip
      V13_ARTIFACT_ZIP: /tmp/source-v13-execution-records.zip
      AGENTDOJO_ROOT: _pins/agentdojo
      VERITAS_ROOT: _pins/veritas
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
      - name: Verify immutable profile sources
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object contracts/TASK15_NATIVE_ADDRESS_REQUEST_PROFILE_ISSUANCE_V1.json)" = "da46a29c02d35b435370d6885475d4639f44ab34"
          test "$(git hash-object scripts/task15_native_address_request_profile_issuance_audit_v1.py)" = "b75c6628ef0ea031be841e82417863faadd9ceeb"
          echo PASS_TASK15_ADDRESS_PROFILE_SOURCE_PINS
      - name: Checkout exact native and policy source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _pins
          git clone --no-checkout https://github.com/ethz-spylab/agentdojo.git "$AGENTDOJO_ROOT"
          git -C "$AGENTDOJO_ROOT" checkout a75aba7631d3ca5fb7ab938965c97ead2f9ff84b
          git clone --no-checkout https://github.com/veritasfuji-japan/veritas_os.git "$VERITAS_ROOT"
          git -C "$VERITAS_ROOT" checkout a1d66aef02262cf8a913295270c3aafd159c6adb
      - name: Install isolated native model dependencies
        run: python -m pip install "pydantic==2.11.10" "pydantic-core==2.33.2" "annotated-types==0.8.0" "typing-extensions==4.13.2" "typing-inspection==0.4.2" "docstring-parser==0.16" "pytest==9.1.1" "iniconfig==2.3.1" "packaging==25.0" "pluggy==1.6.0" "pygments==2.21.0"
      - name: Download existing immutable evidence only
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/$GITHUB_REPOSITORY/actions/artifacts/11472402060/zip > "$REPLAY_ARTIFACT_ZIP"
          test "$(sha256sum "$REPLAY_ARTIFACT_ZIP" | awk '{print $1}')" = "449443501266eea9aa83ab08f261740acf2296787483a80853469c6a02684b95"
          gh api repos/$GITHUB_REPOSITORY/actions/artifacts/11466539107/zip > "$V13_ARTIFACT_ZIP"
          test "$(sha256sum "$V13_ARTIFACT_ZIP" | awk '{print $1}')" = "9fbb2a1614c237e92c4239bb5d60f83d40d33b81e0092d3f82958931969c9e7a"
      - name: Audit pre-generation profile and immutable pair
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          python scripts/task15_native_address_request_profile_issuance_audit_v1.py \
            --agentdojo-root "$AGENTDOJO_ROOT" \
            --veritas-root "$VERITAS_ROOT" \
            --replay-artifact "$REPLAY_ARTIFACT_ZIP" \
            --v13-artifact "$V13_ARTIFACT_ZIP" \
            --output-dir results \
            | tee results/task15-native-address-request-profile-issuance-v1.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: task15-native-address-request-profile-issuance-v1-${{ github.run_id }}
          path: |
            results/task15-native-address-request-profile-issuance-v1.*
            results/task15-original-request-native-address-field-mapping-v1.*
            results/controlled-*
          if-no-files-found: error
