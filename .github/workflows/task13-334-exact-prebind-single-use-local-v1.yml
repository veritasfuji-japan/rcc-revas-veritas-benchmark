name: Task13 334 Exact Prebind Three-Issuer Single-Use Local V1

on:
  pull_request:
    paths:
      - ".github/workflows/task13-334-exact-prebind-single-use-local-v1.yml"
      - "contracts/TASK13_334_TEST_ONLY_PREBIND_SINGLE_USE_V1.json"
      - "scripts/task13_334_exact_prebind_single_use_local_v1.py"
      - "tests/test_task13_334_exact_prebind_single_use_local_v1.py"
      - "docs/TASK13_334_TEST_ONLY_PREBIND_SINGLE_USE_V1.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-three-role-prebind-cas:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      TASK13_334_PROOF: "1"
      OPENAI_API_KEY: ""
      TASK4_OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      OPENAI_BASE_URL: ""
      GITHUB_TOKEN: ""
      GH_TOKEN: ""
      VERITAS_DATABASE_URL: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
      - name: Pin exact parent source and deny live secrets
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object scripts/task13_333_dual_issuer_provenance_preflight_v1.py)" = "a3c5d5598c77864ee18ab898c071ef859f4012d2"
          test "$(git hash-object scripts/task13_330_same_candidate_native_bind_local_v1.py)" = "89da7794ee62bf092a1a7547e1d603c8a92fcbb8"
          test "$(git hash-object sql/task4_310_offline_postgres_consume_v1.sql)" = "0b891930f50fc17747a9854666450c9438ef7945"
          for key in OPENAI_API_KEY TASK4_OPENAI_API_KEY ANTHROPIC_API_KEY OPENAI_BASE_URL GITHUB_TOKEN GH_TOKEN VERITAS_DATABASE_URL; do
            test -z "$(printenv "$key" || true)"
          done
          mkdir -p results
          git rev-parse HEAD > results/task13-334-head.txt
          echo PASS_TASK13_334_EXACT_PARENT_BLOBS_AND_ZERO_REAL_CREDENTIALS
      - name: Install local SQLite/Ed25519 test prerequisites (no Provider client)
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "pytest==9.1.1" "cryptography==50.0.1"
      - name: Verify local three-role approval and exact prebind one-use CAS
        shell: bash
        env:
          PYTHONPATH: "."
        run: |
          set -euo pipefail
          python -m pytest -q -o addopts= \
            tests/test_task13_334_exact_prebind_single_use_local_v1.py \
            --junitxml=results/task13-334-prebind-junit.xml \
            | tee results/task13-334-prebind-pytest.log
          python scripts/task13_334_exact_prebind_single_use_local_v1.py \
            --output results/task13-334-test-only-prebind.json \
            | tee results/task13-334-report.log
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          report=json.loads(Path("results/task13-334-test-only-prebind.json").read_text())
          expected=report.pop("report_sha256")
          content=json.dumps(report,sort_keys=True,separators=(",",":"),ensure_ascii=False,allow_nan=False).encode("utf-8")
          assert hashlib.sha256(content).hexdigest()==expected
          assert report["historical_execution_allowed"] is False
          assert report["archived_task13_actual_signed_receipts"]==0
          assert report["production_issuer_proven"] is False
          assert report["new_provider_requests"]==0
          assert report["new_bank_effects"]==0
          assert report["new_utility_scores"]==0
          assert report["new_injection_success_measurements"]==0
          assert report["historical_sample"]["dispatch_allowed"] is False
          assert report["live_dispatch"]=="DENY"
          print("TASK13_334_EPHEMERAL_ATOMIC_PREBIND_CAS_NO_REAL_AUTHORITY_NO_DISPATCH")
          PY
          sha256sum \
            contracts/TASK13_334_TEST_ONLY_PREBIND_SINGLE_USE_V1.json \
            scripts/task13_334_exact_prebind_single_use_local_v1.py \
            tests/test_task13_334_exact_prebind_single_use_local_v1.py \
            results/task13-334-test-only-prebind.json \
            > results/task13-334-evidence-file-sha256.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: task13-334-test-only-three-role-prebind-cas-evidence
          path: results/*
          if-no-files-found: warn
