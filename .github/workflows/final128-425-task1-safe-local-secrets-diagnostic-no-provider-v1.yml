name: Task1 425 SAFE NO PAID Environment Secret Format Diagnostic
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: task1-425-safe-no-paid-diagnostic
  cancel-in-progress: false

jobs:
  local-secret-format-only-no-provider:
    if: github.actor == 'veritasfuji-japan' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: task1-real-model-pilot
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check Task1 Environment secret formats locally; no API and no GitHub ref write
        shell: bash
        env:
          TASK1_OPENAI_API_KEY: ${{ secrets.TASK1_OPENAI_API_KEY }}
          TASK1_CAPTURE_AES256_KEY: ${{ secrets.TASK1_CAPTURE_AES256_KEY }}
        run: |
          set -euo pipefail
          # Pure Python stdlib, fixed-category stdout. No credential data or
          # secret-derived metadata is sent anywhere, logged or uploaded.
          python3 scripts/final128_425_task1_local_secret_format_diagnostic_v1.py
