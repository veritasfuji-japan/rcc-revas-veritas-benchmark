name: Final 128 Real Wrapper V3 Audit
on:
  pull_request:
    paths:
      - "scripts/final_128_real_provider_wrapper_v3.py"
      - ".github/workflows/final-128-real-wrapper-v3-audit.yml"
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ""
      VERITAS_DATABASE_URL: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11.16"}
      - name: Provider-disabled static and audit preflight
        run: |
          python -m py_compile scripts/final_128_real_provider_wrapper_v3.py
          python scripts/final_128_real_provider_wrapper_v3.py > /tmp/audit.json
          python - <<'PY'
          import json
          x=json.load(open("/tmp/audit.json"))
          assert x["mode"]=="AUDIT_ONLY"
          assert x["v5_exists"] is False
          assert x["database_write"]==0
          assert x["provider_credential_access"]==0
          assert x["provider_api_calls"]==0
          assert x["final_128_execution"]==0
          print("PASS_FINAL_128_REAL_WRAPPER_V3_AUDIT")
          PY
