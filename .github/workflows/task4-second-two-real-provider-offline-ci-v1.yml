name: Task4 Second Real Two Call Sender Offline CI V1
on:
  pull_request:
    paths:
      - ".github/workflows/task4-second-two-real-provider-v1.yml"
      - ".github/workflows/task4-second-two-real-provider-offline-ci-v1.yml"
      - "scripts/task4_live_second_two_call_capture_oneuse_v1.py"
      - "tests/test_task4_live_second_two_call_capture_oneuse_v1.py"
      - "contracts/TASK4_LIVE_SECOND_TWO_CALL_CAPTURE_ONEUSE_V1.json"
      - "docs/TASK4_LIVE_SECOND_TWO_CALL_CAPTURE_ONEUSE_V1.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/task4-second-two-real-provider-v1.yml"
      - ".github/workflows/task4-second-two-real-provider-offline-ci-v1.yml"
      - "scripts/task4_live_second_two_call_capture_oneuse_v1.py"
      - "tests/test_task4_live_second_two_call_capture_oneuse_v1.py"
      - "contracts/TASK4_LIVE_SECOND_TWO_CALL_CAPTURE_ONEUSE_V1.json"
      - "docs/TASK4_LIVE_SECOND_TWO_CALL_CAPTURE_ONEUSE_V1.md"

permissions:
  contents: read
  actions: read
jobs:
  second-two-offline-only-sender-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      OPENAI_API_KEY: ""
      TASK4_OPENAI_API_KEY: ""
      OPENAI_BASE_URL: ""
      TASK4_SECOND_TWO_SENDER_OFFLINE_TEST: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PYTEST_ADDOPTS: ""
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
      - name: Download immutable #296 source Artifact and verify full ZIP and JSON byte SHA256
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source results
          curl --fail --silent --show-error --location --retry 0 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/11674814494/zip" \
            -o source/real-source-second.zip
          echo "5e060179f7c0419d5a2b3d49587dba4d1e93f7adc8c0a41ddac1bb689813a609  source/real-source-second.zip" | sha256sum -c -
          unzip -q source/real-source-second.zip -d source/extracted
          echo "d31e2f9781ba3f1de33b04bbac382bc1664588ad7533d83eb13f7f7fec6be6d5  source/extracted/task4-pinned-second-preflight-full-A-B-requests.json" | sha256sum -c -
          echo "TASK4_SECOND_TWO_SOURCE_FILE=$PWD/source/extracted/task4-pinned-second-preflight-full-A-B-requests.json" >> "$GITHUB_ENV"
      - name: Offline isolated pytest only, without live Provider key
        shell: bash
        run: |
          set -euo pipefail
          pip install "pytest==9.1.1"
          python -m pytest -q -o addopts= \
            tests/test_task4_live_second_two_call_capture_oneuse_v1.py \
            --junitxml=results/task4-second-two-offline-junit.xml \
            | tee results/task4-second-two-offline-tests.log
          python scripts/task4_live_second_two_call_capture_oneuse_v1.py \
            --mode preflight --source "$TASK4_SECOND_TWO_SOURCE_FILE" \
            --output results/task4-second-two-frozen-preflight.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: task4-second-two-real-provider-v1-OFFLINE-ONLY
          path: results/*
          if-no-files-found: warn
