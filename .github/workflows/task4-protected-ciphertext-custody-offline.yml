name: Task4 Protected Ciphertext Custody Offline NO-GO
on:
  pull_request:
    paths:
      - 'scripts/task4_protected_ciphertext_custody_v1.py'
      - 'tests/test_task4_protected_ciphertext_custody_v1.py'
      - 'docs/TASK4_PROTECTED_CIPHERTEXT_CUSTODY_OFFLINE_V1.md'
      - '.github/workflows/task4-protected-ciphertext-custody-offline.yml'
permissions:
  contents: read
jobs:
  offline-custody:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OPENAI_API_KEY: ''
      TASK4_OPENAI_API_KEY: ''
      ANTHROPIC_API_KEY: ''
      OPENAI_BASE_URL: ''
      VERITAS_DATABASE_URL: ''
      TASK4_CUSTODY_LIVE: ''
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTEST_ADDOPTS: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install test and crypto dependencies
        run: python -m pip install 'pytest==9.1.1' 'cryptography==50.0.0'
      - name: Signed custody, separate process restart and recipient recovery
        run: |
          mkdir -p results
          python -m pytest -q -o addopts= tests/test_task4_protected_ciphertext_custody_v1.py --junitxml=results/custody-junit.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: task4-protected-custody-offline-junit
          path: results/custody-junit.xml
          if-no-files-found: error
