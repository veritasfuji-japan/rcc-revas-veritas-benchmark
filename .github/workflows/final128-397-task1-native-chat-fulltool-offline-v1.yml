name: Final128 397 Task1 Native Chat Full Tool A/B Offline
on:
  pull_request:
    paths:
      - ".github/workflows/final128-397-task1-native-chat-fulltool-offline-v1.yml"
      - "scripts/final128_397_task1_native_chat_fulltool_ab_offline_v1.py"
      - "tests/test_final128_397_task1_native_chat_fulltool_ab_offline_v1.py"
      - "docs/optimization/FINAL128_397_TASK1_NATIVE_CHAT_FULLTOOL_AB_OFFLINE_V1.md"
permissions:
  contents: read
jobs:
  native-chat-fulltool-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: "."
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      FINAL128_397_AGENTDOJO_ROOT: "_pins/agentdojo"
      FINAL128_396_AGENTDOJO_ROOT: "_pins/agentdojo"
      FINAL128_395_AGENTDOJO_ROOT: "_pins/agentdojo"
      FINAL128_394_AGENTDOJO_ROOT: "_pins/agentdojo"
      FINAL128_381_AGENTDOJO_ROOT: "_pins/agentdojo"
      FINAL128_378_AGENTDOJO_ROOT: "_pins/agentdojo"
      FINAL128_377_AGENTDOJO_ROOT: "_pins/agentdojo"
      OPENAI_API_KEY: ""
      TASK4_OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      OPENAI_BASE_URL: ""
      GH_TOKEN: ""
      GITHUB_TOKEN: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ethz-spylab/agentdojo
          ref: a75aba7631d3ca5fb7ab938965c97ead2f9ff84b
          path: _pins/agentdojo
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
      - name: Exact Native PIN and zero authorized secrets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git rev-parse HEAD > results/final128-397-exact-head.txt
          test "$(git -C _pins/agentdojo rev-parse HEAD)" = "a75aba7631d3ca5fb7ab938965c97ead2f9ff84b"
          test "$(git -C _pins/agentdojo hash-object src/agentdojo/default_suites/v1/tools/banking_client.py)" = "941c27467b7890cced7ab70e5fd5ca32241f99a5"
          for key in OPENAI_API_KEY TASK4_OPENAI_API_KEY ANTHROPIC_API_KEY OPENAI_BASE_URL GH_TOKEN GITHUB_TOKEN; do
            test -z "$(printenv "$key" || true)"
          done
          python -m py_compile \
            scripts/final128_397_task1_native_chat_fulltool_ab_offline_v1.py \
            tests/test_final128_397_task1_native_chat_fulltool_ab_offline_v1.py
      - name: Install frozen AgentDojo and pytest
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "pytest==9.1.1"
          python -m pip install --disable-pip-version-check -e _pins/agentdojo
      - name: Native Chat full-tool parity and earlier native scorer isolation
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q -o addopts= \
            tests/test_final128_397_task1_native_chat_fulltool_ab_offline_v1.py \
            tests/test_final128_396_task1_native_canonical_fidelity_gate_v1.py \
            tests/test_final128_395_task1_offline_native_postterminal_scorer_gate_v1.py \
            tests/test_final128_394_task1_paired_second_turn_terminal_quarantine_v1.py \
            tests/test_final128_381_task1_real_responses_capture_contract_v1.py \
            tests/test_final128_378_native_paired_model_input_seam_v1.py \
            tests/test_final128_377_native_preterminal_spending_projection_v1.py \
            --junitxml=results/final128-397-junit.xml | tee results/final128-397-tests.log
      - name: Fail if any test skipped and write non-sensitive source proof
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,xml.etree.ElementTree as ET
          from pathlib import Path
          from agentdojo.task_suite.load_suites import get_suite
          from scripts import final128_397_task1_native_chat_fulltool_ab_offline_v1 as m
          from scripts import final128_396_task1_native_canonical_fidelity_gate_v1 as prior
          root=ET.parse("results/final128-397-junit.xml").getroot()
          suites=[root] if root.tag=="testsuite" else list(root.findall("testsuite"))
          assert suites
          counts={k:sum(int(s.get(k,"0")) for s in suites)
                  for k in ("tests","failures","errors","skipped")}
          assert counts["tests"]>=200
          assert all(counts[k]==0 for k in ("failures","errors","skipped"))
          native=prior._frozen_native_profile(get_suite("v1.2.2","banking"))
          assert native["native_declared_tool_count"]>1
          assert native["native_has_write_tool"] is True
          report={
            "schema":"veritas.final128.task1-397-offline-native-chat-fulltool-evidence.v1",
            "head":Path("results/final128-397-exact-head.txt").read_text().strip(),
            "agentdojo_pin":m.PIN,
            "native_full_tool_catalog_sha256":native["tool_schema_hash"],
            "native_full_tool_count":native["native_declared_tool_count"],
            "native_chat_completions_full_tool_source_used":True,
            "native_auto_tool_choice_not_forced_final":True,
            "A_B_independent_source_owned_fixture_checks":True,
            "A_B_first_request_and_attack_result_parity_tested":True,
            "native_write_tool_names_advertised_but_no_write_executed":True,
            "B_effectful_pre_dispatch_inspection_is_noop_only":True,
            "B_developer_role_placement_canonical_validation":False,
            "canonical_frozen_case_enrollment_verified":False,
            "genuine_provider_A_B_sessions":0,
            "live_provider_calls":0,
            "official_native_utility_scores":None,
            "official_native_attack_scores":None,
            "protected_external_single_use_issuer_proven":False,
            "fresh_paid_spend_approved":False,
            "production_native_effects":0,
            "JUnit":counts,
          }
          canonical=lambda x:json.dumps(x,sort_keys=True,separators=(",",":"),
                                        allow_nan=False).encode()
          report["sha256"]=hashlib.sha256(canonical(report)).hexdigest()
          Path("results/final128-397-redacted-native-fulltool.json").write_text(
            json.dumps(report,sort_keys=True,indent=2)+"\n")
          print("397_NATIVE_CHAT_FULL_TOOL_AB_OFFLINE_ONLY_NO_LIVE_OR_OFFICIAL_SCORE")
          PY
          sha256sum \
            scripts/final128_397_task1_native_chat_fulltool_ab_offline_v1.py \
            tests/test_final128_397_task1_native_chat_fulltool_ab_offline_v1.py \
            docs/optimization/FINAL128_397_TASK1_NATIVE_CHAT_FULLTOOL_AB_OFFLINE_V1.md \
            results/final128-397-redacted-native-fulltool.json \
            results/final128-397-junit.xml > results/final128-397-sha256.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: final128-397-task1-native-fulltool-chat-offline-no-real-model
          path: results/final128-397-*
          if-no-files-found: warn
