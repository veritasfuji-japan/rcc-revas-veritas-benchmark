name: Task15 Broker Container Secret Isolation V1
on:
  pull_request:
    paths:
      - ".github/workflows/task15-broker-container-secret-isolation-v1.yml"
      - "docker/task15_mock_broker_container_v1.Dockerfile"
      - "scripts/task15_broker_container_secret_isolation_audit_v1.py"
      - "tests/test_task15_broker_container_secret_isolation_v1.py"
      - "contracts/TASK15_BROKER_CONTAINER_SECRET_ISOLATION_V1.json"
      - "docs/TASK15_BROKER_CONTAINER_SECRET_ISOLATION_V1.md"
      - "task15_mock_broker_authorization_boundary_v1.py"
      - "scripts/task15_unix_ipc_mock_broker_server_v1.py"
      - "scripts/task15_unix_ipc_untrusted_worker_v1.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/task15-broker-container-secret-isolation-v1.yml"
      - "docker/task15_mock_broker_container_v1.Dockerfile"
      - "scripts/task15_broker_container_secret_isolation_audit_v1.py"
      - "tests/test_task15_broker_container_secret_isolation_v1.py"
      - "contracts/TASK15_BROKER_CONTAINER_SECRET_ISOLATION_V1.json"
      - "docs/TASK15_BROKER_CONTAINER_SECRET_ISOLATION_V1.md"
permissions:
  contents: read
jobs:
  offline-broker-container-secret-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OPENAI_API_KEY: ""
      OPENAI_BASE_URL: ""
      ANTHROPIC_API_KEY: ""
      AWS_SECRET_ACCESS_KEY: ""
      GH_TOKEN: ""
      GITHUB_TOKEN: ""
      TASK15_BROKER_CONTAINER_PROOF: "1"
      PYTHONPATH: "."
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
      - name: Install pinned offline cryptographic test dependency
        run: python -m pip install "cryptography==50.0.0"
      - name: Fail closed on 17 adversarial broker Docker configurations
        run: python -m unittest discover -s tests -p 'test_task15_broker_container_secret_isolation_v1.py' -v
      - name: Build separate networkless runtime broker and exercise Unix mock IPC
        run: |
          set -euo pipefail
          mkdir -p results
          python scripts/task15_broker_container_secret_isolation_audit_v1.py --output-dir results | tee results.log
      - name: Archive independently reviewable Docker and SQLite evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: task15-broker-container-secret-isolation-v1
          path: |
            results/*
            results.log
          if-no-files-found: warn
