name: AgentDojo Task2 Full Bind Offline Proof v0.1
on:
  pull_request:
    paths:
      - "agentdojo_constraint_resolver_v0_1.py"
      - "scripts/agentdojo_task2_full_bind_offline_proof_v0_1.py"
      - "contracts/AGENTDOJO_TASK2_FULL_BIND_OFFLINE_PROOF_v0.1.json"
      - ".github/workflows/agentdojo-task2-full-bind-offline-proof-v0_1.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: veritasfuji-japan/veritas_os
          ref: a1d66aef02262cf8a913295270c3aafd159c6adb
          path: _pins/veritas
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact VERITAS pin
        run: test "$(git -C _pins/veritas rev-parse HEAD)" = "a1d66aef02262cf8a913295270c3aafd159c6adb"
      - name: Install offline proof dependencies
        run: pip install pydantic cryptography PyYAML
      - name: Run task2 cross-repository offline proof
        run: python scripts/agentdojo_task2_full_bind_offline_proof_v0_1.py --veritas-root _pins/veritas
