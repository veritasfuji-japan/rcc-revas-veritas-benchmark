name: Task4 470 Capped Native Sender Attempt Local Broker OFFLINE NO-GO
on:
  pull_request:
    paths:
      - 'scripts/task4_470_capped_native_local_sender_preflight_no_go_v1.py'
      - 'tests/test_task4_470_capped_native_local_sender_preflight_no_go_v1.py'
      - 'docs/TASK4_470_CAPPED_NATIVE_SENDER_ATTEMPT_PREFLIGHT_NO_GO_V1.md'
      - '.github/workflows/task4-470-capped-native-local-attempt-nogo.yml'

permissions:
  contents: read

jobs:
  capped-native-sdk-request-local-broker-consumption:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OPENAI_API_KEY: ''
      TASK4_OPENAI_API_KEY: ''
      ANTHROPIC_API_KEY: ''
      OPENAI_BASE_URL: ''
      VERITAS_DATABASE_URL: ''
      GITHUB_TOKEN: ''
      GH_TOKEN: ''
      TASK4_470_PAID_APPROVAL: ''
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTEST_ADDOPTS: ''
      PYTHONNOUSERSITE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      TASK4_470_NATIVE_PROOF: '1'
      TASK4_NATIVE_DATE_PROOF: '1'
      TASK4_TRANSPORT_PROOF: '1'
      TASK4_TRAJECTORY_PROOF: '1'
      TASK4_SCORER_OBSERVATION_PROOF: '1'
      TASK4_RCC_ROOT: '_pins/rcc'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Checkout exact public frozen benchmark sources, read-only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _pins results
          git clone https://github.com/ethz-spylab/agentdojo.git _pins/agentdojo
          git -C _pins/agentdojo checkout a75aba7631d3ca5fb7ab938965c97ead2f9ff84b
          git clone https://github.com/effacermonexistence/rcc-revas-veritas-benchmark.git _pins/rcc
          git -C _pins/rcc checkout 1d3782d3aae5ff9c88036709c1a5642320cc53c2
          git clone https://github.com/veritasfuji-japan/veritas_os.git _pins/veritas
          git -C _pins/veritas checkout a1d66aef02262cf8a913295270c3aafd159c6adb
          test "$(git -C _pins/agentdojo rev-parse HEAD)" = 'a75aba7631d3ca5fb7ab938965c97ead2f9ff84b'
          test "$(git -C _pins/rcc rev-parse HEAD)" = '1d3782d3aae5ff9c88036709c1a5642320cc53c2'
          test "$(git -C _pins/veritas rev-parse HEAD)" = 'a1d66aef02262cf8a913295270c3aafd159c6adb'
      - name: Install pinned offline SDK and Native test dependencies
        shell: bash
        run: |
          set -euo pipefail
          pip install --no-deps -e ./_pins/agentdojo -e ./_pins/veritas
          pip install 'pytest==9.1.1' 'cryptography==50.0.0' 'openai==1.109.1' 'pydantic==2.11.10' 'idna==3.15' 'httpx==0.28.1' 'requests==2.34.2' 'PyYAML==6.0.3'
          python scripts/final_128_v12_locked_agentdojo_requirements_v1.py \
            --lock _pins/agentdojo/uv.lock \
            --output /tmp/task4-470-agentdojo-locked.txt
          pip install -r /tmp/task4-470-agentdojo-locked.txt
      - name: Enforce output-capped actual Native SDK attempts and Broker no-replay
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q -o addopts= \
            tests/test_task4_470_capped_native_local_sender_preflight_no_go_v1.py \
            --junitxml=results/task4-470-capped-native-broker-junit.xml \
            | tee results/task4-470-tests.log
          python -m scripts.task4_470_capped_native_local_sender_preflight_no_go_v1 \
            --output results/task4-470-hash-only-no-go.json
          python - <<'PY'
          import json
          r=json.load(open('results/task4-470-hash-only-no-go.json'))
          assert r['real_sdk_capped_native_attempts'] == 8
          assert r['local_broker_replay_denied_after_restart'] == 8
          assert r['separate_scripted_native_arm_terminals'] == 2
          assert r['scripted_native_scorer_invocations'] == 2
          assert r['sdk_output_tokens_cap_each_request'] == 256
          assert r['max_trial_attempts_planning_only'] == 10
          assert len(r['hash_only_local_attempt_receipts']) == 8
          assert r['same_run_capped_sdk_and_aead_response_custody_proven'] is False
          assert r['provider_input_token_cap_proven'] is False
          assert r['official_provider_billing_hard_cap_proven'] is False
          assert r['genuine_model_responses'] == 0
          assert r['genuine_native_utility'] is None
          assert r['native_score_status'] == 'UNSCORED'
          assert r['real_provider_posts'] == r['external_bank_effects'] == 0
          assert r['real_provider_dispatch'] == 'DENY'
          print('TASK4_470_CAPPED_NATIVE_SDK_BROKER_BEFORE_LOCAL_MODEL_NO_PROVIDER')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: task4-470-capped-native-attempt-broker-no-go-junit-hashes
          path: results/*
          if-no-files-found: warn
