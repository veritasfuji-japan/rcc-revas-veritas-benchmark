name: AgentDojo Native Scorer Freeze v0.1
on:
  pull_request:
permissions:
  contents: read
jobs:
  scorer-freeze:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ethz-spylab/agentdojo
          ref: a75aba7631d3ca5fb7ab938965c97ead2f9ff84b
          path: _pins/agentdojo
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.16"
      - run: python -m pip install -e _pins/agentdojo pytest
      - run: test "$(git -C _pins/agentdojo rev-parse HEAD)" = "a75aba7631d3ca5fb7ab938965c97ead2f9ff84b"
      - run: PYTHONPATH=. pytest -q tests/test_agentdojo_native_scorer_invocation_v0_1.py
      - run: python -c 'import json; c=json.load(open("contracts/AGENTDOJO_NATIVE_SCORER_FREEZE_v0.1.json")); assert c["execution_gate"]=="CLOSED" and c["api_called"] is False and c["clean_ab_executed"] is False'
