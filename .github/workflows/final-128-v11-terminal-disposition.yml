name: Final 128 V11 Terminal Disposition
on:
  pull_request:
    paths:
      - "contracts/AGENTDOJO_FINAL_128_V11_TERMINAL_DISPOSITION_v1.json"
      - "scripts/final_128_v11_terminal_disposition_audit_v1.py"
      - ".github/workflows/final-128-v11-terminal-disposition.yml"
permissions: {contents: read}
jobs:
  terminal:
    runs-on: ubuntu-latest
    env:
      VERITAS_DATABASE_URL: ${{ secrets.VERITAS_ATOMIC_CONSUMPTION_DATABASE_URL }}
      OPENAI_API_KEY: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.11.16"}
      - name: Install read-only database client
        run: pip install "psycopg[binary]==3.2.9"
      - name: Audit terminal V11 disposition
        run: python scripts/final_128_v11_terminal_disposition_audit_v1.py
