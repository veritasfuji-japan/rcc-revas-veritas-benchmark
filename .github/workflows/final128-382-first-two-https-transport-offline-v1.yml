name: Final128 382 Task1 First Two HTTPS Transport Offline CI
on:
  pull_request:
    paths:
      - ".github/workflows/final128-382-first-two-https-transport-offline-v1.yml"
      - "scripts/final128_382_first_two_responses_once_transport_v1.py"
      - "tests/test_final128_382_first_two_responses_once_transport_v1.py"
      - "docs/optimization/FINAL128_382_FIRST_TWO_RESPONSES_ONCE_TRANSPORT_NO_LIVE_V1.md"
      - "scripts/final128_381_task1_real_responses_capture_contract_v1.py"
      - "scripts/final128_350_task1_responses_once_budget_v1.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/final128-382-first-two-https-transport-offline-v1.yml"
      - "scripts/final128_382_first_two_responses_once_transport_v1.py"
      - "tests/test_final128_382_first_two_responses_once_transport_v1.py"
      - "docs/optimization/FINAL128_382_FIRST_TWO_RESPONSES_ONCE_TRANSPORT_NO_LIVE_V1.md"
permissions:
  contents: read
jobs:
  task1-first-two-https-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      FINAL128_381_AGENTDOJO_ROOT: "_pins/agentdojo"
      FINAL128_380_AGENTDOJO_ROOT: "_pins/agentdojo"
      FINAL128_379_AGENTDOJO_ROOT: "_pins/agentdojo"
      FINAL128_378_AGENTDOJO_ROOT: "_pins/agentdojo"
      FINAL128_377_AGENTDOJO_ROOT: "_pins/agentdojo"
      OPENAI_API_KEY: ""
      TASK4_OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      OPENAI_BASE_URL: ""
      GITHUB_TOKEN: ""
      GH_TOKEN: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ethz-spylab/agentdojo
          ref: a75aba7631d3ca5fb7ab938965c97ead2f9ff84b
          path: _pins/agentdojo
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
      - name: Require immutable sources, empty API credentials and local-only test mode
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git -C _pins/agentdojo rev-parse HEAD)" = "a75aba7631d3ca5fb7ab938965c97ead2f9ff84b"
          test "$(git -C _pins/agentdojo hash-object src/agentdojo/default_suites/v1/tools/banking_client.py)" = "941c27467b7890cced7ab70e5fd5ca32241f99a5"
          for secret in OPENAI_API_KEY TASK4_OPENAI_API_KEY ANTHROPIC_API_KEY OPENAI_BASE_URL GITHUB_TOKEN GH_TOKEN; do
            test -z "$(printenv "$secret" || true)"
          done
          python -m py_compile \
            scripts/final128_382_first_two_responses_once_transport_v1.py \
            scripts/final128_381_task1_real_responses_capture_contract_v1.py \
            tests/test_final128_382_first_two_responses_once_transport_v1.py
          mkdir -p results
          git rev-parse HEAD > results/final128-382-exact-head.txt
      - name: Install frozen Native AgentDojo and pytest
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check "pytest==9.1.1"
          python -m pip install --disable-pip-version-check -e _pins/agentdojo
      - name: Exact POST to fake transport, nonretry failures and inherited native gates
        shell: bash
        env:
          PYTHONPATH: "."
        run: |
          set -euo pipefail
          python -m pytest -q -o addopts= \
            tests/test_final128_382_first_two_responses_once_transport_v1.py \
            tests/test_final128_381_task1_real_responses_capture_contract_v1.py \
            tests/test_final128_380_mock_call_id_native_continuity_v1.py \
            tests/test_final128_379_task1_native_mock_provider_bridge_v1.py \
            tests/test_final128_378_native_paired_model_input_seam_v1.py \
            tests/test_final128_377_native_preterminal_spending_projection_v1.py \
            tests/test_final128_350_task1_responses_once_budget_v1.py \
            tests/test_final128_351_task1_durable_lease_preflight_v1.py \
            --junitxml=results/final128-382-junit.xml \
            | tee results/final128-382-tests.log
          python - <<'PY'
          import json,hashlib,xml.etree.ElementTree as ET
          from pathlib import Path
          from scripts.final128_382_first_two_responses_once_transport_v1 import prepare_two_first_packets
          from scripts.final128_381_task1_real_responses_capture_contract_v1 import first_real_wire_packet,sha
          root=ET.parse("results/final128-382-junit.xml").getroot()
          suites=[root] if root.tag=="testsuite" else list(root.findall("testsuite"))
          assert suites
          counts={k:sum(int(s.attrib.get(k,"0")) for s in suites) for k in ("tests","failures","errors","skipped")}
          assert counts["tests"]>=200
          assert all(counts[k]==0 for k in ("failures","errors","skipped"))
          manifest=prepare_two_first_packets()
          assert manifest["max_first_two_provider_attempts_proposed"]==2
          assert manifest["live_dispatch_authorized"] is False
          assert manifest["consumed_protected_global_lease"] is False
          assert manifest["project_hard_spend_stop_verified"] is False
          proof={
            "schema":"veritas.final128.task1-382-first-two-https-offline-evidence.v1",
            "exact_head":Path("results/final128-382-exact-head.txt").read_text().strip(),
            "agentdojo_pin":"a75aba7631d3ca5fb7ab938965c97ead2f9ff84b",
            "tests":counts,
            "first_real_api_packet_sha256":sha(first_real_wire_packet()),
            "presend_manifest":manifest,
            "real_Provider_posts":0,
            "real_Provider_TLS_receipts":0,
            "real_protected_lease_consumptions":0,
            "native_bank_writes":0,
            "native_scorer_invocations":0,
            "new_utility_scores":None,
            "mock_HTTP_raw_response_bodies_archived":False,
          }
          compact=lambda obj:json.dumps(obj,sort_keys=True,separators=(",",":"),allow_nan=False).encode()
          proof["sha256"]=hashlib.sha256(compact(proof)).hexdigest()
          Path("results/final128-382-offline-https-capture-evidence.json").write_text(
            json.dumps(proof,indent=2,sort_keys=True)+"\n")
          print("FINAL128_382_HTTPS_POST_LOCAL_TRANSPORT_ONLY_NO_LIVE_ISSUER_NO_NATIVE_SCORE")
          PY
          sha256sum \
            scripts/final128_382_first_two_responses_once_transport_v1.py \
            tests/test_final128_382_first_two_responses_once_transport_v1.py \
            docs/optimization/FINAL128_382_FIRST_TWO_RESPONSES_ONCE_TRANSPORT_NO_LIVE_V1.md \
            results/final128-382-offline-https-capture-evidence.json \
            results/final128-382-junit.xml > results/final128-382-source-evidence-sha256.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: final128-382-first-two-https-offline-no-score
          path: results/final128-382-*
          if-no-files-found: warn
