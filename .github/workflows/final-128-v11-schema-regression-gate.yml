name: Final 128 V11 Schema Regression Gate
on:
  pull_request:
    paths:
      - "contracts/AGENTDOJO_FINAL_128_V11_SCHEMA_REGRESSION_GATE_v1.json"
      - "scripts/final_128_v11_schema_regression_gate_audit_v1.py"
      - ".github/workflows/final-128-v11-schema-regression-gate.yml"
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ""
      VERITAS_DATABASE_URL: ""
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/final_128_v11_schema_regression_gate_audit_v1.py
