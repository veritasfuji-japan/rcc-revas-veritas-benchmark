name: Final128 356 Task1 Actual Run-Bound Ruleset Readback
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-run-bound-readback:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      GH_RULESET_READ_TOKEN: ${{ github.token }}
      OPENAI_API_KEY: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
      - name: Read-only inspect ruleset for actual run-bound tag
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]{5,19}$ ]] || exit 1
          TAG="final128-task1-real-ab-once-v1-${GITHUB_SHA}-${GITHUB_RUN_ID}"
          python -m scripts.final128_355_task1_live_ruleset_evidence_v1 --tag-name "$TAG" --output task1-ruleset-readback.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success()
        with:
          name: task1-actual-run-bound-ruleset-readback
          path: task1-ruleset-readback.json
          retention-days: 30
