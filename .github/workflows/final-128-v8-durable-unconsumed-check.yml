name: Final 128 V8 Durable Unconsumed Check
on:
  pull_request:
    paths:
      - "scripts/final_128_v8_durable_unconsumed_check_v1.py"
      - ".github/workflows/final-128-v8-durable-unconsumed-check.yml"
  workflow_dispatch:
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      VERITAS_DATABASE_URL: ${{ secrets.VERITAS_ATOMIC_CONSUMPTION_DATABASE_URL }}
      OPENAI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11.16"}
      - name: Checkout exact VERITAS pin
        run: |
          mkdir -p _pins
          git clone https://github.com/veritasfuji-japan/veritas_os.git _pins/veritas
          git -C _pins/veritas checkout a1d66aef02262cf8a913295270c3aafd159c6adb
      - name: Install bounded DB check profile
        run: |
          pip install --no-deps -e ./_pins/veritas
          pip install "psycopg[binary]==3.2.9" "psycopg-pool==3.2.6" "alembic==1.18.4" "cryptography==50.0.0" "pydantic==2.11.10"
      - name: Check V8 durable row is absent
        run: python scripts/final_128_v8_durable_unconsumed_check_v1.py
