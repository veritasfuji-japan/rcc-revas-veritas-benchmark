name: Task4 Pinned Second Model Request Preflight V1
on:
  pull_request:
    paths:
      - "task4_pinned_second_model_requests_preflight_v1.py"
      - "tests/test_task4_pinned_second_model_requests_preflight_v1.py"
      - "scripts/task4_pinned_second_model_requests_preflight_audit_v1.py"
      - "contracts/TASK4_PINNED_SECOND_MODEL_REQUESTS_PREFLIGHT_V1.json"
      - "docs/TASK4_PINNED_SECOND_MODEL_REQUESTS_PREFLIGHT_V1.md"
      - ".github/workflows/task4-pinned-second-model-requests-preflight-v1.yml"
  push:
    branches: [main]
    paths:
      - "task4_pinned_second_model_requests_preflight_v1.py"
      - "tests/test_task4_pinned_second_model_requests_preflight_v1.py"
      - "scripts/task4_pinned_second_model_requests_preflight_audit_v1.py"
      - "contracts/TASK4_PINNED_SECOND_MODEL_REQUESTS_PREFLIGHT_V1.json"
      - "docs/TASK4_PINNED_SECOND_MODEL_REQUESTS_PREFLIGHT_V1.md"
      - ".github/workflows/task4-pinned-second-model-requests-preflight-v1.yml"
permissions:
  contents: read
  actions: read
jobs:
  task4-pinned-second-model-preflight-no-send:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    env:
      OPENAI_API_KEY: ""
      TASK4_OPENAI_API_KEY: ""
      OPENAI_BASE_URL: ""
      ANTHROPIC_API_KEY: ""
      VERITAS_DATABASE_URL: ""
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PYTEST_ADDOPTS: ""
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
      - name: Fetch exact previously audited real first-native read artifact; NO OpenAI secret
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source results
          curl --fail --silent --show-error --location --retry 0 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/11674688715/zip" \
            -o source/task4-real-first-native-iban.zip
          echo "4dae35268cfa102ce5ddf3c7c54cbbcecb2bacd44141436c9ae7b86c27494a02  source/task4-real-first-native-iban.zip" | sha256sum -c -
      - name: Install local offline-only pytest
        shell: bash
        run: |
          set -euo pipefail
          pip install "pytest==9.1.1"
      - name: Independently freeze 2 exact original A/B second model inputs, never send
        env:
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
        shell: bash
        run: |
          set -euo pipefail
          python scripts/task4_pinned_second_model_requests_preflight_audit_v1.py \
            --source-zip source/task4-real-first-native-iban.zip \
            --output-dir results | tee results/task4-pinned-second-preflight-ci.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: task4-pinned-second-model-requests-preflight-v1
          path: results/*
          if-no-files-found: warn
