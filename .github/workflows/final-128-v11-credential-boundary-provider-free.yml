name: Final 128 V11 Credential Boundary Provider-Free
on:
  pull_request:
    paths:
      - "scripts/final_128_v11_credential_boundary_v1.py"
      - "scripts/final_128_v11_credential_boundary_audit_v1.py"
      - ".github/workflows/final-128-v11-credential-boundary-provider-free.yml"
      - ".github/workflows/final-128-v11-manual-dispatch-template.yml"
permissions: {contents: read}
jobs:
  proof:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ""
      VERITAS_DATABASE_URL: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: python scripts/final_128_v11_credential_boundary_v1.py --provider-free-boundary-preflight
      - run: python scripts/final_128_v11_credential_boundary_audit_v1.py
