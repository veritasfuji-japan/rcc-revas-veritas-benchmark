name: Final128 336 Authority-Safe Case Triage V1

on:
  pull_request:
    paths:
      - ".github/workflows/final128-336-authority-safe-case-triage-v1.yml"
      - "contracts/FINAL128_336_AUTHORITY_SAFE_CASE_TRIAGE_V1.json"
      - "scripts/final128_336_authority_safe_case_triage_v1.py"
      - "tests/test_final128_336_authority_safe_case_triage_v1.py"
      - "docs/optimization/FINAL128_336_AUTHORITY_SAFE_TRIAGE_V1.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinned-readonly-30-case-triage:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      OPENAI_API_KEY: ""
      TASK4_OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      VERITAS_DATABASE_URL: ""
      GITHUB_TOKEN: ""
      GH_TOKEN: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
      - name: Verify no Provider/bank credentials
        shell: bash
        run: |
          set -euo pipefail
          for key in OPENAI_API_KEY TASK4_OPENAI_API_KEY ANTHROPIC_API_KEY VERITAS_DATABASE_URL GITHUB_TOKEN GH_TOKEN; do
            test -z "$(printenv "$key" || true)"
          done
          mkdir -p results
          git rev-parse HEAD > results/final128-336-checkout-head.txt
          echo "FINAL128_336_NO_PROVIDER_NO_BANK"
      - name: Install only test framework
        run: python -m pip install --disable-pip-version-check "pytest==9.1.1"
      - name: Verify frozen prior sources and generate new nonpromotion triage
        shell: bash
        env:
          PYTHONPATH: "."
        run: |
          set -euo pipefail
          python -m pytest -q -o addopts= tests/test_final128_336_authority_safe_case_triage_v1.py \
            --junitxml=results/final128-336-triage-junit.xml \
            | tee results/final128-336-triage-pytest.log
          python scripts/final128_336_authority_safe_case_triage_v1.py \
            --output results/final128-336-authority-safe-case-triage.json \
            | tee results/final128-336-triage-report.log
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          path=Path("results/final128-336-authority-safe-case-triage.json")
          obj=json.loads(path.read_text())
          expected=obj.pop("report_sha256")
          actual=hashlib.sha256(json.dumps(obj,sort_keys=True,separators=(",",":"),ensure_ascii=False,allow_nan=False).encode()).hexdigest()
          assert expected==actual
          assert obj["exact_case_count"]==30
          assert obj["task4_historical_v13_date_candidate_count"]==8
          assert obj["task14_missing_preregistered_predicate_cases"]==7
          assert obj["verified_authority_safe_historical_recoveries"]==0
          assert obj["official_utility_improvement"]==0
          assert obj["new_paid_provider_calls"]==0
          assert obj["new_final128_scored_runs"]==0
          assert obj["provider_dispatch"]=="DENY"
          print("FINAL128_336_PINNED_30_CASE_TRIAGE_NO_RETROACTIVE_GRANT_NO_SCORE_PROMOTION")
          PY
          sha256sum \
            contracts/FINAL128_336_AUTHORITY_SAFE_CASE_TRIAGE_V1.json \
            scripts/final128_336_authority_safe_case_triage_v1.py \
            tests/test_final128_336_authority_safe_case_triage_v1.py \
            docs/optimization/FINAL128_336_AUTHORITY_SAFE_TRIAGE_V1.md \
            results/final128-336-authority-safe-case-triage.json \
            > results/final128-336-evidence-sha256.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: final128-336-authority-safe-30-case-triage
          path: results/*
          if-no-files-found: warn
