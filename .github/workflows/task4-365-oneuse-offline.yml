name: Task4 365 Oneuse Offline Session Rehearsal
on:
  pull_request:
    paths:
      - "scripts/task4_365_oneuse_session_rehearsal_v1.py"
      - "tests/test_task4_365_oneuse_session_rehearsal_v1.py"
      - "docs/TASK4_365_ONEUSE_SESSION_REHEARSAL_V1.md"
      - ".github/workflows/task4-365-oneuse-offline.yml"
permissions:
  contents: read
jobs:
  rehearsal:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
      - name: Exercise one-use session state machine
        run: |
          set -euo pipefail
          python -m pip install pytest==9.1.1
          mkdir -p task4-365-artifact
          python -m pytest -q -o addopts= --junitxml=task4-365-artifact/junit.xml tests/test_task4_365_oneuse_session_rehearsal_v1.py
          python - <<'PY' > task4-365-artifact/report.json
          import json
          from scripts.task4_365_oneuse_session_rehearsal_v1 import open_db,report
          from tempfile import TemporaryDirectory
          from pathlib import Path
          with TemporaryDirectory() as d:
              print(json.dumps(report(open_db(Path(d)/"offline.db")),sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: task4-365-oneuse-offline-rehearsal-v1
          path: task4-365-artifact/
          retention-days: 30
          if-no-files-found: error
