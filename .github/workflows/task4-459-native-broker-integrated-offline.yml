name: Task4 459 Integrated Local Native Broker Evidence (No Provider)
on:
  pull_request:
    paths:
      - ".github/workflows/task4-459-native-broker-integrated-offline.yml"
      - "scripts/task4_459_native_broker_custody_join_v1.py"
      - "tests/test_task4_459_native_broker_custody_join_v1.py"
      - "docs/TASK4_459_LOCAL_NATIVE_BROKER_CUSTODY_JOIN_NO_GO_V1.md"

permissions:
  contents: read
  actions: read

jobs:
  one-origin-local-native-ciphertext-broker-restart:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OPENAI_API_KEY: ""
      TASK4_OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      OPENAI_BASE_URL: ""
      VERITAS_DATABASE_URL: ""
      TASK4_323_APPROVAL_PHRASE: ""
      TASK4_459_LIVE_APPROVAL: ""
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PYTEST_ADDOPTS: ""
      PYTHONNOUSERSITE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      TASK4_NATIVE_DATE_PROOF: "1"
      TASK4_TRANSPORT_PROOF: "1"
      TASK4_TRAJECTORY_PROOF: "1"
      TASK4_SCORER_OBSERVATION_PROOF: "1"
      TASK4_459_NATIVE_PROOF: "1"
      TASK4_RCC_ROOT: "_pins/rcc"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
      - name: Read-only check of spent past Provider grant
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/task4-third-two-real-provider-v1-consumed" --jq '.object.sha')" = "95ff6be8c5875ed3827a00fe71fb54bd9de48130"
      - name: Exact frozen AgentDojo RCC VERITAS read-only sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _pins results
          git clone https://github.com/ethz-spylab/agentdojo.git _pins/agentdojo
          git -C _pins/agentdojo checkout a75aba7631d3ca5fb7ab938965c97ead2f9ff84b
          git clone https://github.com/effacermonexistence/rcc-revas-veritas-benchmark.git _pins/rcc
          git -C _pins/rcc checkout 1d3782d3aae5ff9c88036709c1a5642320cc53c2
          git clone https://github.com/veritasfuji-japan/veritas_os.git _pins/veritas
          git -C _pins/veritas checkout a1d66aef02262cf8a913295270c3aafd159c6adb
          test "$(git -C _pins/agentdojo rev-parse HEAD)" = "a75aba7631d3ca5fb7ab938965c97ead2f9ff84b"
          test "$(git -C _pins/rcc rev-parse HEAD)" = "1d3782d3aae5ff9c88036709c1a5642320cc53c2"
          test "$(git -C _pins/veritas rev-parse HEAD)" = "a1d66aef02262cf8a913295270c3aafd159c6adb"
      - name: Install pinned local-native dependencies only
        shell: bash
        run: |
          set -euo pipefail
          pip install --no-deps -e ./_pins/agentdojo -e ./_pins/veritas
          pip install "pytest==9.1.1" "cryptography==50.0.0" "openai==1.109.1" "pydantic==2.11.10" "idna==3.15" "httpx==0.28.1" "requests==2.34.2" "PyYAML==6.0.3"
          python scripts/final_128_v12_locked_agentdojo_requirements_v1.py \
            --lock _pins/agentdojo/uv.lock \
            --output /tmp/task4-323-agentdojo-locked.txt
          pip install -r /tmp/task4-323-agentdojo-locked.txt
      - name: Replay one local origin from broker claim to Native scorer and custody recovery
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q -o addopts= \
            tests/test_task4_459_native_broker_custody_join_v1.py \
            --junitxml=results/task4-459-local-join-junit.xml \
            | tee results/task4-459-local-join-pytest.txt
          python -m scripts.task4_459_native_broker_custody_join_v1 \
            --output results/task4-459-local-native-broker-redacted.json
          python - <<'PY'
          import json
          r=json.load(open("results/task4-459-local-native-broker-redacted.json"))
          assert r["native_model_requests_captured"] == 8
          assert r["encrypted_broker_slots_recovered_after_restart"] == 8
          assert r["source_native_terminals"] == 2
          assert r["source_detached_native_scorer_calls"] == 2
          assert r["real_provider_posts"] == r["new_genuine_utility"] == 0
          assert r["live_dispatch"] == "DENY"
          assert r["off_runner_custody_proven"] is False
          assert r["independent_cross_runner_cas_proven"] is False
          assert r["provider_authenticated"] is False
          assert len(r["hash_only_receipts"]) == 8
          assert all("raw" not in k and "envelope" not in k and
                     "key" not in k for x in r["hash_only_receipts"] for k in x)
          print("TASK4_459_EIGHT_LOCAL_SOURCE_BROKER_ENCRYPT_NATIVE_SCORER_HARD_NO_GO")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: task4-459-local-native-broker-hash-only-no-provider
          path: results/*
          if-no-files-found: warn