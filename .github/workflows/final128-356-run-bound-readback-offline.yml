name: Final128 356 Run-Bound Readback Offline Tests
on:
  pull_request:
    paths:
      - ".github/workflows/final128-356-task1-actual-run-bound-ruleset-readback.yml"
      - ".github/workflows/final128-356-run-bound-readback-offline.yml"
      - "tests/test_final128_356_actual_run_bound_readback_v1.py"
permissions:
  contents: read
jobs:
  test-run-identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
      - run: python -m pip install pytest
      - run: python -m pytest -q -o addopts= tests/test_final128_356_actual_run_bound_readback_v1.py
