name: Task13 330 Same Candidate Native Tool VERITAS Bind Local V1
on:
  pull_request:
    paths:
      - ".github/workflows/task13-330-same-candidate-native-bind-local-v1.yml"
      - "contracts/TASK13_330_SAME_CANDIDATE_NATIVE_BIND_LOCAL_V1.json"
      - "scripts/task13_330_same_candidate_native_bind_local_v1.py"
      - "tests/test_task13_330_same_candidate_native_bind_local_v1.py"
      - "docs/TASK13_330_SAME_CANDIDATE_NATIVE_BIND_LOCAL_V1.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-native-bind-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      TASK13_330_NATIVE_PROOF: "1"
      TASK13_330_AGENTDOJO_ROOT: _pins/agentdojo
      TASK13_330_VERITAS_ROOT: _pins/veritas
      OPENAI_API_KEY: ""
      TASK4_OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      OPENAI_BASE_URL: ""
      GITHUB_TOKEN: ""
      GH_TOKEN: ""
      VERITAS_DATABASE_URL: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ethz-spylab/agentdojo
          ref: a75aba7631d3ca5fb7ab938965c97ead2f9ff84b
          path: _pins/agentdojo
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: veritasfuji-japan/veritas_os
          ref: a1d66aef02262cf8a913295270c3aafd159c6adb
          path: _pins/veritas
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
      - name: Verify exact source and empty external authorization
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _pins/agentdojo rev-parse HEAD)" = "a75aba7631d3ca5fb7ab938965c97ead2f9ff84b"
          test "$(git -C _pins/veritas rev-parse HEAD)" = "a1d66aef02262cf8a913295270c3aafd159c6adb"
          for key in OPENAI_API_KEY TASK4_OPENAI_API_KEY ANTHROPIC_API_KEY OPENAI_BASE_URL GITHUB_TOKEN GH_TOKEN VERITAS_DATABASE_URL; do
            test -z "${!key:-}"
          done
          mkdir -p results
          git rev-parse HEAD > results/task13-330-head.txt
      - name: Install local-only exact pinned proof prerequisites
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            "pytest==9.1.1" "pydantic==2.11.10" "cryptography==50.0.0" \
            "PyYAML==6.0.3" "docstring-parser==0.17.0"
      - name: Run same-candidate local native tool and VERITAS Bind tests
        shell: bash
        env:
          PYTHONPATH: ".:_pins/agentdojo/src:_pins/veritas"
        run: |
          set -euo pipefail
          python -m pytest -q -o addopts= tests/test_task13_330_same_candidate_native_bind_local_v1.py \
            --junitxml=results/task13-330-native-bind-junit.xml \
            | tee results/task13-330-native-bind-pytest.log
          python scripts/task13_330_same_candidate_native_bind_local_v1.py \
            --agentdojo-root _pins/agentdojo --veritas-root _pins/veritas \
            --output results/task13-330-same-candidate-native-bind-local.json \
            | tee results/task13-330-native-bind-report.log
          python - <<'PY'
          import hashlib,json,pathlib
          p=pathlib.Path("results/task13-330-same-candidate-native-bind-local.json")
          d=json.loads(p.read_text())
          h=d.pop("report_sha256")
          raw=json.dumps(d,sort_keys=True,ensure_ascii=False,separators=(",",":"),allow_nan=False).encode()
          assert hashlib.sha256(raw).hexdigest()==h
          assert d["fixture_positive"]["native_B_bind_outcome"]=="COMMITTED"
          assert d["fixture_positive"]["same_A_B_poststate"] is True
          assert d["untrusted_source_negative"]["native_B_bind_outcome"]!="COMMITTED"
          assert d["untrusted_source_negative"]["native_B_bind_effects"]==0
          assert d["RCC_only_arm_A_executed"] is False
          assert d["new_model_utility_scores"]==0
          assert d["new_injection_security_scores"]==0
          assert d["external_model_calls"]==d["external_bank_effects"]==0
          assert d["provider_dispatch"]=="DENY"
          print("TASK13_330_LOCAL_SAME_CANDIDATE_NATIVE_BIND_NOT_CANONICAL_UTILITY")
          PY
          sha256sum \
            scripts/task13_330_same_candidate_native_bind_local_v1.py \
            tests/test_task13_330_same_candidate_native_bind_local_v1.py \
            contracts/TASK13_330_SAME_CANDIDATE_NATIVE_BIND_LOCAL_V1.json \
            results/task13-330-same-candidate-native-bind-local.json \
            > results/task13-330-file-sha256.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: task13-330-native-bind-local-same-candidate-evidence
          path: results/*
          if-no-files-found: warn
