name: Task15 Docker Revocation Boundary V1
on:
  pull_request:
    paths:
      - ".github/workflows/task15-docker-revocation-boundary-v1.yml"
      - "scripts/task15_docker_revocation_broker_v1.py"
      - "scripts/task15_docker_revocation_worker_v1.py"
      - "scripts/task15_docker_revocation_audit_v1.py"
      - "docker/task15_docker_revocation_broker_v1.Dockerfile"
      - "contracts/TASK15_DOCKER_REVOCATION_BOUNDARY_V1.json"
      - "docs/TASK15_DOCKER_REVOCATION_BOUNDARY_V1.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/task15-docker-revocation-boundary-v1.yml"
      - "scripts/task15_docker_revocation_broker_v1.py"
      - "scripts/task15_docker_revocation_worker_v1.py"
      - "scripts/task15_docker_revocation_audit_v1.py"
      - "docker/task15_docker_revocation_broker_v1.Dockerfile"
      - "contracts/TASK15_DOCKER_REVOCATION_BOUNDARY_V1.json"
      - "docs/TASK15_DOCKER_REVOCATION_BOUNDARY_V1.md"
permissions:
  contents: read
jobs:
  docker-revocation-mock-only-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OPENAI_API_KEY: ""
      OPENAI_BASE_URL: ""
      ANTHROPIC_API_KEY: ""
      AWS_SECRET_ACCESS_KEY: ""
      GH_TOKEN: ""
      GITHUB_TOKEN: ""
      PYTHONDONTWRITEBYTECODE: "1"
      TASK15_STOLEN_SESSION_PROOF: "1"
      PYTHONPATH: "."
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
      - name: Install pinned synthetic grant crypto dependency
        run: python -m pip install "cryptography==50.0.0"
      - name: Execute separate Docker broker/worker revocation-before-claim and claim-before-revoke proof
        run: |
          set -euo pipefail
          mkdir -p results
          python scripts/task15_docker_revocation_audit_v1.py --output-dir results | tee results.log
      - name: Save raw Docker peer evidence and both durable SQLite archives
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: task15-docker-revocation-boundary-v1
          path: |
            results/*
            results.log
          if-no-files-found: warn
