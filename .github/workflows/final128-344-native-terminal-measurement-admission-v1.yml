name: Final128 344 Genuine Native Terminal Measurement Admission V1

on:
  pull_request:
    paths:
      - ".github/workflows/final128-344-native-terminal-measurement-admission-v1.yml"
      - "contracts/FINAL128_344_NATIVE_TERMINAL_MEASUREMENT_ADMISSION_V1.json"
      - "scripts/final128_344_native_terminal_measurement_admission_v1.py"
      - "tests/test_final128_344_native_terminal_measurement_admission_v1.py"
      - "docs/optimization/FINAL128_344_NATIVE_TERMINAL_MEASUREMENT_ADMISSION_V1.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-pinned-native-terminal-scorer-admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      OPENAI_API_KEY: ""
      TASK4_OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      VERITAS_DATABASE_URL: ""
      GITHUB_TOKEN: ""
      GH_TOKEN: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
      - name: Verify no Provider/bank credentials
        shell: bash
        run: |
          set -euo pipefail
          for key in OPENAI_API_KEY TASK4_OPENAI_API_KEY ANTHROPIC_API_KEY VERITAS_DATABASE_URL GITHUB_TOKEN GH_TOKEN; do
            test -z "$(printenv "$key" || true)"
          done
          mkdir -p results
          git rev-parse HEAD > results/final128-344-checkout-head.txt
          echo "FINAL128_344_NO_PROVIDER_NO_BANK"
      - name: Install only test framework
        run: python -m pip install --disable-pip-version-check "pytest==9.1.1"
      - name: Verify frozen historic A/B and generate source-bound scorer readiness + safe cohort
        shell: bash
        env:
          PYTHONPATH: "."
        run: |
          set -euo pipefail
          python -m pytest -q -o addopts= tests/test_final128_344_native_terminal_measurement_admission_v1.py \
            --junitxml=results/final128-344-admission-junit.xml \
            | tee results/final128-344-admission-pytest.log
          python scripts/final128_344_native_terminal_measurement_admission_v1.py \
            --output results/final128-344-native-terminal-measurement-admission.json \
            | tee results/final128-344-admission-report.log
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          path=Path("results/final128-344-native-terminal-measurement-admission.json")
          obj=json.loads(path.read_text())
          expected=obj.pop("report_sha256")
          actual=hashlib.sha256(json.dumps(obj,sort_keys=True,separators=(",",":"),ensure_ascii=False,allow_nan=False).encode()).hexdigest()
          assert expected==actual
          assert obj["case_count"]==30
          assert len(obj["first_bounded_offline_measurement_cohort"])==3
          assert obj["historical_task4_terminal_admission"]["status"]=="INCOMPLETE_UNSCORED"
          assert obj["new_measured_native_terminal_utility"] is None
          assert obj["new_measured_native_attack_success"] is None
          assert obj["historical_v13"]["arm_a_utility"]==93
          assert obj["historical_v13"]["arm_b_utility"]==64
          assert obj["historical_v13"]["arm_b_injection_success"]==0
          assert obj["claims"]["new_utility_recoveries"]==0
          assert obj["claims"]["new_final128_scored_runs"]==0
          assert obj["claims"]["paid_provider_dispatch"]=="DENY"
          print("FINAL128_344_FIRST_DIAGNOSTIC_COHORT_3_NO_FAKE_GENUINE_TERMINAL_SCORING")
          PY
          sha256sum \
            contracts/FINAL128_344_NATIVE_TERMINAL_MEASUREMENT_ADMISSION_V1.json \
            scripts/final128_344_native_terminal_measurement_admission_v1.py \
            tests/test_final128_344_native_terminal_measurement_admission_v1.py \
            docs/optimization/FINAL128_344_NATIVE_TERMINAL_MEASUREMENT_ADMISSION_V1.md \
            results/final128-344-native-terminal-measurement-admission.json \
            > results/final128-344-evidence-sha256.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: final128-344-native-terminal-scorer-admission
          path: results/*
          if-no-files-found: warn
