name: Final128 386 Manual Secret Actions SHA Stage2 Offline
on:
  pull_request:
    paths:
      - ".github/workflows/final128-386-manual-secret-sha-stage2-v1.yml"
      - ".github/workflows/agentdojo-task2-development-validation-v1.yml"
      - ".github/workflows/agentdojo-task12-development-validation-v1.yml"
      - ".github/workflows/agentdojo-task13-development-validation-v1.yml"
      - ".github/workflows/agentdojo-task15-development-validation-v1.yml"
      - "scripts/final128_386_manual_secret_sha_stage2_audit_v1.py"
      - "tests/test_final128_386_manual_secret_sha_stage2_audit_v1.py"
      - "docs/optimization/FINAL128_386_MANUAL_SECRET_ACTION_SHA_STAGE2_V1.md"
permissions:
  contents: read
jobs:
  audit-manual-secret-sha-stage2:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PYTHONPATH: "."
      FINAL128_386_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      OPENAI_API_KEY: ""
      TASK4_OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      OPENAI_BASE_URL: ""
      VERITAS_DATABASE_URL: ""
      GITHUB_TOKEN: ""
      GH_TOKEN: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
      - name: Exact HEAD and immutable comparison base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git cat-file -e "${FINAL128_386_BASE_SHA}^{commit}"
          for secret in OPENAI_API_KEY TASK4_OPENAI_API_KEY ANTHROPIC_API_KEY OPENAI_BASE_URL VERITAS_DATABASE_URL GITHUB_TOKEN GH_TOKEN; do
            test -z "$(printenv "$secret" || true)"
          done
          python -m py_compile scripts/final128_386_manual_secret_sha_stage2_audit_v1.py tests/test_final128_386_manual_secret_sha_stage2_audit_v1.py
          mkdir -p results
          git rev-parse HEAD > results/final128-386-exact-head.txt
          git rev-parse "${FINAL128_386_BASE_SHA}" > results/final128-386-exact-base.txt
      - name: Install fixed offline test framework
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check "pytest==9.1.1"
      - name: Verify 4 exact six-pin-only changes and reject scope drift
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q -o addopts= tests/test_final128_386_manual_secret_sha_stage2_audit_v1.py \
            --junitxml=results/final128-386-junit.xml | tee results/final128-386-tests.log
          python scripts/final128_386_manual_secret_sha_stage2_audit_v1.py \
            --base-sha "${FINAL128_386_BASE_SHA}" \
            --output results/final128-386-manual-secret-stage2-inventory.json | tee results/final128-386-audit.log
      - name: Require redacted zero-send evidence, no premature global SHA claim
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,hashlib,xml.etree.ElementTree as ET
          from pathlib import Path
          xml=ET.parse("results/final128-386-junit.xml").getroot()
          suites=[xml] if xml.tag=="testsuite" else list(xml.findall("testsuite"))
          counts={k:sum(int(s.attrib.get(k,"0")) for s in suites)
                  for k in ("tests","failures","errors","skipped")}
          assert counts["tests"]>=22
          assert all(counts[k]==0 for k in ("failures","errors","skipped"))
          data_path=Path("results/final128-386-manual-secret-stage2-inventory.json")
          data=json.loads(data_path.read_text())
          assert data["stage2_pinned_action_references"]==24
          assert data["remaining_manual_secret_workflows_without_protected_environment_in_stage2"]==4
          assert not data["new_unsafe_reference_keys"]
          assert data["actual_paid_provider_requests"]==0
          assert data["environment_secret_isolation_verified"] is False
          assert data["repository_wide_sha_enforcement_ready"] is False
          assert data["production_bypass_resistance_verified"] is False
          current=Path("results/final128-386-exact-head.txt").read_text().strip()
          base=Path("results/final128-386-exact-base.txt").read_text().strip()
          manifest={
            "schema":"veritas.final128.actions386-stage2-no-paid-evidence.v1",
            "exact_head":current,"exact_base":base,"tests":counts,
            "action_pins_fixed":24,
            "manual_secret_workflows_still_unprotected":4,
            "unsafe_actions_remaining":data["remaining_unsafe_refs_inventory"],
            "full_inventory_sha256":hashlib.sha256(data_path.read_bytes()).hexdigest(),
            "provider_requests":0,"api_spend_usd":"0.00",
            "real_issuer_consumed":False,
            "secret_exfiltration_test_performed":False,
            "global_sha_setting_changed":False,
            "native_utility_scored":False,
          }
          encode=lambda x:json.dumps(x,sort_keys=True,separators=(",",":"),allow_nan=False).encode()
          manifest["sha256"]=hashlib.sha256(encode(manifest)).hexdigest()
          Path("results/final128-386-stage2-redacted-proof.json").write_text(
               json.dumps(manifest,sort_keys=True,indent=2)+"\n")
          print("FINAL128_386_STAGE2_FOUR_MANUAL_SECRETS_24_SHA_PINS_NO_PROVIDER")
          PY
          sha256sum \
            scripts/final128_386_manual_secret_sha_stage2_audit_v1.py \
            tests/test_final128_386_manual_secret_sha_stage2_audit_v1.py \
            docs/optimization/FINAL128_386_MANUAL_SECRET_ACTION_SHA_STAGE2_V1.md \
            .github/workflows/agentdojo-task2-development-validation-v1.yml \
            .github/workflows/agentdojo-task12-development-validation-v1.yml \
            .github/workflows/agentdojo-task13-development-validation-v1.yml \
            .github/workflows/agentdojo-task15-development-validation-v1.yml \
            results/final128-386-manual-secret-stage2-inventory.json \
            results/final128-386-junit.xml \
            results/final128-386-stage2-redacted-proof.json \
            > results/final128-386-sha256-sources.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: final128-386-manual-secret-sha-stage2-no-provider
          path: results/final128-386-*
          if-no-files-found: warn
