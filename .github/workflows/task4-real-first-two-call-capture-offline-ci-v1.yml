name: Task4 First Two Calls Offline Sender Tests V1
on:
  pull_request:
    paths:
      - "scripts/task4_live_first_two_call_capture_oneuse_v1.py"
      - "tests/test_task4_live_first_two_call_capture_oneuse_v1.py"
      - "contracts/TASK4_LIVE_FIRST_TWO_CALL_CAPTURE_ONEUSE_V1.json"
      - "docs/TASK4_LIVE_FIRST_TWO_CALL_CAPTURE_ONEUSE_V1.md"
      - ".github/workflows/task4-real-first-two-call-capture-v1.yml"
      - ".github/workflows/task4-real-first-two-call-capture-offline-ci-v1.yml"
  push:
    branches: [main]
    paths:
      - "scripts/task4_live_first_two_call_capture_oneuse_v1.py"
      - "tests/test_task4_live_first_two_call_capture_oneuse_v1.py"
      - ".github/workflows/task4-real-first-two-call-capture-v1.yml"
      - ".github/workflows/task4-real-first-two-call-capture-offline-ci-v1.yml"

permissions:
  contents: read
  actions: read

jobs:
  offline-only-provider-sender-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PYTEST_ADDOPTS: ""
      TASK4_OPENAI_API_KEY: ""
      OPENAI_API_KEY: ""
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
      - name: Retrieve exact immutable 292 native source packet
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source results
          gh run download 38060638006 -R "$GITHUB_REPOSITORY" \
            --name task4-two-arm-first-live-request-packet-v1 --dir source
          echo "096f428f060d6b7d73b594955b95db11728c2045c8224e23ff4bb41a0b3dbcf3  source/task4-two-first-request-packets.json" | sha256sum -c -
          echo "TASK4_FROZEN_SOURCE_PACKET_PATH=$PWD/source/task4-two-first-request-packets.json" >> "$GITHUB_ENV"
      - name: Install offline testing library only
        shell: bash
        run: |
          set -euo pipefail
          pip install pytest==9.1.1
      - name: Verify no live transport in CI; mocked HTTP and negative controls only
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q -o addopts= tests/test_task4_live_first_two_call_capture_oneuse_v1.py \
            --junitxml=results/task4-live-sender-OFFLINE-ONLY-junit.xml \
            | tee results/task4-live-sender-OFFLINE-ONLY.log
          python scripts/task4_live_first_two_call_capture_oneuse_v1.py \
            --mode preflight \
            --source "$TASK4_FROZEN_SOURCE_PACKET_PATH" \
            --output results/task4-live-sender-preflight-no-authority.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: task4-live-two-call-sender-v1-offline-tests
          path: results/*
          if-no-files-found: warn
