name: CI Mock Executor UID Netns Credential Boundary Offline
on:
  pull_request:
    # Every PR, including changes to shared test configuration.
permissions:
  contents: read
jobs:
  separate-uid-netns-firewall-mock-executor:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OPENAI_API_KEY: ''
      TASK4_OPENAI_API_KEY: ''
      TASK1_OPENAI_API_KEY: ''
      ANTHROPIC_API_KEY: ''
      OPENAI_BASE_URL: ''
      VERITAS_DATABASE_URL: ''
      GITHUB_TOKEN: ''
      GH_TOKEN: ''
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTEST_ADDOPTS: ''
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Check exact source and scope validation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha }}'
          mkdir -p results
          python -m pip install 'pytest==9.1.1'
          python -m pytest -q -o addopts= tests/test_ci_mock_executor_authority_boundary_v1.py \
            --junitxml=results/mock-executor-unit-junit.xml
      - name: Enforce disposable kernel boundaries and reconcile one mock effect
        shell: bash
        run: |
          set -euo pipefail
          sudo -n /usr/bin/python3 scripts/ci_mock_executor_authority_boundary_v1.py \
            --run --output results/mock-authority
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          import xml.etree.ElementTree as ET
          r=json.loads(Path('results/mock-authority/report.json').read_text())
          assert r['audited_commit'] == '${{ github.event.pull_request.head.sha }}'
          assert r['source_sha256'] == hashlib.sha256(Path('scripts/ci_mock_executor_authority_boundary_v1.py').read_bytes()).hexdigest()
          assert len(r['checks']) == 23 and all(v is True for v in r['checks'].values())
          assert r['mock_effect_count'] == 1 and r['backend_denial_count'] == 1
          assert len(set(r['uids'].values())) == len(set(r['namespace_ids'].values())) == 3
          assert r['real_provider_calls'] == r['real_bank_effects'] == 0
          assert r['independent_administration_proven'] is False
          assert r['production_bypass_resistance_proven'] is False
          assert r['real_veritas_bind_integrated'] is False
          assert r['exact_historical_helper_invocations_tested'] is False
          assert r['provider_dispatch'] == 'DENY' and r['utility'] == 'UNSCORED'
          for file,count in [('results/mock-executor-unit-junit.xml',11),('results/mock-authority/junit.xml',23)]:
              root=ET.parse(file).getroot()
              assert len(list(root.iter('testcase'))) == count
              assert not list(root.iter('skipped')) and not list(root.iter('failure')) and not list(root.iter('error'))
          print('CI_MOCK_EXECUTOR_KERNEL_BOUNDARY_VERIFIED_NO_PROVIDER')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ci-mock-executor-uid-netns-credential-boundary-v1
          path: results/
          if-no-files-found: error
