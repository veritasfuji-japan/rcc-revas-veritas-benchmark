name: CI Mock Executor UID Netns Credential Boundary Offline
on:
  pull_request:
    # Every PR, including changes to shared test configuration.
permissions:
  contents: read
jobs:
  separate-uid-netns-firewall-mock-executor:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OPENAI_API_KEY: ''
      TASK4_OPENAI_API_KEY: ''
      TASK1_OPENAI_API_KEY: ''
      ANTHROPIC_API_KEY: ''
      OPENAI_BASE_URL: ''
      VERITAS_DATABASE_URL: ''
      GITHUB_TOKEN: ''
      GH_TOKEN: ''
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTEST_ADDOPTS: ''
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: veritasfuji-japan/veritas_os
          ref: a1d66aef02262cf8a913295270c3aafd159c6adb
          path: _pins/veritas
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Check exact source and scope validation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha }}'
          mkdir -p results
          python -m pip install 'pytest==9.1.1' 'PyYAML==6.0.3' \
            'cryptography==50.0.0' 'pydantic==2.11.10' 'numpy==1.26.4'
          PYTHONPATH=_pins/veritas python -c 'from veritas_os.policy.bind_core import execute_bind_adjudication; print("EXACT_BIND_IMPORT_CLOSURE_READY")'
          python -m pytest -q -o addopts= tests/test_ci_mock_executor_authority_boundary_v1.py \
            --junitxml=results/mock-executor-unit-junit.xml
      - name: Enforce disposable kernel boundaries and reconcile one mock effect
        shell: bash
        run: |
          set -euo pipefail
          sudo -n "$(command -v python)" -m scripts.ci_mock_executor_authority_boundary_v1 \
            --run --with-veritas-bind --veritas-root _pins/veritas --output results/mock-authority
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          import xml.etree.ElementTree as ET
          r=json.loads(Path('results/mock-authority/report.json').read_text())
          assert r['audited_commit'] == '${{ github.event.pull_request.head.sha }}'
          assert r['source_sha256'] == hashlib.sha256(Path('scripts/ci_mock_executor_authority_boundary_v1.py').read_bytes()).hexdigest()
          assert len(r['checks']) == 42 and all(v is True for v in r['checks'].values())
          assert r['mock_effect_count'] == 1 and r['backend_denial_count'] == 3
          assert len(set(r['uids'].values())) == 5 and len(set(r['namespace_ids'].values())) == 3
          assert r['executor_has_backend_credential'] is False
          assert r['trusted_bind_custody_uid'] == 61106
          assert r['bind_enforcement_scope'] == 'UNTRUSTED_EXECUTOR_TO_TRUSTED_CUSTODY'
          assert r['compromised_custody_resistance_proven'] is False
          assert r['installed_and_checked_firewall_rule'][-3:] == ['61106','-j','REJECT']
          assert r['issuer_algorithm'] == 'Ed25519'
          assert r['executor_has_issuer_private_key'] is False
          assert r['backend_verifies_issuer_signature'] is True
          assert len(r['issuer_public_key_sha256']) == 64
          assert r['real_provider_calls'] == r['real_bank_effects'] == 0
          assert r['independent_administration_proven'] is False
          assert r['production_bypass_resistance_proven'] is False
          assert r['real_veritas_bind_integrated'] is True
          assert r['exact_historical_helper_invocations_tested'] is False
          assert r['provider_dispatch'] == 'DENY' and r['utility'] == 'UNSCORED'
          b=json.loads(Path('results/mock-authority/bind-evidence.json').read_text())
          from scripts.ci_mock_executor_veritas_bind_v1 import digest
          assert r['bind_evidence_sha256'] == digest(b)
          assert r['bind_adapter_source_sha256'] == hashlib.sha256(Path('scripts/ci_mock_executor_veritas_bind_v1.py').read_bytes()).hexdigest()
          assert b['veritas_pin'] == 'a1d66aef02262cf8a913295270c3aafd159c6adb'
          assert b['bind_core_git_blob'] == '0f64201e2599495ce4e3991348aa320995716ffc'
          assert b['same_custody_run_real_bind_and_network_effect'] is True
          assert b['bind_executor_uid'] == r['trusted_bind_custody_uid']
          assert b['native_task4_pipeline_integrated'] is b['production_policy_proven'] is False
          assert b['authenticated_effect_posts'] == 1
          assert b['backend_receipt_sha256'] == r['receipt_sha256'] == b['request_sha256']
          assert [(x['scenario'],x['outcome'],x['apply_calls']) for x in b['records']] == [
              ('authority-denied','BLOCKED',0),('wrong-target','BLOCKED',0),
              ('wrong-prestate','BLOCKED',0),('allow','COMMITTED',1)]
          assert all(digest(x['bind_receipt']) == x['receipt_sha256'] for x in b['records'])
          for file,count in [('results/mock-executor-unit-junit.xml',26),('results/mock-authority/junit.xml',42)]:
              root=ET.parse(file).getroot()
              assert len(list(root.iter('testcase'))) == count
              assert not list(root.iter('skipped')) and not list(root.iter('failure')) and not list(root.iter('error'))
          print('CI_MOCK_EXECUTOR_KERNEL_AND_REAL_BIND_SAME_RUN_NO_PROVIDER')
          PY
      - name: Crash at consumed boundary and lose real mock HTTP response without retry
        shell: bash
        run: |
          set -euo pipefail
          for fault in before-post backend-response-lost before-client-reply; do
            sudo -n "$(command -v python)" -m scripts.ci_mock_executor_authority_boundary_v1 \
              --run --with-veritas-bind --veritas-root _pins/veritas \
              --fault "$fault" --output "results/fault-$fault"
          done
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          import xml.etree.ElementTree as ET
          from scripts.ci_mock_executor_authority_boundary_v1 import digest, OP, REQUEST
          for fault,effects,state,terminal,count in [
              ('before-post',0,'CONSUMED_UNKNOWN',False,40),
              ('backend-response-lost',1,'CONSUMED_UNKNOWN',False,40),
              ('before-client-reply',1,'MOCK_OBSERVED',True,45)]:
              folder=Path('results/fault-'+fault)
              r=json.loads((folder/'report.json').read_text())
              assert r['audited_commit'] == '${{ github.event.pull_request.head.sha }}'
              assert r['source_sha256'] == hashlib.sha256(Path('scripts/ci_mock_executor_authority_boundary_v1.py').read_bytes()).hexdigest()
              assert r['fault'] == fault and r['mock_effect_count'] == effects
              assert r['backend_denial_count'] == 3 and r['custody_ledger_state'] == state
              assert len(r['checks']) == count and all(x is True for x in r['checks'].values())
              assert r['checks']['caller_gets_unknown_no_retry'] is True
              assert r['checks']['stopped_custody_replay_unknown_no_retry'] is True
              assert r['checks']['restart_replay_denied'] is True
              assert r['checks']['authenticated_reconciliation_matches_backend_db'] is True
              receipt=digest({'operation_id':OP,'request':REQUEST}) if effects else None
              assert r['receipt_sha256'] == receipt
              assert r['custody_ledger_receipt_sha256'] == (receipt if terminal else None)
              assert r['authenticated_reconciliation'] == {'operation_id':OP,'effect_count':effects,'receipt':receipt}
              assert r['automatic_retry_performed'] is False
              assert r['bind_terminal_receipt_observed'] is terminal
              assert r['real_provider_calls'] == r['real_bank_effects'] == 0
              assert r['provider_dispatch'] == 'DENY' and r['utility'] == 'UNSCORED'
              assert r['production_bypass_resistance_proven'] is False
              root=ET.parse(folder/'junit.xml').getroot()
              assert len(list(root.iter('testcase'))) == count
              assert not any(list(root.iter(x)) for x in ('failure','error','skipped'))
              if terminal:
                  b=json.loads((folder/'bind-evidence.json').read_text())
                  assert r['bind_evidence_sha256'] == digest(b)
                  assert b['backend_receipt_sha256'] == receipt
                  assert [(x['outcome'],x['apply_calls']) for x in b['records']] == [('BLOCKED',0)]*3+[('COMMITTED',1)]
                  assert all(digest(x['bind_receipt']) == x['receipt_sha256'] for x in b['records'])
              else:
                  assert r['bind_evidence_sha256'] is None
                  assert not (folder/'bind-evidence.json').exists()
          print('THREE_CRASH_WINDOWS_RECONCILED_NO_RETRY_NO_PROVIDER')
          PY
      - name: Restart both Custody and backend against their retained databases
        shell: bash
        run: |
          set -euo pipefail
          for fault in before-post backend-response-lost before-client-reply; do
            sudo -n "$(command -v python)" -m scripts.ci_mock_executor_authority_boundary_v1 \
              --run --with-veritas-bind --veritas-root _pins/veritas --restart-backend \
              --fault "$fault" --output "results/both-restart-$fault"
          done
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          import xml.etree.ElementTree as ET
          from scripts.ci_mock_executor_authority_boundary_v1 import digest, OP, REQUEST
          for fault,effects,state,terminal,count in [
              ('before-post',0,'CONSUMED_UNKNOWN',False,43),
              ('backend-response-lost',1,'CONSUMED_UNKNOWN',False,44),
              ('before-client-reply',1,'MOCK_OBSERVED',True,49)]:
              folder=Path('results/both-restart-'+fault)
              r=json.loads((folder/'report.json').read_text())
              e=json.loads((folder/'restart-evidence.json').read_text())
              assert r['audited_commit'] == '${{ github.event.pull_request.head.sha }}'
              assert r['source_sha256'] == hashlib.sha256(Path('scripts/ci_mock_executor_authority_boundary_v1.py').read_bytes()).hexdigest()
              assert r['bind_adapter_source_sha256'] == hashlib.sha256(Path('scripts/ci_mock_executor_veritas_bind_v1.py').read_bytes()).hexdigest()
              assert r['backend_restarted'] is True and r['fault'] == fault
              assert r['mock_effect_count'] == effects and r['backend_denial_count'] == (4 if effects else 3)
              assert r['custody_ledger_state'] == state
              assert len(r['checks']) == count and all(x is True for x in r['checks'].values())
              assert r['checks']['both_services_restarted_in_new_processes'] is True
              assert r['checks']['both_databases_preserved_across_restart'] is True
              assert r['checks']['restart_replay_denied'] is True
              if effects:
                  assert r['checks']['restarted_backend_authentic_authorized_duplicate_denied'] is True
              assert r['restart_evidence_sha256'] == digest(e)
              assert e['before'] == e['after']
              assert all(e['original_pids'][k] != e['restarted_pids'][k] for k in ('backend','custody'))
              receipt=digest({'operation_id':OP,'request':REQUEST}) if effects else None
              assert r['receipt_sha256'] == receipt
              assert e['before_reconciliation'] == e['after_reconciliation'] == r['authenticated_reconciliation'] == {'operation_id':OP,'effect_count':effects,'receipt':receipt}
              assert e['before']['backend']['state'] == [[1,effects,3]]
              assert e['before']['backend']['spent'] == ([[OP,receipt]] if effects else [])
              assert e['before']['custody']['consumed'] == [[OP,state,receipt if terminal else None]]
              assert r['bind_terminal_receipt_observed'] is terminal
              assert r['automatic_retry_performed'] is False
              assert r['real_provider_calls'] == r['real_bank_effects'] == 0
              assert r['provider_dispatch'] == 'DENY' and r['utility'] == 'UNSCORED'
              assert r['production_bypass_resistance_proven'] is False
              root=ET.parse(folder/'junit.xml').getroot()
              assert len(list(root.iter('testcase'))) == count
              assert not any(list(root.iter(x)) for x in ('failure','error','skipped'))
          print('BOTH_SERVICES_RESTARTED_NO_DUPLICATE_EFFECT_NO_PROVIDER')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ci-mock-executor-uid-netns-credential-boundary-v1
          path: results/
          if-no-files-found: error
