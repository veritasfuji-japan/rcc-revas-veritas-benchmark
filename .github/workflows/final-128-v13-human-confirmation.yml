name: Final 128 V13 Human Confirmation
on:
  pull_request:
    paths:
      - "contracts/AGENTDOJO_FINAL_128_V13_HUMAN_CONFIRMATION_v1.json"
      - "scripts/final_128_v13_human_confirmation_audit_v1.py"
      - ".github/workflows/final-128-v13-human-confirmation.yml"
permissions: {contents: read}
jobs:
  confirmation:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ""
      VERITAS_DATABASE_URL: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.11.16"}
      - name: Audit fresh V13 human confirmation
        run: python scripts/final_128_v13_human_confirmation_audit_v1.py
