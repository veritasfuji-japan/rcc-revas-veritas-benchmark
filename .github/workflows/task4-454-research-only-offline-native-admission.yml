name: Task4 454 Research-Only Native A/B Admission (No Provider)
on:
  pull_request:
    paths:
      - ".github/workflows/task4-454-research-only-offline-native-admission.yml"
      - "scripts/task4_454_research_admission_offline_v1.py"
      - "tests/test_task4_454_research_admission_offline_v1.py"
      - "docs/TASK4_454_RESEARCH_ONLY_NATIVE_ADMISSION_NO_GO_V1.md"

permissions:
  contents: read
  actions: read

jobs:
  native-scripted-proof-and-denied-live-admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OPENAI_API_KEY: ""
      TASK4_OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      OPENAI_BASE_URL: ""
      VERITAS_DATABASE_URL: ""
      TASK4_323_APPROVAL_PHRASE: ""
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PYTEST_ADDOPTS: ""
      PYTHONNOUSERSITE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      TASK4_NATIVE_DATE_PROOF: "1"
      TASK4_TRANSPORT_PROOF: "1"
      TASK4_TRAJECTORY_PROOF: "1"
      TASK4_SCORER_OBSERVATION_PROOF: "1"
      TASK4_323_ONE_ARM_OFFLINE_PROOF: "1"
      TASK4_RCC_ROOT: "_pins/rcc"
      TASK4_323_EVIDENCE_ROWS: "results/task4-323-true-one-arm-source-rows.jsonl"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
      - name: Previous real Provider approval permanently consumed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/task4-third-two-real-provider-v1-consumed" --jq '.object.sha')" = "95ff6be8c5875ed3827a00fe71fb54bd9de48130"
          echo "TASK4_323_PREVIOUS_PROVIDER_GRANT_SPENT"
      - name: Exact native AgentDojo, RCC and VERITAS versions only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _pins results
          git clone https://github.com/ethz-spylab/agentdojo.git _pins/agentdojo
          git -C _pins/agentdojo checkout a75aba7631d3ca5fb7ab938965c97ead2f9ff84b
          git clone https://github.com/effacermonexistence/rcc-revas-veritas-benchmark.git _pins/rcc
          git -C _pins/rcc checkout 1d3782d3aae5ff9c88036709c1a5642320cc53c2
          git clone https://github.com/veritasfuji-japan/veritas_os.git _pins/veritas
          git -C _pins/veritas checkout a1d66aef02262cf8a913295270c3aafd159c6adb
          test "$(git -C _pins/agentdojo rev-parse HEAD)" = "a75aba7631d3ca5fb7ab938965c97ead2f9ff84b"
          test "$(git -C _pins/rcc rev-parse HEAD)" = "1d3782d3aae5ff9c88036709c1a5642320cc53c2"
          test "$(git -C _pins/veritas rev-parse HEAD)" = "a1d66aef02262cf8a913295270c3aafd159c6adb"
      - name: Install pinned native-only evaluator and frozen dependencies
        shell: bash
        run: |
          set -euo pipefail
          pip install --no-deps -e ./_pins/agentdojo -e ./_pins/veritas
          pip install "pytest==9.1.1" "cryptography==50.0.0" "openai==1.109.1" "pydantic==2.11.10" "idna==3.15" "httpx==0.28.1" "requests==2.34.2" "PyYAML==6.0.3"
          python scripts/final_128_v12_locked_agentdojo_requirements_v1.py \
            --lock _pins/agentdojo/uv.lock \
            --output /tmp/task4-323-agentdojo-locked.txt
          pip install -r /tmp/task4-323-agentdojo-locked.txt
      - name: Verify only one native arm and one post-native scorer per independent scripted SDK source
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/task4-323-agentdojo-locked.txt results/task4-323-locked-dependencies.txt
          pip freeze > results/task4-323-runtime-pip-freeze.txt
          python -m pytest -q -o addopts= \
            tests/test_task4_323_one_arm_native_offline_v1.py \
            --junitxml=results/task4-323-one-arm-junit.xml \
            | tee results/task4-323-pytest.log
          python scripts/task4_323_one_arm_audit_v1.py \
            --evidence "$TASK4_323_EVIDENCE_ROWS" \
            --output results/task4-323-one-arm-per-source-report.json \
            | tee results/task4-323-audit.log
          python scripts/task4_363_native_wire_lineage_audit_v1.py \
            --evidence "$TASK4_323_EVIDENCE_ROWS" \
            --output results/task4-363-native-wire-to-scorer-report.json \
            | tee results/task4-363-native-wire-to-scorer.log
          python - <<'PY'
          import json
          x=json.load(open("results/task4-323-one-arm-per-source-report.json"))
          assert x["two_independent_scripted_first_request_roots"]==2
          assert x["real_sdk_local_interceptions"]==8
          assert x["native_arm_executions"]==2
          assert x["postonly_native_scorer_calls"]==2
          assert x["shadow_native_arm_executions"]==0
          assert x["new_real_provider_posts"]==0
          assert x["new_final128_cases"]==0
          assert x["real_provider_dispatch"]=="DENY"
          print("TASK4_323_ONE_ROOT_ONE_NATIVE_ARM_ONE_SCORER_FOR_A_AND_B_NO_PROVIDER")
          PY
      - name: Join existing #323 and #363 evidence; refuse real-model score promotion
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q -o addopts= \
            tests/test_task4_454_research_admission_offline_v1.py \
            --junitxml=results/task4-454-research-deny-junit.xml
          python -m scripts.task4_454_research_admission_offline_v1 \
            --native results/task4-323-one-arm-per-source-report.json \
            --lineage results/task4-363-native-wire-to-scorer-report.json \
            --output results/task4-454-research-only-admission.json
          python - <<'PY'
          import json
          p = json.load(open("results/task4-454-research-only-admission.json"))
          assert p["classification"] == "OFFLINE_RESEARCH_PRESEND_ONLY_NOT_APPROVED"
          assert p["scripted_arms_native_scored"] == 2
          assert p["real_provider_attempts"] == 0
          assert p["new_canonical_utility_recoveries"] == 0
          assert p["live_provider_dispatch"] == "DENY"
          print("TASK4_454_REUSED_NATIVE_SCORER_NO_REAL_MODEL_NO_PROVIDER_DENY")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: task4-454-research-only-scripted-native-scorer-v1
          path: results/*
          if-no-files-found: warn
