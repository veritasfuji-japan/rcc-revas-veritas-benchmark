name: Final 128 V12 Authorization Issuance
on:
  pull_request:
    paths:
      - "contracts/AGENTDOJO_FINAL_128_EXECUTION_AUTHORIZATION_v12.json"
      - "scripts/final_128_v12_authorization_issuance_audit_v1.py"
      - ".github/workflows/final-128-v12-authorization-issuance.yml"
permissions: {contents: read}
jobs:
  authorization:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ""
      VERITAS_DATABASE_URL: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.11.16"}
      - name: Audit exact V12 authorization issuance
        run: python scripts/final_128_v12_authorization_issuance_audit_v1.py
