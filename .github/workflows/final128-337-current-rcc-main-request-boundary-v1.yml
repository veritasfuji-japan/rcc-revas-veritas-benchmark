name: Final128 337 Current RCC Main Native Request Boundary V1

on:
  pull_request:
    paths:
      - ".github/workflows/final128-337-current-rcc-main-request-boundary-v1.yml"
      - "contracts/FINAL128_337_CURRENT_RCC_MAIN_REQUEST_BOUNDARY_V1.json"
      - "scripts/final128_337_current_rcc_main_request_boundary_v1.py"
      - "tests/test_final128_337_current_rcc_main_request_boundary_v1.py"
      - "docs/optimization/FINAL128_337_CURRENT_RCC_MAIN_REQUEST_BOUNDARY_V1.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-current-main-native-request-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      OPENAI_API_KEY: ""
      TASK4_OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      VERITAS_API_KEY: ""
      VERITAS_DATABASE_URL: ""
      GITHUB_TOKEN: ""
      GH_TOKEN: ""
      FINAL128_337_UPSTREAM_ROOT: "${{ github.workspace }}/current-rcc-upstream"
    steps:
      - name: Checkout VERITAS benchmark at exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Checkout RCC publicly published main at immutable SHA (read only)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: effacermonexistence/rcc-revas-veritas-benchmark
          ref: 353ad9e6a17cda8874a129493fe0f8f4fe4427bc
          path: current-rcc-upstream
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
      - name: Enforce no model, bank or GitHub auth keys in Python scope
        shell: bash
        run: |
          set -euo pipefail
          for key in OPENAI_API_KEY TASK4_OPENAI_API_KEY ANTHROPIC_API_KEY VERITAS_API_KEY VERITAS_DATABASE_URL GITHUB_TOKEN GH_TOKEN; do
            test -z "$(printenv "$key" || true)"
          done
          mkdir -p results
          git rev-parse HEAD > results/final128-337-benchmark-ci-head.txt
          git -C current-rcc-upstream rev-parse HEAD > results/final128-337-upstream-head.txt
          echo "FINAL128_337_ZERO_PROVIDER_OR_BANK_SECRETS"
      - name: Execute real RCC current-main 36-case source-bound prepare (NO HTTP POST)
        shell: bash
        env:
          PYTHONPATH: "."
        run: |
          set -euo pipefail
          python scripts/final128_337_current_rcc_main_request_boundary_v1.py \
            --upstream-root current-rcc-upstream \
            --output-dir results/final128-337-current-rcc-main \
            | tee results/final128-337-run.log
      - name: Test real upstream candidate/prestate binding and authority nonpromotion
        shell: bash
        env:
          PYTHONPATH: "."
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "pytest==9.1.1"
          python -m pytest -q -o addopts= \
            tests/test_final128_337_current_rcc_main_request_boundary_v1.py \
            --junitxml=results/final128-337-current-main-junit.xml \
            | tee results/final128-337-tests.log
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          path=Path("results/final128-337-current-rcc-main/report.json")
          obj=json.loads(path.read_text())
          old=obj.pop("report_sha256")
          actual=hashlib.sha256(json.dumps(obj,sort_keys=True,ensure_ascii=False,
              allow_nan=False,separators=(",",":")).encode("utf-8")).hexdigest()
          assert old==actual
          assert obj["actual_upstream_observed"]["enrolled"]==36
          assert obj["actual_upstream_observed"]["errors"]==0
          assert obj["canonical_128_new_scores"]==0
          assert obj["native_bind_calls"]==0
          assert obj["http_posts"]==0
          assert obj["provider_dispatch"]=="DENY"
          print("FINAL128_337_ACTUAL_RCC_MAIN_36_SOURCE_BOUND_NO_NATIVE_CONSUMPTION")
          PY
          sha256sum \
            contracts/FINAL128_337_CURRENT_RCC_MAIN_REQUEST_BOUNDARY_V1.json \
            scripts/final128_337_current_rcc_main_request_boundary_v1.py \
            tests/test_final128_337_current_rcc_main_request_boundary_v1.py \
            docs/optimization/FINAL128_337_CURRENT_RCC_MAIN_REQUEST_BOUNDARY_V1.md \
            results/final128-337-current-rcc-main/report.json \
            > results/final128-337-evidence-sha256.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: final128-337-current-rcc-main-request-boundary
          path: |
            results/final128-337-benchmark-ci-head.txt
            results/final128-337-upstream-head.txt
            results/final128-337-run.log
            results/final128-337-tests.log
            results/final128-337-current-main-junit.xml
            results/final128-337-evidence-sha256.txt
            results/final128-337-current-rcc-main/report.json
          if-no-files-found: warn
