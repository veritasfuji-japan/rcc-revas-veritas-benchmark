name: "Final128 417 Canonical to IAM Source-Bound Join Admission (No Effect)"
on:
  pull_request:
    paths:
      - ".github/workflows/final128-417-canonical-iam-join-admission-v1.yml"
      - "contracts/FINAL128_417_CANONICAL_TO_IAM_JOIN_GAP_V1.json"
      - "scripts/final128_417_canonical_iam_join_admission_v1.py"
      - "tests/test_final128_417_canonical_iam_join_admission_v1.py"
      - "docs/optimization/FINAL128_417_CANONICAL_IAM_JOIN_ADMISSION_V1.md"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: final128-417-join-admission-${{ github.ref }}
  cancel-in-progress: true
jobs:
  no-unearned-authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Source HEAD and negative bridge contract tests
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python -m unittest discover -s tests \
            -p 'test_final128_417_canonical_iam_join_admission_v1.py' -v
      - name: Emit exact reviewed GAP report (metadata only, no false ZIP audit)
        run: |
          set -euo pipefail
          python -m scripts.final128_417_canonical_iam_join_admission_v1 \
            --output final128-417-redacted
          cd final128-417-redacted
          sha256sum --check manifest.sha256
          python - <<'PY'
          import json
          from pathlib import Path
          row=json.loads(Path("report.json").read_text("utf-8"))
          assert row["status"]=="NOT_ADMITTED_NEEDS_SOURCE_BOUND_NATIVE_ISSUER"
          assert row["result"]=="PASS_GAP_IDENTIFIED_NOT_CROSS_REPO_EXECUTION_PROOF"
          assert row["canonical_and_iam_were_separate_executions"] is True
          assert row["request_id_equal"] is False
          assert row["execution_intent_id_equal"] is False
          assert row["same_source_bound_execution_authorized"] is False
          assert row["real_both_artifact_zip_hashes_checked_this_run"] is False
          assert row["native_issuer_proved_source_bound_original_request"] is False
          assert row["native_issuer_proved_source_bound_candidate"] is False
          assert row["production_proven"] is False
          assert row["final128_utility_recovered"] is False
          assert row["paid_provider_calls"]==0
          print("FINAL128_417_TWO_SUCCESSES_NOT_A_BOUND_EXECUTION_GATE_PASS")
          PY
      - name: Upload sanitized false-admission refusal, not third-party authority
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: final128-417-unlinked-source-bound-admission-redacted-v1
          path: |
            final128-417-redacted/report.json
            final128-417-redacted/manifest.sha256
          if-no-files-found: error
          retention-days: 30
