name: Task4 Prospective Local Completion Envelope Bridge V1
on:
  pull_request:
    paths:
      - ".github/workflows/task4-prospective-offline-completion-envelope-v1.yml"
      - "scripts/task4_prospective_offline_completion_envelope_bridge_v1.py"
      - "tests/test_task4_prospective_offline_completion_envelope_bridge_v1.py"
      - "contracts/TASK4_PROSPECTIVE_LOCAL_COMPLETION_ENVELOPE_V1.json"
      - "docs/TASK4_PROSPECTIVE_LOCAL_COMPLETION_ENVELOPE_V1.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/task4-prospective-offline-completion-envelope-v1.yml"
      - "scripts/task4_prospective_offline_completion_envelope_bridge_v1.py"
      - "tests/test_task4_prospective_offline_completion_envelope_bridge_v1.py"
      - "contracts/TASK4_PROSPECTIVE_LOCAL_COMPLETION_ENVELOPE_V1.json"
      - "docs/TASK4_PROSPECTIVE_LOCAL_COMPLETION_ENVELOPE_V1.md"

permissions:
  contents: read

jobs:
  offline-local-completion-envelopes-no-provider:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      OPENAI_API_KEY: ""
      TASK4_OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      OPENAI_BASE_URL: ""
      VERITAS_DATABASE_URL: ""
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PYTHONNOUSERSITE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_ADDOPTS: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
      - name: Pin unchanged #303 issuer-owned model-wire preflight
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object scripts/task4_prospective_model_wire_date_boundary_v1.py)" = "83ad7d3f229084633c28729d592330c477c76316"
          test "$(git hash-object task4_trusted_execution_date_profile_v1.py)" = "4eb8646b18cae7130c217fa3a04d05a3d71756d3"
          test "$(git hash-object agentdojo_constraint_resolver_v0_1.py)" = "edbf513e67efa8719de3a1193a5f3ba937afdf52"
          echo "UNMODIFIED_PARENT_303_WIRE_PROFILE_AND_REFUND_RESOLVER"
      - name: Install local-only test dependency
        run: python -m pip install "pytest==9.1.1"
      - name: Test strict synthetic envelope parser, one-use capture and pre-Bind checks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          python -m pytest -q -o addopts= \
            tests/test_task4_prospective_offline_completion_envelope_bridge_v1.py \
            --junitxml=results/task4-304-local-completion-junit.xml \
            | tee results/task4-304-local-completion-tests.log
          python scripts/task4_prospective_offline_completion_envelope_bridge_v1.py \
            --output results/task4-304-local-completion-report.json \
            | tee results/task4-304-local-completion-report.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: task4-prospective-local-completion-envelope-v1
          path: results/*
          if-no-files-found: warn
