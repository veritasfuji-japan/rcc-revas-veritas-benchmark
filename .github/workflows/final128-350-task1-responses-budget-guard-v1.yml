name: Final128 350 Task1 Responses Budget Guard V1
on:
  pull_request:
    paths:
      - ".github/workflows/final128-350-task1-responses-budget-guard-v1.yml"
      - "scripts/final128_350_task1_responses_once_budget_v1.py"
      - "tests/test_final128_350_task1_responses_once_budget_v1.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-no-provider-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      OPENAI_API_KEY: ""
      TASK4_OPENAI_API_KEY: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
      - run: python -m pip install pytest
      - run: python -m pytest -q -o addopts= tests/test_final128_350_task1_responses_once_budget_v1.py
