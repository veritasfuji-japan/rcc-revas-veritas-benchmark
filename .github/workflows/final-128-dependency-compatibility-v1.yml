name: Final 128 Dependency Compatibility V1
on:
  pull_request:
    paths:
      - ".github/workflows/final-128-dependency-compatibility-v1.yml"
      - "contracts/AGENTDOJO_FINAL_128_DEPENDENCY_COMPATIBILITY_v1.json"
permissions: {contents: read}
jobs:
  compatibility:
    runs-on: ubuntu-latest
    env: {OPENAI_API_KEY: "", VERITAS_DATABASE_URL: ""}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11.16"}
      - name: Checkout exact external pins
        run: |
          git clone https://github.com/ethz-spylab/agentdojo.git _agentdojo
          git -C _agentdojo checkout a75aba7631d3ca5fb7ab938965c97ead2f9ff84b
          git clone https://github.com/veritasfuji-japan/veritas_os.git _veritas
          git -C _veritas checkout a1d66aef02262cf8a913295270c3aafd159c6adb
      - name: Install exact pins with compatible OpenAI client
        run: |
          python -m pip install --upgrade pip
          pip install -e "./_agentdojo"
          # VERITAS source is pinned exactly, but its package-level OpenAI 1.53.0
          # requirement conflicts with AgentDojo >=1.59.7. This Final-128 profile
          # uses only the Bind/atomic-store surface, so install VERITAS source
          # without package dependencies and explicitly install that surface.
          pip install --no-deps -e "./_veritas"
          pip install "psycopg[binary]==3.2.9" "psycopg-pool==3.2.6" "alembic==1.18.4" "cryptography==50.0.0"
          pip install "openai>=1.59.7,<2"
          # Do not use pip check for the intentionally --no-deps VERITAS package:
          # its unrelated full-package OpenAI metadata is deliberately not the
          # runtime profile under proof. Verify the exact imported surfaces below.
          python - <<'PY'
          import openai, agentdojo, veritas_os
          from openai import OpenAI
          assert tuple(map(int, openai.__version__.split(".")[:2])) >= (1,59)
          OpenAI(api_key="sk-test-not-real", max_retries=0, timeout=60.0)
          from veritas_os.policy.live_adapter_bind_authorization_consumption_store import PostgresAtomicAuthorizationConsumptionStore, build_authorization_consumption_record
          from veritas_os.policy.bind_core import execute_bind_adjudication
          from veritas_os.benchmarks.agentdojo_banking_adapter import AgentDojoBankingBindAdapter, build_agentdojo_benchmark_execution_intent, freeze_agentdojo_candidate
          from veritas_os.security.hash import sha256_of_canonical_json
          import psycopg, psycopg_pool, cryptography
          print({"proof":"FINAL_128_DEPENDENCY_COMPATIBILITY_V1","openai":openai.__version__,"veritas_source_pin":"a1d66aef02262cf8a913295270c3aafd159c6adb","atomic_store_import":True,"bind_import":True,"agentdojo_adapter_import":True,"provider_calls":0,"database_access":0})
          PY
