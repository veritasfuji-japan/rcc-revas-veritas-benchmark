name: Final 128 V11 Manual Dispatch Template
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Exact V11 confirmation
        required: true
        type: string
permissions: {contents: read}
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11.16"}
      - name: V11 shared real-dispatch entrypoint
        env:
          # Intentionally blank before authorization/freeze. Future enabling must
          # preserve the consume/provider credential separation proved separately.
          OPENAI_API_KEY: ""
          VERITAS_DATABASE_URL: ""
          V11_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          python scripts/final_128_real_provider_wrapper_v9.py --real-dispatch
