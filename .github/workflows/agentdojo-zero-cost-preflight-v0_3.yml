name: AgentDojo Zero-Cost Preflight v0.3
on:
  pull_request:
    paths:
      - "contracts/AGENTDOJO_ZERO_COST_PREFLIGHT_v0.3.json"
      - "scripts/generate_agentdojo_authority_fixture_v0_1.py"
      - "scripts/verify_agentdojo_zero_cost_preflight_v0_3.py"
      - ".github/workflows/agentdojo-zero-cost-preflight-v0_3.yml"
      - "fixtures/agentdojo_authority_v0_1/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env: {AGENTDOJO_REPO: agentdojo_checkout}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: ethz-spylab/agentdojo
          ref: a75aba7631d3ca5fb7ab938965c97ead2f9ff84b
          path: agentdojo_checkout
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: "3.11.16"}
      - run: python -m pip install cryptography==50.0.1
      - name: Reproduce benchmark authority fixture
        run: |
          cp -R fixtures/agentdojo_authority_v0_1 /tmp/expected
          python scripts/generate_agentdojo_authority_fixture_v0_1.py
          diff -ru /tmp/expected fixtures/agentdojo_authority_v0_1
      - name: Verify authority and scorer source freeze
        run: python scripts/verify_agentdojo_zero_cost_preflight_v0_3.py
      - name: Assert gate closed
        run: |
          python - <<'PY'
          import json
          r=json.load(open("agentdojo-zero-cost-preflight-v0_3-audit.json"))
          assert r["execution_gate"]=="CLOSED" and r["provider_spend_cap_usd"]==0 and len(r["remaining"])==2
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: agentdojo-zero-cost-preflight-v0_3
          path: |
            contracts/AGENTDOJO_ZERO_COST_PREFLIGHT_v0.3.json
            fixtures/agentdojo_authority_v0_1/
            agentdojo-zero-cost-preflight-v0_3-audit.json
          retention-days: 90
