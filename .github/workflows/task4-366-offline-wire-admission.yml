name: Task4 366 Offline Wire Admission
on:
  pull_request:
    paths:
      - "scripts/task4_366_offline_wire_admission_v1.py"
      - "tests/test_task4_366_offline_wire_admission_v1.py"
      - "docs/TASK4_366_OFFLINE_WIRE_ADMISSION_V1.md"
      - ".github/workflows/task4-366-offline-wire-admission.yml"
permissions:
  contents: read
jobs:
  offline-admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
      - name: Run offline adversarial tests
        run: |
          set -euo pipefail
          python -m pip install pytest==9.1.1
          mkdir -p task4-366-artifact
          python -m pytest -q -o addopts= --junitxml=task4-366-artifact/junit.xml tests/test_task4_366_offline_wire_admission_v1.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: task4-366-offline-wire-admission-v1
          path: task4-366-artifact/
          retention-days: 30
          if-no-files-found: error
