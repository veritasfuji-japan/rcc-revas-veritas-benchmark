name: Final 128 RCC Pin Fetch Audit
on:
  pull_request:
    paths:
      - ".github/workflows/final-128-v4-single-use-manual-dispatch.yml"
      - ".github/workflows/final-128-rcc-pin-fetch-audit.yml"
permissions: {contents: read}
jobs:
  exact-rcc-pin:
    runs-on: ubuntu-latest
    env: {OPENAI_API_KEY: "", VERITAS_DATABASE_URL: ""}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Fetch exact historical RCC commit without provider execution
        run: |
          git init /tmp/rcc
          git -C /tmp/rcc remote add origin https://github.com/veritasfuji-japan/rcc-revas-veritas-benchmark.git
          git -C /tmp/rcc fetch --no-tags --depth=1 origin 1d3782d3aae5ff9c88036709c1a5642320cc53c2
          git -C /tmp/rcc checkout --detach FETCH_HEAD
          test "$(git -C /tmp/rcc rev-parse HEAD)" = "1d3782d3aae5ff9c88036709c1a5642320cc53c2"
