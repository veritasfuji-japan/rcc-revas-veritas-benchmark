name: Task4 466 Real Issuer Evidence Gap Audit OFFLINE NO-GO
on:
  pull_request:
    paths:
      - "scripts/task4_466_real_issuer_evidence_gap_audit_no_go_v1.py"
      - "tests/test_task4_466_real_issuer_evidence_gap_audit_no_go_v1.py"
      - "docs/TASK4_466_REAL_ISSUER_EVIDENCE_GAP_AUDIT_NO_GO_V1.md"
      - ".github/workflows/task4-466-real-issuer-gap-audit-offline.yml"

permissions:
  contents: read

jobs:
  real-issuer-evidence-read-only-no-go:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OPENAI_API_KEY: ""
      TASK4_OPENAI_API_KEY: ""
      OPENAI_BASE_URL: ""
      ANTHROPIC_API_KEY: ""
      VERITAS_DATABASE_URL: ""
      TASK4_466_PAID_APPROVAL: ""
      GITHUB_TOKEN: ""
      GH_TOKEN: ""
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PYTEST_ADDOPTS: ""
      PYTHONNOUSERSITE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
      - name: Install read-only local unit-test runner
        run: python -m pip install "pytest==9.1.1"
      - name: Validate pinned-source external-authority gap, fail-closed
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          python -m pytest -q -o addopts= \
            tests/test_task4_466_real_issuer_evidence_gap_audit_no_go_v1.py \
            --junitxml=results/task4-466-issuer-gap-junit.xml \
            | tee results/task4-466-test.log
          python -m scripts.task4_466_real_issuer_evidence_gap_audit_no_go_v1 \
            --output results/task4-466-read-only-no-go.json
          python - <<'PY'
          import json
          p="results/task4-466-read-only-no-go.json"
          r=json.load(open(p))
          assert len(r["research_evidence_gaps"]) == 8
          assert len(r["production_only_evidence_gaps"]) == 4
          assert all(g["status"] == "NOT_ATTESTED" for g in r["research_evidence_gaps"] + r["production_only_evidence_gaps"])
          assert r["real_provider_permission"] is False
          assert r["real_provider_dispatch"] == "DENY"
          assert r["real_provider_posts"] == 0
          assert r["score_status"] == "UNSCORED"
          print("TASK4_466_SOURCE_PINNED_ISSUER_EVIDENCE_GAPS_NO_REAL_AUTHORITY")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: task4-466-external-authority-gap-junit-sanitized
          path: results/*
          if-no-files-found: warn
