name: Paired Clean Scored Run v1

on:
  workflow_dispatch:
    inputs:
      runner_commit:
        description: Exact pinned paired-runner commit SHA
        required: true
        type: string
      acknowledged_contract_sha256:
        description: Exact counterparty-acknowledged frozen Contract v1.0 SHA-256
        required: true
        type: string
      confirmation:
        description: Type RUN_SINGLE_FROZEN_36_CASE_PAIRED_EVALUATION
        required: true
        type: string

permissions:
  contents: read

jobs:
  scored-paired-run:
    if: ${{ inputs.confirmation == 'RUN_SINGLE_FROZEN_36_CASE_PAIRED_EVALUATION' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RCC_REPO: rcc_upstream
      RCC_COMMIT: 805cd5ff17e431cf50a3dafa7f78a60a704613b9
      VERITAS_REPO: veritas_os_checkout
      VERITAS_COMMIT: b39961b003179aea70e320a57cb000f56a81951e
      CONTRACT_SHA256: 532958fc9371fb34e550fb2a108868c64e87a980833dd46e8a92c7a133d9ae1f
      DATASET_SHA256: 1e6ea7f9366876b4cbf041cc0841ab72bd58d6f561ff78553deb6645e5bf2a88
      RESULT_DIR: results/paired-clean-v1
    steps:
      - name: Refuse wrong acknowledged contract hash
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.acknowledged_contract_sha256 }}" = "$CONTRACT_SHA256"

      - name: Check out exact pinned paired runner
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.runner_commit }}
          persist-credentials: false

      - name: Verify runner checkout pin
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ inputs.runner_commit }}"
          test -z "$(git status --porcelain)"

      - name: Check out exact frozen RCC/REVAS publication
        uses: actions/checkout@v4
        with:
          repository: effacermonexistence/rcc-revas-veritas-benchmark
          ref: 805cd5ff17e431cf50a3dafa7f78a60a704613b9
          path: rcc_upstream
          persist-credentials: false

      - name: Check out exact frozen VERITAS treatment
        uses: actions/checkout@v4
        with:
          repository: veritasfuji-japan/veritas_os
          ref: b39961b003179aea70e320a57cb000f56a81951e
          path: veritas_os_checkout
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.16"

      - name: Verify frozen environment and source pins
        shell: bash
        run: |
          set -euo pipefail
          test "$(python -c 'import platform; print(platform.python_version())')" = "3.11.16"
          test "$(uname -m)" = "x86_64"
          test "$(git -C "$RCC_REPO" rev-parse HEAD)" = "$RCC_COMMIT"
          test -z "$(git -C "$RCC_REPO" status --porcelain)"
          test "$(git -C "$VERITAS_REPO" rev-parse HEAD)" = "$VERITAS_COMMIT"
          test -z "$(git -C "$VERITAS_REPO" status --porcelain)"
          test "$(sha256sum contracts/PAIRED_CLEAN_EVALUATION_CONTRACT_v1.0.json | awk '{print $1}')" = "$CONTRACT_SHA256"
          test "$(sha256sum fixtures/Governance_labelled_Evaluation_Set_v0.1.1.json | awk '{print $1}')" = "$DATASET_SHA256"

      - name: Install exact treatment dependencies
        run: |
          python -m pip install ./veritas_os_checkout pytest jsonschema cryptography==50.0.0

      - name: Re-run pin preflight before scored execution
        run: |
          python -m pytest -q tests/test_paired_clean_runner_v1.py
          python paired_clean_runner_v1.py             --preflight             --upstream-repo "$RCC_REPO"             --veritas-repo "$VERITAS_REPO"             > paired-clean-runner-preflight.json

      - name: Execute one complete frozen paired run
        run: |
          python paired_clean_runner_v1.py             --scored-run             --runner-commit "${{ inputs.runner_commit }}"             --acknowledged-contract-sha256 "${{ inputs.acknowledged_contract_sha256 }}"             --upstream-repo "$RCC_REPO"             --veritas-repo "$VERITAS_REPO"             --output-dir "$RESULT_DIR"

      - name: Fail closed on pairing, denominator, retry, cost, or effect violations
        shell: bash
        run: |
          set -euo pipefail
          for file in             paired_cases.jsonl environment_manifest.json governance_metrics.json             preservation_metrics.json operational_metrics.json summary.json run_manifest.json evidence_index.json; do
            test -s "$RESULT_DIR/$file"
          done
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RESULT_DIR"])
          rows = [json.loads(line) for line in (root / "paired_cases.jsonl").read_text().splitlines()]
          summary = json.loads((root / "summary.json").read_text())
          manifest = json.loads((root / "run_manifest.json").read_text())
          operational = json.loads((root / "operational_metrics.json").read_text())

          effects = (
              "credential_material_handoff",
              "transport_invoked",
              "network_dispatch",
              "external_effect",
              "bind_authorization_created",
              "execution_authority_created",
          )

          assert len(rows) == 36
          assert summary["enrolled"] == 36
          assert summary["same_candidate_handoff_count"] == 36
          assert summary["same_candidate_when_present_count"] <= summary["candidate_present_count"]
          assert summary["same_pre_state_count"] == 36
          assert summary["ground_truth_passed_to_treatment_helpers"] is False
          assert summary["labels_attached_after_treatment_attempts"] is True
          assert summary["selective_reruns"] == 0
          assert summary["denominator_reduction"] == 0
          assert manifest["paired_runner_commit"] == "${{ inputs.runner_commit }}"
          assert manifest["contract_sha256"] == os.environ["CONTRACT_SHA256"]
          assert manifest["dataset_sha256"] == os.environ["DATASET_SHA256"]
          assert manifest["veritas_commit"] == os.environ["VERITAS_COMMIT"]
          assert manifest["rcc_publication_commit"] == os.environ["RCC_COMMIT"]
          assert manifest["scored_execution_performed"] is True
          assert manifest["no_automatic_retry"] is True
          assert operational["retry_count"] == 0
          assert operational["cost_estimates_used"] is False
          assert operational["api_provider_calls"] == 0
          assert all(not row[name] for row in rows for name in effects)
          assert all(not summary[name] for name in effects)
          assert all(not manifest[name] for name in effects)
          PY

      - name: Upload immutable scored evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paired-clean-scored-run-v1-${{ inputs.runner_commit }}
          path: |
            paired-clean-runner-preflight.json
            results/paired-clean-v1/
          if-no-files-found: error

      - name: Mark incomplete paired attempt after evidence retention
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s "$RESULT_DIR/summary.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          summary = json.loads((Path(os.environ["RESULT_DIR"]) / "summary.json").read_text())
          if summary["infrastructure_error_count"] != 0:
              raise SystemExit("scored attempt retained but incomplete: infrastructure error(s)")
          if summary["pairing_violation_count"] != 0:
              raise SystemExit("scored attempt retained but invalid: pairing violation(s)")
          if summary["same_candidate_when_present_count"] != summary["candidate_present_count"]:
              raise SystemExit("scored attempt retained but invalid: candidate preservation mismatch")
          PY
