name: Task4 External Control Readiness Preflight V1
on:
  pull_request:
    paths:
      - ".github/workflows/task4-313-external-control-readiness-preflight-v1.yml"
      - "contracts/TASK4_313_EXTERNAL_CONTROL_READINESS_PREFLIGHT_V1.json"
      - "scripts/task4_313_external_control_readiness_preflight_v1.py"
      - "tests/test_task4_313_external_control_readiness_preflight_v1.py"
      - "docs/TASK4_313_EXTERNAL_CONTROL_READINESS_PREFLIGHT_V1.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/task4-313-external-control-readiness-preflight-v1.yml"
      - "contracts/TASK4_313_EXTERNAL_CONTROL_READINESS_PREFLIGHT_V1.json"
      - "scripts/task4_313_external_control_readiness_preflight_v1.py"
      - "tests/test_task4_313_external_control_readiness_preflight_v1.py"
      - "docs/TASK4_313_EXTERNAL_CONTROL_READINESS_PREFLIGHT_V1.md"

permissions:
  contents: read
  actions: read

jobs:
  offline-unselected-infrastructure-and-deny:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OPENAI_API_KEY: ""
      TASK4_OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      OPENAI_BASE_URL: ""
      VERITAS_DATABASE_URL: ""
      TASK4_THIRD_APPROVAL_PHRASE: ""
      TASK4_312_APPROVAL_PHRASE: ""
      TASK4_313_APPROVAL_PHRASE: ""
      TASK4_313_OFFLINE_PREFLIGHT: "1"
      PYTHONNOUSERSITE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PYTEST_ADDOPTS: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
      - name: Confirm historical one-use real Provider approval is consumed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/task4-third-two-real-provider-v1-consumed" --jq '.object.sha')" = "95ff6be8c5875ed3827a00fe71fb54bd9de48130"
          echo "TASK4_313_PRIOR_REAL_PROVIDER_AUTHORIZATION_STILL_CONSUMED"
      - name: Install test-only pytest
        shell: bash
        run: python -m pip install --disable-pip-version-check "pytest==9.1.1"
      - name: Audit pinned #312 design and reject all false attestations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          python -m pytest -q -o addopts= \
            tests/test_task4_313_external_control_readiness_preflight_v1.py \
            --junitxml=results/task4-313-readiness-junit.xml \
            | tee results/task4-313-readiness-tests.log
          python scripts/task4_313_external_control_readiness_preflight_v1.py \
            --output results/task4-313-readiness-report.json \
            | tee results/task4-313-readiness-audit.log
          python - <<'PY'
          import json
          r=json.load(open("results/task4-313-readiness-report.json"))
          assert r["final_live_decision"] == "DENY"
          assert len(r["unattested_external_pre_send_gates"]) == 12
          assert len(r["unresolved_infrastructure_dimensions"]) == 8
          assert r["external_attestation_count"] == 0
          assert r["remaining_db_superuser_bypass"] is True
          assert r["real_provider_calls"] == 0
          assert r["new_provider_authorizations"] == 0
          print("TASK4_313_ALL_REQUIREMENTS_UNATTESTED_NO_LIVE_AUTHORITY")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: task4-313-external-control-readiness-preflight-v1
          path: results/*
          if-no-files-found: warn
