name: Canonical Native Chain E2E V1

on:
  pull_request:
    paths:
      - ".github/workflows/canonical-native-chain-e2e-v1.yml"
      - "contracts/CANONICAL_NATIVE_CHAIN_E2E_V1.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-pin-chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BEN_PIN: 1d3782d3aae5ff9c88036709c1a5642320cc53c2
      VERITAS_PIN: 4f727cf8c4f060e47d62be4d1d535e6fc0d45a92
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: effacermonexistence/rcc-revas-veritas-benchmark
          ref: 1d3782d3aae5ff9c88036709c1a5642320cc53c2
          path: upstream
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: veritasfuji-japan/veritas_os
          ref: 4f727cf8c4f060e47d62be4d1d535e6fc0d45a92
          path: veritas_os_checkout
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.16"
      - name: Verify immutable pins
        run: |
          test "$(git -C upstream rev-parse HEAD)" = "$BEN_PIN"
          test "$(git -C veritas_os_checkout rev-parse HEAD)" = "$VERITAS_PIN"
      - name: Install exact native packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install ./veritas_os_checkout
          python -m pip install './upstream/external-eval/v0.3.9[crypto]'
          python -m pip install pytest
      - name: Execute Ben canonical decision-intent wrapper tests
        working-directory: upstream/external-eval/v0.3.9
        run: python -m pytest -q integration_tests/test_decide_pipeline.py -k "not test_fresh_native_http_policy_cda_bind_trustlog"
      - name: Execute Ben canonical authority and native Bind tests
        working-directory: upstream/external-eval/v0.3.9
        run: python -m pytest -q integration_tests/test_native_boundaries.py -k "real_native_bind_outcomes or native_failure_is_not_successful_refusal or persistent_reservation_survives_new_executor or real_crypto_authority_resolver_into_native_bind or native_bind_detects_mutating_authority_callback"
      - name: Assert exact wrapper implementations call native VERITAS boundaries
        run: |
          python - <<'PY'
          import inspect, sys
          sys.path.insert(0,"upstream/external-eval/v0.3.9/src")
          from rveval.integrations.decide_pipeline import NativeDecisionIntentFactory
          from rveval.integrations.veritas_authority import NativeAuthorityResolver
          from rveval.integrations.veritas_bind import NativeBindExecutor
          a=inspect.getsource(NativeDecisionIntentFactory)
          b=inspect.getsource(NativeAuthorityResolver)
          c=inspect.getsource(NativeBindExecutor)
          assert "build_canonical_verified_decision_promotion_packet" in a
          assert "verify_authority_evidence_artifact_to_proof" in b
          assert "execute_bind_adjudication" in c
          print("exact canonical wrappers and native VERITAS boundaries verified")
          PY
