name: Single Candidate Uninterrupted Canonical Trace V1

on:
  pull_request:
    paths:
      - ".github/workflows/single-candidate-uninterrupted-trace-v1.yml"
      - "contracts/SINGLE_CANDIDATE_UNINTERRUPTED_CANONICAL_CHAIN_V1.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  uninterrupted-trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BEN_PIN: 1d3782d3aae5ff9c88036709c1a5642320cc53c2
      BEN_PACKAGE: external-eval/v0.3.9
      VERITAS_PIN: 4f727cf8c4f060e47d62be4d1d535e6fc0d45a92
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: effacermonexistence/rcc-revas-veritas-benchmark
          ref: 1d3782d3aae5ff9c88036709c1a5642320cc53c2
          path: upstream
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: veritasfuji-japan/veritas_os
          ref: 4f727cf8c4f060e47d62be4d1d535e6fc0d45a92
          path: veritas_os_checkout
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.16"
      - name: Verify exact Ben pin
        run: |
          test "$(git -C upstream rev-parse HEAD)" = "$BEN_PIN"
          test -z "$(git -C upstream status --porcelain)"
          test "$(git -C veritas_os_checkout rev-parse HEAD)" = "$VERITAS_PIN"
          test -z "$(git -C veritas_os_checkout status --porcelain)"
      - name: Install exact canonical package
        run: |
          python -m pip install --upgrade pip
          python -m pip install ./veritas_os_checkout
          python -m pip install './upstream/external-eval/v0.3.9[crypto]'
          python -m pip install pytest
      - name: Run Ben fresh native HTTP policy CDA Bind TrustLog chain
        working-directory: upstream/external-eval/v0.3.9
        run: |
          python -m pytest -vv -s integration_tests/test_decide_pipeline.py -k test_fresh_native_http_policy_cda_bind_trustlog
      - name: Prove selected test contains one uninterrupted canonical chain
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("upstream/external-eval/v0.3.9/integration_tests/test_decide_pipeline.py")
          s=p.read_text()
          start=s.index("def test_fresh_native_http_policy_cda_bind_trustlog")
          tail=s[start:]
          markers=[
            "NativeDecisionIntentFactory",
            "NativeAuthorityResolver",
            "NativeBindExecutor",
          ]
          for m in markers:
            assert m in tail, m
          # NativeBindExecutor itself is source-pinned by Ben and calls native execute_bind_adjudication.
          b=Path("upstream/external-eval/v0.3.9/src/rveval/integrations/veritas_bind.py").read_text()
          assert "execute_bind_adjudication" in b
          print("single selected test contains canonical factory -> authority -> bind chain")
          PY
