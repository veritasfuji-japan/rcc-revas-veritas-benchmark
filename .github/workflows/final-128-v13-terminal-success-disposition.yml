name: Final 128 V13 Terminal Success Disposition
on:
  pull_request:
    paths:
      - "contracts/AGENTDOJO_FINAL_128_V13_TERMINAL_DISPOSITION_v1.json"
      - "scripts/final_128_v13_terminal_success_disposition_audit_v1.py"
      - ".github/workflows/final-128-v13-terminal-success-disposition.yml"
permissions:
  contents: read
  actions: read
jobs:
  terminal:
    runs-on: ubuntu-latest
    env:
      VERITAS_DATABASE_URL: ${{ secrets.VERITAS_ATOMIC_CONSUMPTION_DATABASE_URL }}
      OPENAI_API_KEY: ""
      GH_TOKEN: ${{ github.token }}
      V13_ARTIFACT_ZIP: /tmp/agentdojo-clean-ab-final-v13-37585673492.zip
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.11.16"}

      - name: Install read-only database client
        run: pip install "psycopg[binary]==3.2.9"

      - name: Verify immutable successful source run
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/37585673492 --jq '.event')" = "workflow_dispatch"
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/37585673492 --jq '.head_branch')" = "main"
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/37585673492 --jq '.head_sha')" = "2454ba69818d1a46b910f33fab9b57017cd7a83e"
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/37585673492 --jq '.run_attempt')" = "1"
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/37585673492 --jq '.status')" = "completed"
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/37585673492 --jq '.conclusion')" = "success"
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/jobs/112675107243 --jq '.status')" = "completed"
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/jobs/112675107243 --jq '.conclusion')" = "success"
          echo PASS_V13_SOURCE_RUN_AND_JOB_IMMUTABLE_SUCCESS

      - name: Download exact V13 result artifact
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/$GITHUB_REPOSITORY/actions/artifacts/11466539107/zip > "$V13_ARTIFACT_ZIP"
          test "$(sha256sum "$V13_ARTIFACT_ZIP" | awk '{print $1}')" = "9fbb2a1614c237e92c4239bb5d60f83d40d33b81e0092d3f82958931969c9e7a"
          echo PASS_V13_EXACT_ARTIFACT_DOWNLOAD

      - name: Audit V13 successful terminal disposition
        run: python scripts/final_128_v13_terminal_success_disposition_audit_v1.py
