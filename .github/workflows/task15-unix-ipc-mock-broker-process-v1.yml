name: Task15 Unix IPC Mock Broker Process V1
on:
  pull_request:
    paths:
      - ".github/workflows/task15-unix-ipc-mock-broker-process-v1.yml"
      - "scripts/task15_unix_ipc_mock_broker_server_v1.py"
      - "scripts/task15_unix_ipc_untrusted_worker_v1.py"
      - "scripts/task15_unix_ipc_mock_broker_process_audit_v1.py"
      - "contracts/TASK15_UNIX_IPC_MOCK_BROKER_PROCESS_V1.json"
      - "docs/TASK15_UNIX_IPC_MOCK_BROKER_PROCESS_V1.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/task15-unix-ipc-mock-broker-process-v1.yml"
      - "scripts/task15_unix_ipc_mock_broker_server_v1.py"
      - "scripts/task15_unix_ipc_untrusted_worker_v1.py"
      - "scripts/task15_unix_ipc_mock_broker_process_audit_v1.py"
      - "contracts/TASK15_UNIX_IPC_MOCK_BROKER_PROCESS_V1.json"
      - "docs/TASK15_UNIX_IPC_MOCK_BROKER_PROCESS_V1.md"
permissions:
  contents: read
jobs:
  unix-ipc-peercred-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OPENAI_API_KEY: ""
      OPENAI_BASE_URL: ""
      ANTHROPIC_API_KEY: ""
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: "."
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
      - name: Install exact offline signature dependency
        run: python -m pip install "cryptography==50.0.0"
      - name: Reproduce separate-process broker and untrusted Docker Unix IPC proof
        run: |
          set -euo pipefail
          mkdir -p results
          python scripts/task15_unix_ipc_mock_broker_process_audit_v1.py \
            --output-dir results | tee results.log
      - name: Upload raw Docker, process, Ed25519 and SQLite proof evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: task15-unix-ipc-mock-broker-process-v1
          path: |
            results/*
            results.log
          if-no-files-found: warn
