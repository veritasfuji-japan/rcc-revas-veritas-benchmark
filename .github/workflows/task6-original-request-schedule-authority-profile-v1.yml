name: Task6 Original Request Schedule Authority Profile V1
on:
  pull_request:
    paths:
      - "contracts/TASK6_ORIGINAL_REQUEST_SCHEDULE_AUTHORITY_PROFILE_V1.json"
      - "scripts/task6_original_request_schedule_authority_profile_audit_v1.py"
      - ".github/workflows/task6-original-request-schedule-authority-profile-v1.yml"
      - "task6_original_request_schedule_authority_profile_v1.py"
      - "tests/test_task6_original_request_schedule_authority_profile_v1.py"
      - "original_request_authority_lineage_v1.py"
      - "scripts/pairwise_protected_candidate_control_v1_1.py"
      - "contracts/TASK6_OPERATIONAL_METADATA_AUTHORITY_V1.json"
      - "scripts/task6_operational_metadata_authority_audit_v1.py"
      - "scripts/task4_send_money_execution_date_authority_audit_v1.py"
      - "agentdojo_constraint_resolver_v0_1.py"
      - "contracts/CONTROLLED_GOVERNANCE_TREATMENT_DELTA_ANALYSIS_V1.json"
      - "contracts/PAIRWISE_PROTECTED_CANDIDATE_REPLAY_HARNESS_V1.json"
  push:
    branches: [main]
    paths:
      - "contracts/TASK6_ORIGINAL_REQUEST_SCHEDULE_AUTHORITY_PROFILE_V1.json"
      - "scripts/task6_original_request_schedule_authority_profile_audit_v1.py"
      - ".github/workflows/task6-original-request-schedule-authority-profile-v1.yml"
      - "task6_original_request_schedule_authority_profile_v1.py"
      - "tests/test_task6_original_request_schedule_authority_profile_v1.py"
      - "original_request_authority_lineage_v1.py"
      - "scripts/pairwise_protected_candidate_control_v1_1.py"
      - "contracts/TASK6_OPERATIONAL_METADATA_AUTHORITY_V1.json"
      - "scripts/task6_operational_metadata_authority_audit_v1.py"
      - "scripts/task4_send_money_execution_date_authority_audit_v1.py"
      - "agentdojo_constraint_resolver_v0_1.py"
      - "contracts/CONTROLLED_GOVERNANCE_TREATMENT_DELTA_ANALYSIS_V1.json"
      - "contracts/PAIRWISE_PROTECTED_CANDIDATE_REPLAY_HARNESS_V1.json"
permissions:
  contents: read
  actions: read
jobs:
  authority-audit:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ""
      VERITAS_DATABASE_URL: ""
      GH_TOKEN: ${{ github.token }}
      REPLAY_ARTIFACT_ZIP: /tmp/task6-source-controlled-replay-v1.zip
      AGENTDOJO_ROOT: _pins/agentdojo
      VERITAS_ROOT: _pins/veritas
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
      - name: Verify immutable Task6 proof sources
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object contracts/TASK6_ORIGINAL_REQUEST_SCHEDULE_AUTHORITY_PROFILE_V1.json)" = "00aa0d4d85b019f717300b4a7c77e6ee3f36d17f"
          test "$(git hash-object scripts/task6_original_request_schedule_authority_profile_audit_v1.py)" = "e380652d024f32cd3d47800ced51c468823b5630"
          echo PASS_TASK6_LOCAL_PROOF_SOURCE_PINS
      - name: Checkout exact native banking source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _pins
          git clone --no-checkout https://github.com/ethz-spylab/agentdojo.git "$AGENTDOJO_ROOT"
          git -C "$AGENTDOJO_ROOT" checkout a75aba7631d3ca5fb7ab938965c97ead2f9ff84b
          git clone --no-checkout https://github.com/veritasfuji-japan/veritas_os.git "$VERITAS_ROOT"
          git -C "$VERITAS_ROOT" checkout a1d66aef02262cf8a913295270c3aafd159c6adb
      - name: Install isolated native model dependencies
        run: python -m pip install "pytest==9.1.1" "pydantic==2.11.10" "pydantic-core==2.33.2" "annotated-types==0.8.0" "typing-extensions==4.16.0" "typing-inspection==0.4.4"
      - name: Download frozen controlled replay result
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/$GITHUB_REPOSITORY/actions/artifacts/11472402060/zip > "$REPLAY_ARTIFACT_ZIP"
          test "$(sha256sum "$REPLAY_ARTIFACT_ZIP" | awk '{print $1}')" = "449443501266eea9aa83ab08f261740acf2296787483a80853469c6a02684b95"
      - name: Audit original request binding and closed date admission
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          python scripts/task6_original_request_schedule_authority_profile_audit_v1.py \
            --agentdojo-root "$AGENTDOJO_ROOT" \
            --veritas-root "$VERITAS_ROOT" \
            --replay-artifact "$REPLAY_ARTIFACT_ZIP" \
            --output-dir results \
            | tee results/task6-original-request-schedule-authority-profile-v1.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: task6-original-request-schedule-authority-profile-v1-${{ github.run_id }}
          path: results/task6-*
          if-no-files-found: error
