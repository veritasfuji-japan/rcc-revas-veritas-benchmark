name: Task4 464 Signed Issuer Date Scope OFFLINE NO-GO
on:
  pull_request:
    paths:
      - 'scripts/task4_464_signed_issuer_date_scope_offline_no_go_v1.py'
      - 'tests/test_task4_464_signed_issuer_date_scope_offline_no_go_v1.py'
      - 'docs/TASK4_464_SIGNED_ISSUER_DATE_SCOPE_OFFLINE_NO_GO_V1.md'
      - '.github/workflows/task4-464-signed-issuer-date-scope-offline.yml'
permissions:
  contents: read
jobs:
  synthetic-signed-issuer-denial:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OPENAI_API_KEY: ''
      TASK4_OPENAI_API_KEY: ''
      ANTHROPIC_API_KEY: ''
      OPENAI_BASE_URL: ''
      VERITAS_DATABASE_URL: ''
      TASK4_464_PAID_APPROVAL: ''
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTEST_ADDOPTS: ''
      PYTHONNOUSERSITE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Install offline-only verifier dependencies
        run: python -m pip install 'pytest==9.1.1' 'cryptography==50.0.0'
      - name: Verify signatures, scope, timestamps, and hard Provider deny
        run: |
          set -euo pipefail
          mkdir -p results
          python -m pytest -q -o addopts= \
            tests/test_task4_464_signed_issuer_date_scope_offline_no_go_v1.py \
            --junitxml=results/task4-464-signed-issuer-deny-junit.xml \
            | tee results/task4-464-test.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: task4-464-offline-signed-issuer-refusal-junit
          path: results/*
          if-no-files-found: warn
