name: Task4 463 Research Sender Pre-Dispatch Broker HARD NO-GO
on:
  pull_request:
    paths:
      - "scripts/task4_463_research_sender_broker_hard_nogo_v1.py"
      - "tests/test_task4_463_research_sender_broker_hard_nogo_v1.py"
      - "docs/TASK4_463_RESEARCH_SENDER_PREDISPATCH_BROKER_NO_GO_V1.md"
      - ".github/workflows/task4-463-research-sender-broker-hard-nogo.yml"

permissions:
  contents: read
  actions: read

jobs:
  research-sender-broker-presend-no-provider:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OPENAI_API_KEY: ""
      TASK4_OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      OPENAI_BASE_URL: ""
      VERITAS_DATABASE_URL: ""
      TASK4_463_PAID_APPROVAL: ""
      GITHUB_TOKEN: ""
      GH_TOKEN: ""
      TASK4_323_APPROVAL_PHRASE: ""
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PYTEST_ADDOPTS: ""
      PYTHONNOUSERSITE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      TASK4_463_NATIVE_PROOF: "1"
      TASK4_RCC_ROOT: "_pins/rcc"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
      - name: Historical Task4 third Provider permission is irrevocably consumed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/task4-third-two-real-provider-v1-consumed" --jq '.object.sha')" = "95ff6be8c5875ed3827a00fe71fb54bd9de48130"
      - name: Checkout exact frozen AgentDojo RCC and VERITAS sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _pins results
          git clone https://github.com/ethz-spylab/agentdojo.git _pins/agentdojo
          git -C _pins/agentdojo checkout a75aba7631d3ca5fb7ab938965c97ead2f9ff84b
          git clone https://github.com/effacermonexistence/rcc-revas-veritas-benchmark.git _pins/rcc
          git -C _pins/rcc checkout 1d3782d3aae5ff9c88036709c1a5642320cc53c2
          git clone https://github.com/veritasfuji-japan/veritas_os.git _pins/veritas
          git -C _pins/veritas checkout a1d66aef02262cf8a913295270c3aafd159c6adb
          test "$(git -C _pins/agentdojo rev-parse HEAD)" = "a75aba7631d3ca5fb7ab938965c97ead2f9ff84b"
          test "$(git -C _pins/rcc rev-parse HEAD)" = "1d3782d3aae5ff9c88036709c1a5642320cc53c2"
          test "$(git -C _pins/veritas rev-parse HEAD)" = "a1d66aef02262cf8a913295270c3aafd159c6adb"
      - name: Install frozen local-only SDK and Native dependencies
        shell: bash
        run: |
          set -euo pipefail
          pip install --no-deps -e ./_pins/agentdojo -e ./_pins/veritas
          pip install "pytest==9.1.1" "cryptography==50.0.0" "openai==1.109.1" "pydantic==2.11.10" "idna==3.15" "httpx==0.28.1" "requests==2.34.2" "PyYAML==6.0.3"
          python scripts/final_128_v12_locked_agentdojo_requirements_v1.py \
            --lock _pins/agentdojo/uv.lock \
            --output /tmp/task4-463-locked.txt
          pip install -r /tmp/task4-463-locked.txt
          pip install "tiktoken==0.12.0"
          python - <<'PY'
          from scripts.task4_326_offline_bpe_wire_gate_v1 import tiktoken_encoder
          print("TASK4_463_LOCAL_TOKENIZER_READY", tiktoken_encoder().name)
          PY
      - name: Native first SDK wire must consume through Broker then HARD DENY
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q -o addopts= \
            tests/test_task4_463_research_sender_broker_hard_nogo_v1.py \
            --junitxml=results/task4-463-sender-presend-junit.xml \
            | tee results/task4-463-pytest.txt
          python -m scripts.task4_463_research_sender_broker_hard_nogo_v1 \
            --output results/task4-463-sender-presend-hashes-only.json
          python - <<'PY'
          import json
          r=json.load(open("results/task4-463-sender-presend-hashes-only.json"))
          assert r["first_native_sdk_requests"] == 2
          assert r["local_broker_consumed_once"] == 2
          assert r["broker_replay_refusals_after_restart"] == 2
          assert len(r["source_pins_checked"]) == 2
          assert len(r["hash_only_pre_dispatch_receipts"]) == 2
          assert r["real_provider_dispatch"] == "DENY"
          assert r["sender_external_transport_installed"] is False
          assert r["environment_accessed"] is False
          assert r["fresh_owner_paid_consent"] is False
          assert r["actual_provider_calls"] == 0
          assert r["score_status"] == "UNSCORED"
          assert r["genuine_utility"] is None
          print("TASK4_463_REAL_SDK_TWO_FIRST_WIRES_BROKER_CONSUMED_PROVIDER_HARD_DENY")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: task4-463-native-first-sender-hard-deny-junit-hash-only
          path: results/*
          if-no-files-found: warn
