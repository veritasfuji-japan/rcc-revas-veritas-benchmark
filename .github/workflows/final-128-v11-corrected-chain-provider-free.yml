name: Final 128 V11 Corrected Chain Provider-Free
on:
  pull_request:
    paths:
      - "scripts/agentdojo_clean_ab_canonical_final_runner_v2_6.py"
      - "scripts/final_128_real_provider_wrapper_v9.py"
      - ".github/workflows/final-128-v11-corrected-chain-provider-free.yml"
permissions: {contents: read}
jobs:
  proof:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ""
      VERITAS_DATABASE_URL: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.11.16"}
      - name: Exact runtime validator accepts canonical V11 schema
        run: python scripts/final_128_real_provider_wrapper_v9.py --provider-free-preflight
