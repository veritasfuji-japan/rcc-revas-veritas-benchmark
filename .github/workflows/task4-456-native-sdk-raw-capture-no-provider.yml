name: Task4 456 SDK Raw Local Response to Native Scorer (No Provider)
on:
  pull_request:
    paths:
      - ".github/workflows/task4-456-native-sdk-raw-capture-no-provider.yml"
      - "scripts/task4_456_raw_response_native_lineage_offline_v1.py"
      - "tests/test_task4_456_raw_response_native_lineage_offline_v1.py"
      - "docs/TASK4_456_RAW_SDK_RESPONSE_NATIVE_LINEAGE_OFFLINE_V1.md"

permissions:
  contents: read
  actions: read

jobs:
  capture-raw-local-sdk-response-and-verify-native-terminal:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OPENAI_API_KEY: ""
      TASK4_OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      OPENAI_BASE_URL: ""
      VERITAS_DATABASE_URL: ""
      TASK4_323_APPROVAL_PHRASE: ""
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PYTEST_ADDOPTS: ""
      PYTHONNOUSERSITE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      TASK4_NATIVE_DATE_PROOF: "1"
      TASK4_TRANSPORT_PROOF: "1"
      TASK4_TRAJECTORY_PROOF: "1"
      TASK4_SCORER_OBSERVATION_PROOF: "1"
      TASK4_456_NATIVE_PROOF: "1"
      TASK4_RCC_ROOT: "_pins/rcc"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
      - name: Previous real Provider approval permanently consumed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/task4-third-two-real-provider-v1-consumed" --jq '.object.sha')" = "95ff6be8c5875ed3827a00fe71fb54bd9de48130"
          echo "TASK4_323_PREVIOUS_PROVIDER_GRANT_SPENT"
      - name: Exact native AgentDojo, RCC and VERITAS versions only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _pins results
          git clone https://github.com/ethz-spylab/agentdojo.git _pins/agentdojo
          git -C _pins/agentdojo checkout a75aba7631d3ca5fb7ab938965c97ead2f9ff84b
          git clone https://github.com/effacermonexistence/rcc-revas-veritas-benchmark.git _pins/rcc
          git -C _pins/rcc checkout 1d3782d3aae5ff9c88036709c1a5642320cc53c2
          git clone https://github.com/veritasfuji-japan/veritas_os.git _pins/veritas
          git -C _pins/veritas checkout a1d66aef02262cf8a913295270c3aafd159c6adb
          test "$(git -C _pins/agentdojo rev-parse HEAD)" = "a75aba7631d3ca5fb7ab938965c97ead2f9ff84b"
          test "$(git -C _pins/rcc rev-parse HEAD)" = "1d3782d3aae5ff9c88036709c1a5642320cc53c2"
          test "$(git -C _pins/veritas rev-parse HEAD)" = "a1d66aef02262cf8a913295270c3aafd159c6adb"
      - name: Install pinned native-only evaluator and frozen dependencies
        shell: bash
        run: |
          set -euo pipefail
          pip install --no-deps -e ./_pins/agentdojo -e ./_pins/veritas
          pip install "pytest==9.1.1" "cryptography==50.0.0" "openai==1.109.1" "pydantic==2.11.10" "idna==3.15" "httpx==0.28.1" "requests==2.34.2" "PyYAML==6.0.3"
          python scripts/final_128_v12_locked_agentdojo_requirements_v1.py \
            --lock _pins/agentdojo/uv.lock \
            --output /tmp/task4-323-agentdojo-locked.txt
          pip install -r /tmp/task4-323-agentdojo-locked.txt
      - name: Capture actual unchanged SDK-visible LOCAL responses and join Native scorer
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q -o addopts= \
            tests/test_task4_456_raw_response_native_lineage_offline_v1.py \
            --junitxml=results/task4-456-native-raw-lineage-junit.xml \
            | tee results/task4-456-native-raw-lineage-pytest.log
          python -m scripts.task4_456_raw_response_native_lineage_offline_v1 \
            --mode offline-native-raw-capture \
            --output results/task4-456-raw-response-native-lineage-report.json
          python - <<'PY'
          import json
          r=json.load(open("results/task4-456-raw-response-native-lineage-report.json"))
          assert r["distinct_raw_sdk_response_count"] == 8
          assert r["complete_native_terminals_locally"] == 2
          assert r["detached_native_scorer_calls_locally"] == 2
          assert r["real_provider_calls"] == 0
          assert r["new_genuine_native_utility_scores"] == 0
          assert r["durable_encrypted_provider_capture_present"] is False
          assert r["live_provider_dispatch"] == "DENY"
          assert "raw_response" not in r["response_receipts"][0]
          print("TASK4_456_LOCAL_RAW_SDK_TO_NATIVE_TO_SCORER_NO_PROVIDER")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: task4-456-native-raw-sdk-response-provenance-v1
          path: results/*
          if-no-files-found: warn
