name: Final128 357 Isolated Tag Probe Offline
on:
  pull_request:
    paths:
      - "scripts/final128_357_task1_isolated_tag_negative_probe_v1.py"
      - "tests/test_final128_357_task1_isolated_tag_negative_probe_v1.py"
      - ".github/workflows/final128-357-isolated-tag-negative-probe-offline.yml"
permissions:
  contents: read
jobs:
  mocked-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
      - run: python -m pip install pytest
      - run: python -m pytest -q -o addopts= tests/test_final128_357_task1_isolated_tag_negative_probe_v1.py
