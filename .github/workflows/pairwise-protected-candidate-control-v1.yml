name: Pairwise Protected Candidate Control V1
on:
  pull_request:
    paths:
      - "contracts/PAIRWISE_PROTECTED_CANDIDATE_CONTROL_V1.json"
      - "scripts/pairwise_protected_candidate_control_v1.py"
      - "scripts/pairwise_protected_candidate_control_audit_v1.py"
      - ".github/workflows/pairwise-protected-candidate-control-v1.yml"
permissions:
  contents: read
  actions: read
jobs:
  control:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ""
      VERITAS_DATABASE_URL: ""
      GH_TOKEN: ${{ github.token }}
      V13_ARTIFACT_ZIP: /tmp/agentdojo-clean-ab-final-v13-37585673492.zip
      RCC_ROOT: _pins/rcc
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"

      - name: Checkout exact RCC pin
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/effacermonexistence/rcc-revas-veritas-benchmark.git "$RCC_ROOT"
          git -C "$RCC_ROOT" checkout 1d3782d3aae5ff9c88036709c1a5642320cc53c2

      - name: Download exact V13 result artifact
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/$GITHUB_REPOSITORY/actions/artifacts/11466539107/zip > "$V13_ARTIFACT_ZIP"
          test "$(sha256sum "$V13_ARTIFACT_ZIP" | awk '{print $1}')" = "9fbb2a1614c237e92c4239bb5d60f83d40d33b81e0092d3f82958931969c9e7a"
          echo PASS_PAIRWISE_CONTROL_EXACT_V13_ARTIFACT

      - name: Audit pairwise protected candidate control
        run: python scripts/pairwise_protected_candidate_control_audit_v1.py
