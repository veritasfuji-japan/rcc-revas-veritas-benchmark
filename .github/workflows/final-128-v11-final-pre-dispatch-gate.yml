name: Final 128 V11 Final Pre-Dispatch Gate
on:
  pull_request:
    paths:
      - "scripts/final_128_v11_static_pre_dispatch_audit_v1.py"
      - "scripts/final_128_v11_final_pre_dispatch_gate_v1.py"
      - ".github/workflows/final-128-v11-final-pre-dispatch-gate.yml"
permissions: {contents: read}
jobs:
  gate:
    runs-on: ubuntu-latest
    env:
      VERITAS_DATABASE_URL: ${{ secrets.VERITAS_ATOMIC_CONSUMPTION_DATABASE_URL }}
      OPENAI_API_KEY: ""
      PRE_DISPATCH_BASE_MAIN_SHA: "3a6d33ded0b0c3c4c4ff75d4497306da5a3b8c27"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.11.16"}
      - name: Install read-only database client
        run: pip install "psycopg[binary]==3.2.9"
      - name: Verify exact V11 chain and empty execution workspace
        run: python scripts/final_128_v11_static_pre_dispatch_audit_v1.py
      - name: Re-verify exact human confirmation binding
        env:
          VERITAS_DATABASE_URL: ""
        run: python scripts/final_128_v11_human_confirmation_audit_v1.py
      - name: Re-verify credential boundary semantics
        run: python scripts/final_128_v11_credential_boundary_audit_v1.py
      - name: Verify durable V11 authorization is still unconsumed
        run: python scripts/final_128_v11_final_pre_dispatch_gate_v1.py
