name: AgentDojo Frozen OpenAI Adapter v0.1
on:
  pull_request:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.16"
      - run: python -m pip install pytest
      - run: PYTHONPATH=. pytest -q tests/test_agentdojo_openai_frozen_adapter_v0_1.py
      - run: python -c 'import json; c=json.load(open("contracts/AGENTDOJO_OPENAI_ADAPTER_FREEZE_v0.1.json")); assert c["execution_gate"]=="CLOSED" and c["frozen_adapter"]["max_attempts"]==1 and c["api_called_by_this_freeze"] is False'
