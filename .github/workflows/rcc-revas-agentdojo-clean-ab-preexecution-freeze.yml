name: RCC REVAS AgentDojo Clean A-B Pre-Execution Freeze

on:
  pull_request:
    paths:
      - ".github/workflows/rcc-revas-agentdojo-clean-ab-preexecution-freeze.yml"
      - "contracts/agentdojo_clean_ab_preexecution_freeze_v1.json"
      - "scripts/verify_agentdojo_clean_ab_preexecution_freeze.py"
      - "docs/RCC_REVAS_AGENTDOJO_CLEAN_AB_PREEXECUTION_FREEZE.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freeze-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VERITAS_REPO: veritas_os_checkout
      VERITAS_COMMIT: 825e5c5c539c98e12b0c9702f3cb4a12d67539d3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: veritasfuji-japan/veritas_os
          ref: 825e5c5c539c98e12b0c9702f3cb4a12d67539d3
          path: veritas_os_checkout
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.16"
      - name: Verify exact VERITAS pin
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C "$VERITAS_REPO" rev-parse HEAD)" = "$VERITAS_COMMIT"
          test -z "$(git -C "$VERITAS_REPO" status --porcelain)"
      - name: Install pinned VERITAS
        run: |
          python -m pip install --upgrade pip
          python -m pip install "./$VERITAS_REPO"
      - name: Verify pre-execution freeze
        run: python scripts/verify_agentdojo_clean_ab_preexecution_freeze.py
      - name: Run pinned AgentDojo adapter regressions
        run: |
          python -m pip install pytest
          python -m pytest -q             "$VERITAS_REPO/veritas_os/tests/test_agentdojo_banking_bind_adapter.py"             "$VERITAS_REPO/veritas_os/tests/test_agentdojo_banking_same_candidate.py"
      - name: Assert execution gate remains closed
        shell: bash
        run: |
          python - <<'PY'
          import json
          r=json.load(open("agentdojo-clean-ab-freeze-audit.json"))
          assert r["status"]=="PASS_PREEXECUTION_FREEZE_CANDIDATE_GATE_CLOSED"
          assert r["execution_gate"]=="CLOSED"
          assert len(r["unresolved_before_execution"])==8
          assert r["claim_boundary"]["external_benchmark_executed"] is False
          assert r["claim_boundary"]["clean_ab_executed"] is False
          PY
      - name: Upload freeze evidence
        uses: actions/upload-artifact@v4
        with:
          name: rcc-revas-agentdojo-clean-ab-preexecution-freeze
          path: |
            contracts/agentdojo_clean_ab_preexecution_freeze_v1.json
            agentdojo-clean-ab-freeze-audit.json
          if-no-files-found: error
          retention-days: 90
