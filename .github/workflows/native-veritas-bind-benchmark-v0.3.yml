name: Native VERITAS Bind benchmark v0.3

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  native-bind-chain-v03:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VERITAS_COMMIT: 3d9b8f85138fb0c5cde48915f10410861d015abc
      VERITAS_CHECKOUT: veritas_os_checkout
      RESULT_DIR: results/native-v0.3
    steps:
      - name: Check out benchmark PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check out pinned VERITAS
        uses: actions/checkout@v4
        with:
          repository: veritasfuji-japan/veritas_os
          ref: 3d9b8f85138fb0c5cde48915f10410861d015abc
          path: veritas_os_checkout
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify and install pinned VERITAS
        run: |
          set -euo pipefail
          test "$(git -C "$VERITAS_CHECKOUT" rev-parse HEAD)" = "$VERITAS_COMMIT"
          test -z "$(git -C "$VERITAS_CHECKOUT" status --porcelain)"
          python -m pip install ./veritas_os_checkout pytest jsonschema
      - name: Reverify historical benchmark inputs
        run: |
          python run_joint_benchmark.py --self-check
          python -m pytest -q tests/test_runner.py
          python run_joint_benchmark_v0_2.py --self-check
          python -m pytest -q tests/test_runner_v0_2.py
      - name: Run v0.3 checks and native benchmark
        run: |
          python run_joint_benchmark_v0_3.py --self-check
          python -m pytest -q tests/test_runner_v0_3.py
          python run_joint_benchmark_v0_3.py             --veritas-repo "$VERITAS_CHECKOUT" --output-dir "$RESULT_DIR"
      - name: Fail closed on integrity, compatibility regression, or effects
        run: |
          set -euo pipefail
          for file in cases.jsonl summary.json run_manifest.json report.md; do
            test -s "$RESULT_DIR/$file"
          done
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("results/native-v0.3")
          cases = [
              json.loads(line)
              for line in (root / "cases.jsonl").read_text().splitlines()
          ]
          summary = json.loads((root / "summary.json").read_text())
          manifest = json.loads((root / "run_manifest.json").read_text())
          flags = (
              "real_bind_invoked",
              "bind_authorization_created",
              "execution_authority_created",
              "bind_receipt_created",
              "request_dispatched",
              "credential_material_accessed",
              "authorization_header_constructed",
              "network_used",
              "external_effect_occurred",
          )
          expected_no_approval = {
              "GOV-A04", "GOV-A07", "GOV-A10", "GOV-A11", "GOV-A12"
          }

          assert len(cases) == 36
          assert manifest["pinned_veritas_commit"] == (
              "3d9b8f85138fb0c5cde48915f10410861d015abc"
          )
          assert manifest["veritas_repo_dirty"] is False
          assert summary["handoff_ready_cases"] == 12
          assert summary["native_bind_chain_eligible_cases"] == 12
          assert summary["native_bind_gate_invoked_count"] == 12
          assert summary["native_bind_gate_pass_count"] == 12
          assert summary["native_bind_gate_fail_count"] == 0
          assert summary["native_bind_gate_not_reached_count"] == 24
          assert summary[
              "approval_not_required_native_compatibility_block_count"
          ] == 0
          assert summary[
              "approval_not_required_native_gate_invoked_count"
          ] == 5
          assert set(summary["approval_not_required_native_gate_case_ids"]) == (
              expected_no_approval
          )
          assert summary["approval_required_native_gate_invoked_count"] == 7
          assert summary["mismatch_case_ids"] == []
          assert summary["full_chain_bind_eligibility_accuracy"] == 1.0

          by_id = {row["case_id"]: row for row in cases}
          for case_id in expected_no_approval:
              row = by_id[case_id]
              assert row["native_bind_gate_invoked"] is True
              assert row["native_bind_gate_outcome"] == (
                  "PASSED_FOR_FUTURE_BIND_AUTHORIZATION_ARTIFACT"
              )
              assert row["approval_requirement_state"] == (
                  "NOT_REQUIRED_BY_ACTION_CONTRACT"
              )
              assert row["human_approval_linkage_invoked"] is False

          assert all(not row[flag] for row in cases for flag in flags)
          assert all(not manifest[flag] for flag in flags)
          PY
      - name: Upload v0.3 scientific results
        uses: actions/upload-artifact@v4
        with:
          name: native-veritas-bind-benchmark-v0.3
          path: results/native-v0.3/
          if-no-files-found: error
