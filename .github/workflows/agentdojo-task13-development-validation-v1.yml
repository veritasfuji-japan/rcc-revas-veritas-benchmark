name: AgentDojo Task 13 Development Validation V1

on:
  workflow_dispatch:
    inputs:
      runner_commit:
        description: Exact reviewed development-runner commit SHA
        required: true
        type: string
      confirmation:
        description: Type RUN_TASK13_DEVELOPMENT_VALIDATION_V1
        required: true
        type: string

permissions:
  contents: read

jobs:
  task13-development:
    if: ${{ inputs.confirmation == 'RUN_TASK13_DEVELOPMENT_VALIDATION_V1' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.runner_commit }}
          persist-credentials: false
      - name: Verify exact development runner
        run: test "$(git rev-parse HEAD)" = "${{ inputs.runner_commit }}"
      - uses: actions/checkout@v4
        with:
          repository: ethz-spylab/agentdojo
          ref: a75aba7631d3ca5fb7ab938965c97ead2f9ff84b
          path: _pins/agentdojo
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: effacermonexistence/rcc-revas-veritas-benchmark
          ref: 1d3782d3aae5ff9c88036709c1a5642320cc53c2
          path: _pins/rcc
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: veritasfuji-japan/veritas_os
          ref: 99bdb9e684f422a8f6ef083d3330dc9fd5346583
          path: _pins/veritas
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.16"
      - run: python -m pip install -U pip
      - run: python -m pip install -e _pins/agentdojo cryptography==50.0.1
      - run: python -m pip install -e '_pins/rcc/external-eval/v0.3.9[crypto]'
      - run: python -m pip install -e _pins/veritas --no-deps
      - name: Verify OpenAI API key
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: test -n "$OPENAI_API_KEY"
      - name: Verify Task 13 offline full-Bind boundary
        run: |
          PYTHONPATH=.:_pins/veritas python scripts/agentdojo_task13_full_bind_offline_proof_v0_1.py \
            --veritas-root _pins/veritas
      - name: Run Task 13 development validation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          PYTHONPATH=.:_pins/veritas python scripts/agentdojo_task13_development_validation_v1.py \
            --agentdojo-root _pins/agentdojo --rcc-root _pins/rcc --veritas-root _pins/veritas \
            --output-dir results/task13-development-v1
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task13-development-validation-v1-${{ inputs.runner_commit }}
          path: results/task13-development-v1/
          if-no-files-found: error
