name: Task4 Research Variable Runner Local Native V1
on:
  pull_request:
    paths:
      - "task4_research_*.py"
      - "tests/test_task4_research_experiment_profile_v1.py"
      - "validation/task4_research_runner_native_checks.py"
      - "docs/TASK4_RESEARCH_VARIABLE_RUNNER_V1.md"
      - ".github/workflows/task4-research-variable-runner-v1.yml"
      - "task4_trusted_execution_date_profile_v1.py"
      - "task4_trusted_execution_date_runner_integration_v1.py"
      - "scripts/agentdojo_clean_ab_canonical_final_runner_v2_8.py"
      - "scripts/agentdojo_native_scorer_invocation_v0_1.py"
      - "scripts/task4_319_injected_scripted_wire_native_terminal_audit_v1.py"
      - "agentdojo_constraint_resolver_v0_1.py"
permissions:
  contents: read
jobs:
  local-native-research-runner:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: "."
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PYTEST_ADDOPTS: ""
      TASK4_RESEARCH_AGENTDOJO_ROOT: "_pins/agentdojo"
      TASK4_RESEARCH_RCC_ROOT: "_pins/rcc"
      TASK4_RESEARCH_VERITAS_ROOT: "_pins/veritas"
      TASK4_NATIVE_DATE_PROOF: "1"
      TASK4_RCC_ROOT: "_pins/rcc"
      OPENAI_API_KEY: ""
      TASK4_OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      OPENAI_BASE_URL: ""
      VERITAS_DATABASE_URL: ""
      GH_TOKEN: ""
      GITHUB_TOKEN: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ethz-spylab/agentdojo
          ref: a75aba7631d3ca5fb7ab938965c97ead2f9ff84b
          path: _pins/agentdojo
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: effacermonexistence/rcc-revas-veritas-benchmark
          ref: 1d3782d3aae5ff9c88036709c1a5642320cc53c2
          path: _pins/rcc
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: veritasfuji-japan/veritas_os
          ref: a1d66aef02262cf8a913295270c3aafd159c6adb
          path: _pins/veritas
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
      - name: Install the existing pinned Native dependencies
        run: |
          python -m pip install --no-deps -e ./_pins/agentdojo -e ./_pins/veritas
          python -m pip install "pytest==9.1.1" "cryptography==50.0.0" "openai==1.109.1" "pydantic==2.11.10" "idna==3.15" "httpx==0.28.1" "requests==2.34.2" "PyYAML==6.0.3"
          python scripts/final_128_v12_locked_agentdojo_requirements_v1.py --lock _pins/agentdojo/uv.lock --output /tmp/task4-research-native-lock.txt
          python -m pip install -r /tmp/task4-research-native-lock.txt
      - name: Variable histories and unchanged date/Bind boundaries
        run: |
          mkdir -p results
          git rev-parse HEAD > results/task4-research-tested-head.txt
          python -m pytest -q -o addopts= \
            tests/test_task4_research_experiment_profile_v1.py \
            validation/task4_research_runner_native_checks.py \
            tests/test_task4_trusted_execution_date_profile_v1.py \
            tests/test_task4_trusted_execution_date_runner_integration_v1.py \
            --junitxml=results/task4-research-native-junit.xml
      - name: Require all selected tests without skips
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          r = ET.parse('results/task4-research-native-junit.xml').getroot()
          suites = [r] if r.tag == 'testsuite' else list(r.findall('testsuite'))
          assert suites and sum(int(s.get('tests', '0')) for s in suites) >= 64
          assert all(int(s.get(k, '0')) == 0 for s in suites for k in ('failures', 'errors', 'skipped'))
          Path('results/task4-research-scope.txt').write_text(
              'LOCAL_SCRIPTED_CALLBACKS_ONLY\nREAL_PROVIDER_NO_GO\nUTILITY_UNSCORED\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: task4-research-variable-runner-local-native-${{ github.run_id }}
          path: results/task4-research-*
          if-no-files-found: error
