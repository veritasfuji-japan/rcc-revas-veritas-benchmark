name: Task4 Offline Infrastructure Candidate Evidence Selection V1
on:
  pull_request:
    paths:
      - ".github/workflows/task4-314-offline-infra-candidate-evidence-selection-v1.yml"
      - "contracts/TASK4_314_OFFLINE_INFRA_CANDIDATE_EVIDENCE_SELECTION_V1.json"
      - "scripts/task4_314_offline_infra_candidate_evidence_selection_v1.py"
      - "tests/test_task4_314_offline_infra_candidate_evidence_selection_v1.py"
      - "docs/TASK4_314_OFFLINE_INFRA_CANDIDATE_EVIDENCE_SELECTION_V1.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/task4-314-offline-infra-candidate-evidence-selection-v1.yml"
      - "contracts/TASK4_314_OFFLINE_INFRA_CANDIDATE_EVIDENCE_SELECTION_V1.json"
      - "scripts/task4_314_offline_infra_candidate_evidence_selection_v1.py"
      - "tests/test_task4_314_offline_infra_candidate_evidence_selection_v1.py"
      - "docs/TASK4_314_OFFLINE_INFRA_CANDIDATE_EVIDENCE_SELECTION_V1.md"

permissions:
  contents: read
  actions: read

jobs:
  offline-candidate-matrix-live-always-deny:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OPENAI_API_KEY: ""
      TASK4_OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      OPENAI_BASE_URL: ""
      VERITAS_DATABASE_URL: ""
      TASK4_THIRD_APPROVAL_PHRASE: ""
      TASK4_313_APPROVAL_PHRASE: ""
      TASK4_314_APPROVAL_PHRASE: ""
      TASK4_314_OFFLINE_MATRIX_AUDIT: "1"
      PYTHONNOUSERSITE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PYTEST_ADDOPTS: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
      - name: Confirm previous real Provider consent remains consumed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/task4-third-two-real-provider-v1-consumed" --jq '.object.sha')" = "95ff6be8c5875ed3827a00fe71fb54bd9de48130"
          echo "TASK4_314_OLD_PROVIDER_APPROVAL_CONSUMED"
      - name: Install offline pytest only
        run: python -m pip install --disable-pip-version-check "pytest==9.1.1"
      - name: Reject false infrastructure and external safety claims
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          python -m pytest -q -o addopts= \
            tests/test_task4_314_offline_infra_candidate_evidence_selection_v1.py \
            --junitxml=results/task4-314-matrix-junit.xml \
            | tee results/task4-314-matrix-tests.log
          python scripts/task4_314_offline_infra_candidate_evidence_selection_v1.py \
            --output results/task4-314-matrix-audit.json \
            | tee results/task4-314-matrix-audit.log
          python - <<'PY'
          import json
          r = json.load(open("results/task4-314-matrix-audit.json"))
          assert r["candidate_count"] == 4
          assert r["external_gates_unattested"] == 12
          assert r["independent_owner_roles_unassigned"] == 8
          assert r["privileged_admin_bypass_unresolved"] is True
          assert r["live_provider_calls"] == 0
          assert r["cloud_resources_created"] == 0
          assert r["final_live_decision"] == "DENY"
          print("TASK4_314_MATRIX_RESEARCH_ONLY_AND_PROVIDER_DISPATCH_DENY")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: task4-314-offline-infra-candidate-evidence-selection-v1
          path: results/*
          if-no-files-found: warn
