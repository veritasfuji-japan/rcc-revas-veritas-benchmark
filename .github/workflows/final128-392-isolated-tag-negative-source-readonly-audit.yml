name: Final128 392 Isolated Tag Negative Source Readonly Audit
on:
  pull_request:
    paths:
      - ".github/workflows/final128-392-isolated-protected-tag-negative-operations-probe.yml"
      - ".github/workflows/final128-392-isolated-tag-negative-source-readonly-audit.yml"
      - "scripts/final128_392_isolated_tag_negative_source_audit_v1.py"
      - "tests/test_final128_392_isolated_tag_negative_source_audit_v1.py"
      - "docs/optimization/FINAL128_392_TASK1_ISOLATED_TAG_NEGATIVE_OPERATIONS_STAGE_V1.md"
permissions:
  contents: read
jobs:
  staged-negative-source-readonly:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    env:
      PYTHONPATH: "."
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      OPENAI_API_KEY: ""
      TASK4_OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      GITHUB_TOKEN: ""
      GH_TOKEN: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
      - name: Confirm PR HEAD and no Provider secrets
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          mkdir -p results
          git rev-parse HEAD > results/final128-392-head.txt
          for var in OPENAI_API_KEY TASK4_OPENAI_API_KEY ANTHROPIC_API_KEY GITHUB_TOKEN GH_TOKEN; do
            test -z "$(printenv "$var" || true)"
          done
          python -m py_compile scripts/final128_392_isolated_tag_negative_source_audit_v1.py tests/test_final128_392_isolated_tag_negative_source_audit_v1.py
      - name: Install only pinned offline test runner
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "pytest==9.1.1"
      - name: Verify source/negative classifiers and GitHub two public GETs
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q -o addopts= tests/test_final128_392_isolated_tag_negative_source_audit_v1.py \
            --junitxml=results/final128-392-junit.xml | tee results/final128-392-tests.log
          python scripts/final128_392_isolated_tag_negative_source_audit_v1.py \
            --output results/final128-392-offline-audit.json
          python scripts/final128_392_isolated_tag_negative_source_audit_v1.py \
            --observe --output results/final128-392-readonly-live-github.json
      - name: Enforce evidence limit and sha256 manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json,hashlib,xml.etree.ElementTree as ET
          root=ET.parse("results/final128-392-junit.xml").getroot()
          suites=[root] if root.tag=="testsuite" else list(root.findall("testsuite"))
          assert suites
          counts={k:sum(int(s.get(k,"0")) for s in suites)
                  for k in ("tests","failures","errors","skipped")}
          assert counts["tests"]>=55
          assert counts["failures"]==counts["errors"]==counts["skipped"]==0
          offline=json.loads(Path("results/final128-392-offline-audit.json").read_text())
          live=json.loads(Path("results/final128-392-readonly-live-github.json").read_text())
          assert offline["mode"]=="OFFLINE_NO_NETWORK"
          assert live["mode"]=="TWO_PUBLIC_READONLY_GITHUB_GET_REQUESTS"
          assert offline["workflow_exact_blob_sha"]==live["workflow_exact_blob_sha"]
          assert offline["actual_github_mutations_or_attempts_by_this_audit"]==0
          assert live["actual_github_mutations_or_attempts_by_this_audit"]==0
          assert live["current_tag_matches_creation_proof"] is True
          assert live["rule_matches_test_tag_and_has_prohibitions"] is True
          assert live["bypass_status"] in ("NO_BYPASS_OBSERVED","UNKNOWN_MISSING_PRIVILEGED_FIELDS")
          assert live["real_negative_mutation_experiment_executed"] is False
          assert live["task1_paid_provider_authorized"] is False
          assert live["actual_duplicate_update_delete_denials_observed_in_this_audit"] is False
          sha=lambda f:hashlib.sha256(Path(f).read_bytes()).hexdigest()
          result={
              "schema":"veritas.final128.392-offline-source-and-current-tag-evidence.v1",
              "head":Path("results/final128-392-head.txt").read_text().strip(),
              "test_counts":counts,
              "offline_sha256":sha("results/final128-392-offline-audit.json"),
              "readback_sha256":sha("results/final128-392-readonly-live-github.json"),
              "actual_github_write_attempts":0,
              "actual_provider_calls":0,
              "native_scorer_calls":0,
              "production_bypass_resistance_proven":False,
              "tag_negative_real_run_completed":False,
              "paid_task1_authorized":False,
          }
          result["self_sha256"]=hashlib.sha256(json.dumps(result,
              sort_keys=True,separators=(",",":")).encode()).hexdigest()
          Path("results/final128-392-evidence.json").write_text(
              json.dumps(result,sort_keys=True,indent=2)+"\n")
          print("392_ISOLATED_TAG_NEGATIVE_PROBE_STAGED_ONLY_NO_WRITES_NO_PROVIDER")
          PY
          sha256sum \
            .github/workflows/final128-392-isolated-protected-tag-negative-operations-probe.yml \
            scripts/final128_392_isolated_tag_negative_source_audit_v1.py \
            tests/test_final128_392_isolated_tag_negative_source_audit_v1.py \
            docs/optimization/FINAL128_392_TASK1_ISOLATED_TAG_NEGATIVE_OPERATIONS_STAGE_V1.md \
            results/final128-392-offline-audit.json \
            results/final128-392-readonly-live-github.json \
            results/final128-392-junit.xml \
            results/final128-392-evidence.json > results/final128-392-sha256.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: final128-392-staged-test-only-tag-negative-readonly-unscored
          path: results/final128-392-*
          if-no-files-found: warn
