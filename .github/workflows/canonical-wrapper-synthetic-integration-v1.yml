name: Canonical Wrapper Synthetic Integration V1
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type RUN_CANONICAL_WRAPPER_SYNTHETIC_V1
        required: true
        type: string
permissions:
  contents: read
jobs:
  synthetic-wrapper-real-postgres:
    if: ${{ inputs.confirmation == 'RUN_CANONICAL_WRAPPER_SYNTHETIC_V1' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VERITAS_DATABASE_URL: ${{ secrets.VERITAS_ATOMIC_CONSUMPTION_DATABASE_URL }}
      VERITAS_DB_POOL_MIN_SIZE: "1"
      VERITAS_DB_POOL_MAX_SIZE: "10"
      VERITAS_DB_CONNECT_TIMEOUT: "10"
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11.16"}
      - uses: actions/checkout@v4
        with:
          repository: veritasfuji-japan/veritas_os
          ref: a1d66aef02262cf8a913295270c3aafd159c6adb
          path: _veritas
          persist-credentials: false
      - name: Verify synthetic-only contract
        run: |
          python - <<'PY'
          import json
          p=json.load(open("contracts/CANONICAL_WRAPPER_SYNTHETIC_INTEGRATION_v1.json"))
          assert p["status"]=="DESIGNED_SYNTHETIC_ONLY_REAL_POSTGRES_PROVIDER_DISABLED"
          assert p["prohibited"]["human_authorization_v2_consumption"] is True
          assert p["prohibited"]["provider_credential_access"] is True
          assert p["prohibited"]["provider_api_calls"] is True
          assert p["prohibited"]["final_128_execution"] is True
          PY
      - name: Install exact VERITAS dependencies
        run: python -m pip install --disable-pip-version-check "./_veritas[postgresql,signing]"
      - name: Run synthetic wrapper integration
        run: PYTHONPATH=.:_veritas python scripts/canonical_wrapper_synthetic_integration_v1.py
