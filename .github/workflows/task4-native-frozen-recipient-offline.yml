name: Task4 Native Frozen Recipient Offline NO-GO
on:
  pull_request:
    # Every PR: a hand-maintained dependency/path list can silently miss changes.

permissions:
  contents: read

jobs:
  same-run-local-capped-sdk-aead-native-terminal:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      OPENAI_API_KEY: ''
      TASK4_OPENAI_API_KEY: ''
      ANTHROPIC_API_KEY: ''
      OPENAI_BASE_URL: ''
      VERITAS_DATABASE_URL: ''
      GITHUB_TOKEN: ''
      GH_TOKEN: ''
      TASK4_471_PAID_APPROVAL: ''
      TASK4_CUSTODY_LIVE: ''
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTEST_ADDOPTS: ''
      PYTHONNOUSERSITE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      TASK4_NATIVE_CUSTODY_PROOF: '1'
      TASK4_SEPARATED_SIGNER_PROOF: '1'
      TASK4_FROZEN_SIGNER_SCOPE_PROOF: '1'
      TASK4_FROZEN_RECIPIENT_PROOF: '1'
      TASK4_NATIVE_DATE_PROOF: '1'
      TASK4_TRANSPORT_PROOF: '1'
      TASK4_TRAJECTORY_PROOF: '1'
      TASK4_SCORER_OBSERVATION_PROOF: '1'
      TASK4_RCC_ROOT: '_pins/rcc'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Inventory current source without importing target execution code
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          python -m scripts.task4_native_dependency_ci_audit_v1 --ref HEAD \
            > results/task4-native-current-source-inventory.json
          python -m scripts.execution_authority_route_inventory_v1 --ref HEAD \
            > results/execution-authority-source-candidates.json
      - name: Obtain exact frozen public AgentDojo RCC VERITAS sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _pins results
          git clone https://github.com/ethz-spylab/agentdojo.git _pins/agentdojo
          git -C _pins/agentdojo checkout a75aba7631d3ca5fb7ab938965c97ead2f9ff84b
          git clone https://github.com/effacermonexistence/rcc-revas-veritas-benchmark.git _pins/rcc
          git -C _pins/rcc checkout 1d3782d3aae5ff9c88036709c1a5642320cc53c2
          git clone https://github.com/veritasfuji-japan/veritas_os.git _pins/veritas
          git -C _pins/veritas checkout a1d66aef02262cf8a913295270c3aafd159c6adb
          test "$(git -C _pins/agentdojo rev-parse HEAD)" = 'a75aba7631d3ca5fb7ab938965c97ead2f9ff84b'
          test "$(git -C _pins/rcc rev-parse HEAD)" = '1d3782d3aae5ff9c88036709c1a5642320cc53c2'
          test "$(git -C _pins/veritas rev-parse HEAD)" = 'a1d66aef02262cf8a913295270c3aafd159c6adb'
      - name: Install pinned offline Native SDK and cryptographic dependencies
        shell: bash
        run: |
          set -euo pipefail
          pip install --no-deps -e ./_pins/agentdojo -e ./_pins/veritas
          pip install 'pytest==9.1.1' 'cryptography==50.0.0' 'openai==1.109.1' 'pydantic==2.11.10' 'idna==3.15' 'httpx==0.28.1' 'requests==2.34.2' 'PyYAML==6.0.3'
          python scripts/final_128_v12_locked_agentdojo_requirements_v1.py \
            --lock _pins/agentdojo/uv.lock \
            --output /tmp/task4-native-frozen-recipient-agentdojo-locked.txt
          pip install -r /tmp/task4-native-frozen-recipient-agentdojo-locked.txt
      - name: Verify original SDK capped wires and same-run AEAD before parser
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q -o addopts= tests/test_task4_native_dependency_ci_audit_v1.py \
            tests/test_execution_authority_route_inventory_v1.py
          python -m pytest -q -o addopts= \
            tests/test_task4_native_frozen_recipient_v1.py \
            --junitxml=results/task4-native-frozen-recipient-same-run-native-junit.xml \
            | tee results/task4-native-frozen-recipient-tests.log
          python -m scripts.task4_native_dependency_ci_audit_v1 \
            --junit results/task4-native-frozen-recipient-same-run-native-junit.xml
          python -m scripts.task4_native_frozen_recipient_v1 \
            --output results/task4-native-frozen-recipient-same-run-sanitized.json
          python - <<'PY'
          import json
          r=json.load(open('results/task4-native-frozen-recipient-same-run-sanitized.json'))
          assert r['frozen_recipient_manifest_sha256'] == '18e3d1c2776f029a57012beae669ac25c9bf3c680fc5239b0ee851196bedb93c'
          assert r['frozen_recipient_public_sha256'] == '8f15bcc58f2ddb4f6d5e490191d96b84d1f67b5872f5ec3871afd2e33c3f6aa1'
          assert r['recipient_bound_before_first_consume'] is True
          assert r['recipient_private_key_publicly_reproducible'] is True
          assert r['recipient_confidentiality_for_real_data'] is False
          assert r['random_envelope_ephemeral_key_count'] == 8
          assert r['exact_native_requests_match_frozen_scope'] is True
          assert r['frozen_signer_scope_entries'] == 8
          assert r['frozen_signer_scope_sha256'] == 'ee33c0a2d768ad4c7ceb4699a1abb702f6eb8e2f1ca8e0a64ce6c1867f860309'
          assert r['independently_approved_manifest_proven'] is False
          assert r['recipient_preapproved_independently'] is False
          assert r['parent_holds_synthetic_signing_key'] is False
          assert r['signer_distinct_os_process'] is True
          assert r['signer_clean_shutdown'] is True
          assert r['signer_operation_counts'] == {'consume': 8, 'attach': 8, 'read': 8}
          assert r['synthetic_signatures_verified_in_parent'] == 24
          assert r['cached_original_consume_replays'] == 8
          assert r['independent_issuer_approval_proven'] is False
          assert r['independent_iam_proven'] is False
          assert len(r['frozen_source_git_blobs']) == 9
          assert r['protected_operation_counts'] == {'consume': 8, 'attach': 8, 'read': 8, 'replay_denied': 8}
          assert len(r['protected_broker_startups']) == 2
          assert all(p['observed_protected_binds'] == 1 for p in r['protected_broker_startups'])
          assert r['legacy_entrypoint_attempts_in_parent'] == 0
          assert r['new_native_path_uses_protected_custody'] is True
          assert r['observed_parent_protected_socket_connections'] == 32
          assert r['production_bypass_resistance_proven'] is False
          assert r['same_run_local_capped_sdk_and_preparse_aead_join'] is True
          assert r['capped_sdk_requests'] == 8
          assert r['sdk_output_cap_each'] == 256
          assert r['encrypted_original_scripted_response_count'] == 8
          assert r['local_broker_consume_once_count'] == 8
          assert r['local_broker_restart_replay_denials'] == 8
          assert r['same_run_scripted_native_terminal_arms'] == 2
          assert r['same_run_scripted_native_scorer_invocations'] == 2
          assert len(r['hash_only_same_run_receipts']) == 8
          assert r['independent_real_provider_response_origin_attested'] is False
          assert r['cross_runner_durable_attempt_cas_attested'] is False
          assert r['provider_billed_input_token_cap_attested'] is False
          assert r['genuine_native_utility'] is None
          assert r['real_provider_posts'] == r['external_bank_effects'] == 0
          assert r['score_status'] == 'UNSCORED'
          assert r['real_provider_dispatch'] == 'DENY'
          print('TASK4_SELECTED_NATIVE_PROTECTED_CUSTODY_NO_PROVIDER')
          PY
      - name: Join actual Native SDK bytes to separate-UID Bind Custody and local HTTP
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q -o addopts= tests/test_task4_native_os_custody_v1.py \
            --junitxml=results/task4-native-os-custody-unit-junit.xml
          sudo -n "$(command -v python)" -m scripts.task4_native_os_custody_v1 \
            --run --output results/task4-native-os-custody
          python - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          import xml.etree.ElementTree as ET
          from scripts.task4_native_os_custody_v1 import digest,scope
          folder=Path('results/task4-native-os-custody')
          r=json.loads((folder/'report.json').read_text())
          bindings=json.loads((folder/'bind-records.json').read_text())
          assert r['audited_commit'] == subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert r['source_sha256'] == hashlib.sha256(Path('scripts/task4_native_os_custody_v1.py').read_bytes()).hexdigest()
          assert len(r['checks']) == 22 and all(v is True for v in r['checks'].values())
          assert r['bind_records_sha256'] == digest(bindings) and len(bindings) == 8
          assert r['mock_http_effects'] == r['custody_consumptions'] == 8
          assert r['native']['scorer_calls'] == r['native']['scripted_native_arms'] == 2
          assert r['native']['replay_denials'] == r['restart']['restart_replay_denials'] == 8
          assert r['native']['signature_wire_target_denials'] == 3
          assert len(r['native']['frozen_source_git_blobs']) == 9
          assert digest(r['native']['lineage']) == r['native']['lineage_sha256']
          assert r['native']['lineage']['detached_native_scorer_calls_locally'] == 2
          assert r['native']['lineage']['complete_native_terminals_locally'] == 2
          assert {(x['arm'],x['ordinal']):x['request_sha256'] for x in r['native']['records']} == scope()
          assert len(set(r['uids'].values())) == 4
          assert r['native_has_transport_credential'] is r['native_has_issuer_private_key'] is False
          assert r['real_provider_posts'] == r['external_bank_effects'] == 0
          assert r['utility'] == 'UNSCORED' and r['provider_dispatch'] == 'DENY'
          assert r['production_bypass_resistance_proven'] is r['independent_administration_proven'] is False
          assert r['recipient_private_key_publicly_reproducible'] is True
          assert r['real_data_confidentiality_proven'] is False
          for binding,record in zip(bindings,r['native']['records']):
              assert binding['operation_id'] == record['arm']+str(record['ordinal'])
              assert digest({k:v for k,v in binding.items() if k!='operation_id'}) == record['bind_sha256']
              assert [(x['outcome'],x['apply_calls']) for x in binding['records']] == [('BLOCKED',0),('COMMITTED',1)]
              assert all(digest(x['receipt']) == x['receipt_sha256'] for x in binding['records'])
              assert binding['bind_core_git_blob'] == '0f64201e2599495ce4e3991348aa320995716ffc'
          for lineage,record in zip(r['native']['lineage']['response_receipts'],r['native']['records']):
              assert lineage['original_request_raw_sha256'] == record['request_sha256']
              assert lineage['original_response_raw_sha256'] == record['response_sha256']
          for file,count in [('results/task4-native-os-custody-unit-junit.xml',44),(folder/'junit.xml',22)]:
              t=ET.parse(file).getroot()
              assert len(list(t.iter('testcase'))) == count
              assert not any(list(t.iter(x)) for x in ('skipped','failure','error'))
          print('ACTUAL_NATIVE_SDK_TO_OS_CUSTODY_REAL_BIND_LOCAL_HTTP_SEALED_RESPONSE_JOINED')
          PY
      - name: Verify actual Native request faults and restart without duplicate dispatch
        shell: bash
        run: |
          set -euo pipefail
          for fault in after-consume backend-response-lost after-sealed; do
            sudo -n "$(command -v python)" -m scripts.task4_native_os_custody_v1 \
              --run --fault "$fault" --output "results/task4-native-os-fault-$fault"
          done
          python - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          import xml.etree.ElementTree as ET
          from scripts.task4_native_os_custody_v1 import FAULTS,digest,scope
          states=['CONSUMED_UNKNOWN','MOCK_EFFECT_CONFIRMED_NO_RESPONSE','MOCK_OBSERVED']
          for fault,state in zip(FAULTS,states):
              folder=Path('results/task4-native-os-fault-'+fault)
              r=json.loads((folder/'report.json').read_text())
              assert r['fault'] == fault
              assert r['audited_commit'] == subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
              assert r['source_sha256'] == hashlib.sha256(Path('scripts/task4_native_os_custody_v1.py').read_bytes()).hexdigest()
              assert len(r['checks']) == 21 and all(v is True for v in r['checks'].values())
              assert r['native']['transport_invocations'] == 1
              assert r['native']['observations'][0]['request_sha256'] == scope()[('A',0)]
              assert len(r['native']['frozen_source_git_blobs']) == 9
              assert r['native']['sdk_responses_returned'] == r['native']['native_terminal_arms'] == r['native']['scorer_calls'] == 0
              assert r['custody_consumptions'] == 1 and r['replay_denials'] == 4
              assert r['mock_http_effects'] == int(fault != 'after-consume')
              assert r['ciphertext_count'] == int(fault == 'after-sealed')
              assert r['reconciliation']['state'] == state and r['reconciliation']['post_calls'] == 0
              assert r['before_reconciliation']['effects'] == r['after_reconciliation']['effects']
              assert r['after_reconciliation']['consumed'][0][1] == state
              for row in r['after_reconciliation']['effects']:
                  assert row[3] == digest(dict(operation_id=row[0],request_sha256=row[1],response_sha256=row[2]))
              if r['bind_record']:
                  assert [(x['outcome'],x['apply_calls']) for x in r['bind_record']['records']] == [('BLOCKED',0),('COMMITTED',1)]
                  assert all(digest(x['receipt']) == x['receipt_sha256'] for x in r['bind_record']['records'])
              assert r['real_provider_posts'] == r['external_bank_effects'] == 0
              assert r['provider_dispatch'] == 'DENY' and r['utility'] == 'UNSCORED'
              for claim in ('raw_response_recovery_proven','backend_restart_tested',
                            'cross_process_concurrent_native_consumption_tested',
                            'production_bypass_resistance_proven','independent_administration_proven'):
                  assert r[claim] is False
              junit=ET.parse(folder/'junit.xml').getroot()
              assert len(list(junit.iter('testcase'))) == 21
              assert not any(list(junit.iter(x)) for x in ('skipped','failure','error'))
          print('THREE_ACTUAL_NATIVE_FAULTS_RESTART_REPLAY_AND_AUTHENTICATED_RECONCILIATION_VERIFIED')
          PY
      - name: Restart both Native Custody and backend using retained records only
        shell: bash
        run: |
          set -euo pipefail
          for fault in after-consume backend-response-lost after-sealed; do
            sudo -n "$(command -v python)" -m scripts.task4_native_os_custody_v1 \
              --run --fault "$fault" --restart-both \
              --output "results/task4-native-both-restart-$fault"
          done
          python - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          import xml.etree.ElementTree as ET
          from scripts.task4_native_os_custody_v1 import FAULTS,digest,scope
          for fault,state in zip(FAULTS,['CONSUMED_UNKNOWN','MOCK_EFFECT_CONFIRMED_NO_RESPONSE','MOCK_OBSERVED']):
              folder=Path('results/task4-native-both-restart-'+fault)
              r=json.loads((folder/'report.json').read_text())
              assert r['audited_commit'] == subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
              assert r['source_sha256'] == hashlib.sha256(Path('scripts/task4_native_os_custody_v1.py').read_bytes()).hexdigest()
              assert r['fault'] == fault and r['backend_restart_tested'] is True
              assert len(r['checks']) == 28 and all(v is True for v in r['checks'].values())
              assert r['custody_consumptions'] == 1 and r['replay_denials'] == 6
              assert r['mock_http_effects'] == int(fault != 'after-consume')
              assert r['ciphertext_count'] == int(fault == 'after-sealed')
              assert r['reconciliation']['state'] == state and r['reconciliation']['post_calls'] == 0
              assert r['after_reconciliation']['consumed'][0][1] == state
              assert r['before_reconciliation']['effects'] == r['after_reconciliation']['effects']
              e=r['restart_evidence']
              assert all(e['old_pids'][role] != e['new_pids'][role] for role in ('custody','backend'))
              assert e['retained_rows'] == r['before_reconciliation']
              assert e['backend_restart_receipt_only'] is True
              assert e['unavailable'] == dict(backend_unavailable=True,ledger_unchanged=True,permission_restored=False)
              assert e['backend_replay'] == dict(authentic_replay_denied=True,http_status=403)
              assert e['offline_replay']['replay_denials'] == 2
              assert e['offline_replay']['request_sha256'] == r['native']['observations'][0]['request_sha256'] == scope()[('A',0)]
              assert r['native']['transport_invocations'] == 1 and len(r['native']['frozen_source_git_blobs']) == 9
              assert r['native']['sdk_responses_returned'] == r['native']['native_terminal_arms'] == r['native']['scorer_calls'] == 0
              for row in r['after_reconciliation']['effects']:
                  assert row[3] == digest(dict(operation_id=row[0],request_sha256=row[1],response_sha256=row[2]))
              if r['bind_record']:
                  assert [(x['outcome'],x['apply_calls']) for x in r['bind_record']['records']] == [('BLOCKED',0),('COMMITTED',1)]
                  assert all(digest(x['receipt']) == x['receipt_sha256'] for x in r['bind_record']['records'])
              assert r['real_provider_posts'] == r['external_bank_effects'] == 0
              assert r['provider_dispatch'] == 'DENY' and r['utility'] == 'UNSCORED'
              for claim in ('raw_response_recovery_proven','scripted_backend_continuation_after_restart_proven',
                            'cross_process_concurrent_native_consumption_tested',
                            'production_bypass_resistance_proven','independent_administration_proven'):
                  assert r[claim] is False
              junit=ET.parse(folder/'junit.xml').getroot()
              assert len(list(junit.iter('testcase'))) == 28
              assert not any(list(junit.iter(x)) for x in ('skipped','failure','error'))
          print('BOTH_NATIVE_SERVICES_RESTARTED_RETAINED_RECEIPTS_AND_NO_DUPLICATE_VERIFIED')
          PY
      - name: Contend for the same actual Native request from two Custody processes
        shell: bash
        run: |
          set -euo pipefail
          sudo -n "$(command -v python)" -m scripts.task4_native_os_custody_v1 \
            --run --concurrent --output results/task4-native-concurrent-consumption
          python - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          import xml.etree.ElementTree as ET
          from scripts.task4_native_os_custody_v1 import CUSTODY,digest,scope
          folder=Path('results/task4-native-concurrent-consumption')
          r=json.loads((folder/'report.json').read_text())
          assert r['audited_commit'] == subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert r['source_sha256'] == hashlib.sha256(Path('scripts/task4_native_os_custody_v1.py').read_bytes()).hexdigest()
          assert len(r['checks']) == 23 and all(v is True for v in r['checks'].values())
          assert r['mock_http_effects'] == r['custody_consumptions'] == r['ciphertext_count'] == 1
          assert r['replay_denials'] == 8 and r['before_restart'] == r['after_restart']
          n=r['native'];race=n['race'];binding=r['bind_record']
          assert n['sdk_transport_invocations'] == n['custody_attempts'] == 2
          assert n['distinct_native_requests_forwarded'] == n['sdk_responses_returned'] == 1
          assert n['native_terminal_arms'] == n['scorer_calls'] == 0 and len(n['frozen_source_git_blobs']) == 9
          assert race['request_sha256'] == scope()[('A',0)] and n['next_request_sha256'] == scope()[('A',1)]
          assert sorted(race['decisions']) == ['REPLAY_DENIED','SEALED_NATIVE_RESPONSE']
          assert len(set(r['old_pids'].values())) == len(set(r['new_pids'].values())) == 2
          assert all(r['old_pids'][role] != r['new_pids'][role] for role in ('primary','secondary'))
          for role in ('primary','secondary'):
              assert r['entered'][role]['pid'] == r['released'][role]['pid'] == r['outcomes'][role]['pid'] == r['old_pids'][role]
              assert r['entered'][role]['uid'] == CUSTODY and r['entered'][role]['consumptions_before'] == 0
              assert r['entered'][role]['request_sha256'] == race['request_sha256']
          assert max(x['entered_ns'] for x in r['entered'].values()) <= min(x['released_ns'] for x in r['released'].values())
          assert sorted(x['decision'] for x in r['outcomes'].values()) == ['CONSUMED','REPLAY_DENIED']
          assert r['outcomes'][race['winner_role']]['decision'] == 'CONSUMED'
          assert digest(binding) == race['bind_sha256']
          assert [(x['outcome'],x['apply_calls']) for x in binding['records']] == [('BLOCKED',0),('COMMITTED',1)]
          assert all(digest(x['receipt']) == x['receipt_sha256'] for x in binding['records'])
          assert r['after_restart']['consumed'] == [['A0','MOCK_OBSERVED',race['request_sha256'],race['response_sha256'],race['backend_receipt_sha256'],race['envelope_sha256'],race['bind_sha256']]]
          assert r['after_restart']['effects'] == [['A0',race['request_sha256'],race['response_sha256'],race['backend_receipt_sha256']]]
          assert race['backend_receipt_sha256'] == digest(dict(operation_id='A0',request_sha256=race['request_sha256'],response_sha256=race['response_sha256']))
          assert r['cross_process_concurrent_native_consumption_tested'] is True
          assert r['concurrent_winner_crash_tested'] is r['distributed_cas_proven'] is False
          assert r['real_provider_posts'] == r['external_bank_effects'] == 0
          assert r['utility'] == 'UNSCORED' and r['provider_dispatch'] == 'DENY'
          assert r['production_bypass_resistance_proven'] is r['independent_administration_proven'] is False
          junit=ET.parse(folder/'junit.xml').getroot()
          assert len(list(junit.iter('testcase'))) == 23
          assert not any(list(junit.iter(x)) for x in ('skipped','failure','error'))
          print('TWO_ACTUAL_NATIVE_CUSTODIES_ONE_CONSUMPTION_EFFECT_RESPONSE_AND_RESTART_REPLAY_VERIFIED')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: task4-native-frozen-recipient-same-local-native-capped-sdk-aead-junit-hashes
          path: results/
          if-no-files-found: error
