name: Final128 347 Task1 Real Model Paired AB Preflight Default Deny V1

on:
  pull_request:
    paths:
      - ".github/workflows/final128-347-task1-real-model-ab-preflight-default-deny-v1.yml"
      - "contracts/FINAL128_347_TASK1_PAIRED_REAL_MODEL_PREFLIGHT_DEFAULT_DENY_V1.json"
      - "scripts/final128_347_task1_real_model_ab_preflight_v1.py"
      - "tests/test_final128_347_task1_real_model_ab_preflight_v1.py"
      - "docs/optimization/FINAL128_347_TASK1_REAL_MODEL_AB_PREFLIGHT_DEFAULT_DENY_V1.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-task1-paired-real-model-preflight-default-deny:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      OPENAI_API_KEY: ""
      TASK4_OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      OPENAI_BASE_URL: ""
      VERITAS_DATABASE_URL: ""
      GH_TOKEN: ""
      GITHUB_TOKEN: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
      - name: Confirm offline-only and record head
        run: |
          set -euo pipefail
          for secret in OPENAI_API_KEY TASK4_OPENAI_API_KEY ANTHROPIC_API_KEY OPENAI_BASE_URL VERITAS_DATABASE_URL GH_TOKEN GITHUB_TOKEN; do
            test -z "$(printenv "$secret" || true)"
          done
          mkdir -p results
          git rev-parse HEAD > results/final128-347-head.txt
          echo "FINAL128_347_NO_PROVIDER_CREDENTIALS_OR_SENDERS"
      - name: Install local test framework
        run: python -m pip install --disable-pip-version-check "pytest==9.1.1"
      - name: Verify exact one-case AB protocol and demonstrate no authority
        env:
          PYTHONPATH: "."
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q -o addopts= tests/test_final128_347_task1_real_model_ab_preflight_v1.py \
            --junitxml=results/final128-347-junit.xml | tee results/final128-347-tests.log
          python scripts/final128_347_task1_real_model_ab_preflight_v1.py \
            --output results/final128-347-task1-real-model-paired-ab-preflight-default-deny.json \
            | tee results/final128-347-report.log
          if python scripts/final128_347_task1_real_model_ab_preflight_v1.py \
            --live --output results/final128-347-fake-live-output.json \
            >results/final128-347-negative-live.log 2>&1; then
            echo "ERROR: LIVE_PROVIDER_GATE_ALLOW_BY_DEFAULT" >&2
            exit 1
          fi
          test ! -e results/final128-347-fake-live-output.json
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path("results/final128-347-task1-real-model-paired-ab-preflight-default-deny.json")
          r=json.loads(p.read_text())
          recorded=r.pop("report_sha256")
          expected=hashlib.sha256(json.dumps(r,sort_keys=True,separators=(",",":"),ensure_ascii=False,allow_nan=False).encode("utf-8")).hexdigest()
          assert recorded==expected
          assert len(r["future_pair_intents"])==2
          assert len(r["unmet_external_gates"])==12
          assert r["live_dispatch_decision"]=="DENY_NOT_APPROVED"
          assert r["future_scoring_preflight"]["status"]=="INCOMPLETE_UNSCORED"
          assert r["approved_cost_cap_usd"]=="0.00"
          assert r["proposed_cost_cap_usd_not_approved"]=="1.00"
          assert r["actual_provider_calls"]==0
          assert r["new_official_utility_scores"]==0
          assert r["new_operator_approval_required"] is True
          print("FINAL128_347_TASK1_AB_FRESH_OPERATOR_APPROVAL_AND_PROVIDER_SENDER_ABSENT")
          PY
          sha256sum \
            contracts/FINAL128_347_TASK1_PAIRED_REAL_MODEL_PREFLIGHT_DEFAULT_DENY_V1.json \
            scripts/final128_347_task1_real_model_ab_preflight_v1.py \
            tests/test_final128_347_task1_real_model_ab_preflight_v1.py \
            docs/optimization/FINAL128_347_TASK1_REAL_MODEL_AB_PREFLIGHT_DEFAULT_DENY_V1.md \
            results/final128-347-task1-real-model-paired-ab-preflight-default-deny.json \
            > results/final128-347-sha256.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: final128-347-task1-paired-real-model-preflight-default-deny
          path: results/final128-347-*
          if-no-files-found: warn
