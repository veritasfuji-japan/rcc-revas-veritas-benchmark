name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - run: python -m pip install pytest "cryptography==50.0.0"
      - run: python -m py_compile run_joint_benchmark.py tests/test_runner.py
      - run: python run_joint_benchmark.py --self-check
      - run: python -m pytest -q --ignore=tests/test_current_bind_action_capability_compatibility_v1.py
