name: Ben Synthetic Sink Negative Controls Offline
on:
  pull_request:
permissions:
  contents: read
jobs:
  offline-signed-mock-sink:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      OPENAI_API_KEY: ''
      TASK4_OPENAI_API_KEY: ''
      TASK1_OPENAI_API_KEY: ''
      ANTHROPIC_API_KEY: ''
      OPENAI_BASE_URL: ''
      GITHUB_TOKEN: ''
      GH_TOKEN: ''
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Execute isolated offline negative tests
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha }}'
          python -m pip install 'pytest==9.1.1' 'cryptography==50.0.0'
          python -m pytest -q -o addopts= tests/test_ben_synthetic_sink_negatives_v1.py
