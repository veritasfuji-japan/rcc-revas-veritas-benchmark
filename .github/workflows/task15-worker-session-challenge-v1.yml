name: Task15 Worker Session Challenge V1
on:
  pull_request:
    paths:
      - ".github/workflows/task15-worker-session-challenge-v1.yml"
      - "scripts/task15_session_challenge_broker_server_v1.py"
      - "scripts/task15_session_challenge_worker_v1.py"
      - "scripts/task15_worker_session_challenge_audit_v1.py"
      - "docker/task15_session_challenge_broker_v1.Dockerfile"
      - "tests/test_task15_worker_session_challenge_v1.py"
      - "contracts/TASK15_WORKER_SESSION_CHALLENGE_V1.json"
      - "docs/TASK15_WORKER_SESSION_CHALLENGE_V1.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/task15-worker-session-challenge-v1.yml"
      - "scripts/task15_session_challenge_broker_server_v1.py"
      - "scripts/task15_session_challenge_worker_v1.py"
      - "scripts/task15_worker_session_challenge_audit_v1.py"
      - "docker/task15_session_challenge_broker_v1.Dockerfile"
      - "tests/test_task15_worker_session_challenge_v1.py"
      - "contracts/TASK15_WORKER_SESSION_CHALLENGE_V1.json"
      - "docs/TASK15_WORKER_SESSION_CHALLENGE_V1.md"
permissions:
  contents: read
jobs:
  session-challenge-mock-only-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OPENAI_API_KEY: ""
      OPENAI_BASE_URL: ""
      ANTHROPIC_API_KEY: ""
      AWS_SECRET_ACCESS_KEY: ""
      GH_TOKEN: ""
      GITHUB_TOKEN: ""
      TASK15_WORKER_SESSION_PROOF: "1"
      PYTHONPATH: "."
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
      - name: Install pinned offline cryptographic test dependency
        run: python -m pip install "cryptography==50.0.0"
      - name: Verify 12 HMAC fresh challenge and private secret negative cases
        run: python -m unittest discover -s tests -p 'test_task15_worker_session_challenge_v1.py' -v
      - name: Run same-UID three-container synthetic session-key proof
        run: |
          set -euo pipefail
          mkdir -p results
          python scripts/task15_worker_session_challenge_audit_v1.py --output-dir results | tee results.log
      - name: Upload raw inspect JUnit signatures and SQLite proof artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: task15-worker-session-challenge-v1
          path: |
            results/*
            results.log
          if-no-files-found: warn
