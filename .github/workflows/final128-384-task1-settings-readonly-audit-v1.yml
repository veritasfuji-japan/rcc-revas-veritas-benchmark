name: Final128 384 Task1 Live Readonly Settings Coverage Audit
on:
  pull_request:
    paths:
      - ".github/workflows/final128-384-task1-settings-readonly-audit-v1.yml"
      - "scripts/final128_384_task1_live_readonly_settings_audit_v1.py"
      - "tests/test_final128_384_task1_live_readonly_settings_audit_v1.py"
      - "docs/optimization/FINAL128_384_LIVE_READONLY_GITHUB_SETTINGS_COVERAGE_GAP_V1.md"
      - "scripts/final128_383_task1_global_once_issuer_gate_offline_v1.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/final128-384-task1-settings-readonly-audit-v1.yml"
      - "scripts/final128_384_task1_live_readonly_settings_audit_v1.py"
      - "tests/test_final128_384_task1_live_readonly_settings_audit_v1.py"
      - "docs/optimization/FINAL128_384_LIVE_READONLY_GITHUB_SETTINGS_COVERAGE_GAP_V1.md"
permissions:
  contents: read
jobs:
  task1-readonly-settings-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      FINAL128_381_AGENTDOJO_ROOT: "_pins/agentdojo"
      FINAL128_380_AGENTDOJO_ROOT: "_pins/agentdojo"
      FINAL128_379_AGENTDOJO_ROOT: "_pins/agentdojo"
      FINAL128_378_AGENTDOJO_ROOT: "_pins/agentdojo"
      FINAL128_377_AGENTDOJO_ROOT: "_pins/agentdojo"
      OPENAI_API_KEY: ""
      TASK4_OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      OPENAI_BASE_URL: ""
      GITHUB_TOKEN: ""
      GH_TOKEN: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ethz-spylab/agentdojo
          ref: a75aba7631d3ca5fb7ab938965c97ead2f9ff84b
          path: _pins/agentdojo
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
      - name: Check exact HEAD, frozen Native source, empty Provider credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git -C _pins/agentdojo rev-parse HEAD)" = "a75aba7631d3ca5fb7ab938965c97ead2f9ff84b"
          test "$(git -C _pins/agentdojo hash-object src/agentdojo/default_suites/v1/tools/banking_client.py)" = "941c27467b7890cced7ab70e5fd5ca32241f99a5"
          for secret in OPENAI_API_KEY TASK4_OPENAI_API_KEY ANTHROPIC_API_KEY OPENAI_BASE_URL GITHUB_TOKEN GH_TOKEN; do
            test -z "$(printenv "$secret" || true)"
          done
          python -m py_compile \
            scripts/final128_384_task1_live_readonly_settings_audit_v1.py \
            scripts/final128_383_task1_global_once_issuer_gate_offline_v1.py \
            tests/test_final128_384_task1_live_readonly_settings_audit_v1.py
          mkdir -p results
          git rev-parse HEAD > results/final128-384-exact-head.txt
      - name: Install pinned Native AgentDojo and pytest
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check "pytest==9.1.1"
          python -m pip install --disable-pip-version-check -e _pins/agentdojo
      - name: Offline mismatch regression + Native chain tests, zero skipped
        env:
          PYTHONPATH: "."
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q -o addopts= \
            tests/test_final128_384_task1_live_readonly_settings_audit_v1.py \
            tests/test_final128_383_task1_global_once_issuer_gate_offline_v1.py \
            tests/test_final128_382_first_two_responses_once_transport_v1.py \
            tests/test_final128_381_task1_real_responses_capture_contract_v1.py \
            tests/test_final128_380_mock_call_id_native_continuity_v1.py \
            tests/test_final128_379_task1_native_mock_provider_bridge_v1.py \
            tests/test_final128_378_native_paired_model_input_seam_v1.py \
            tests/test_final128_377_native_preterminal_spending_projection_v1.py \
            tests/test_final128_350_task1_responses_once_budget_v1.py \
            tests/test_final128_351_task1_durable_lease_preflight_v1.py \
            --junitxml=results/final128-384-junit.xml \
            | tee results/final128-384-tests.log
      - name: GET only actual public GitHub ruleset/ref details (UNATTESTED)
        env:
          PYTHONPATH: "."
        shell: bash
        run: |
          set -euo pipefail
          python scripts/final128_384_task1_live_readonly_settings_audit_v1.py \
            --observe \
            --output results/final128-384-live-github-settings-readonly-observation.json
      - name: Validate zero-send denial, JUnit, SHA-only artifacts
        shell: bash
        env:
          PYTHONPATH: "."
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,xml.etree.ElementTree as ET
          from pathlib import Path
          from scripts.final128_384_task1_live_readonly_settings_audit_v1 import FIXED_REF
          root=ET.parse("results/final128-384-junit.xml").getroot()
          suites=[root] if root.tag=="testsuite" else list(root.findall("testsuite"))
          assert suites
          counts={k:sum(int(s.attrib.get(k,"0")) for s in suites)
                  for k in ("tests","failures","errors","skipped")}
          assert counts["tests"]>=275
          assert all(counts[x]==0 for x in ("failures","errors","skipped"))
          got=json.loads(Path("results/final128-384-live-github-settings-readonly-observation.json").read_text())
          assert got["fixed_protocol_ref"]==FIXED_REF
          assert got["status"]=="LIVE_DISPATCH_DENIED_EXTERNAL_CONTROLS_UNVERIFIED"
          assert got["live_dispatch_permitted"] is False
          assert got["production_bypass_resistance_proven"] is False
          assert got["real_issuer_tag_mutation_performed"] is False
          assert got["real_provider_posts"]==0
          assert got["new_measured_utility"] is None
          assert got["environment_protection_verified"] is False
          assert got["provider_project_spending_controls_verified"] is False
          assert got["observation_source"]=="public_github_get_unattested"
          assert got["rule_coverage_result"] in (
            "MISSING_MATCHING_DEFENSIVE_RULE",
            "MATCHING_DEFENSIVE_RULE_OBSERVED_NOT_AUTHORITY",
            "UNKNOWN_INCOMPLETE_OR_FORBIDDEN")
          head=Path("results/final128-384-exact-head.txt").read_text().strip()
          manifest={
              "schema":"veritas.final128.task1-384-readonly-settings-evidence.v1",
              "exact_head":head,
              "agentdojo_sha":"a75aba7631d3ca5fb7ab938965c97ead2f9ff84b",
              "test_counts":counts,
              "actual_readonly_rest_observation_sha256":hashlib.sha256(
                Path("results/final128-384-live-github-settings-readonly-observation.json").read_bytes()).hexdigest(),
              "actual_observation_source_unattested":True,
              "read_only_result":got["rule_coverage_result"],
              "fixed_tag_ref_status":got["fixed_tag_ref_status"],
              "actual_github_tag_created":False,
              "actual_provider_requests":0,
              "actual_provider_spend_usd":"0.00",
              "native_scorer_invocations":0,
              "official_utility_delta":None,
              "ready_for_paid_dispatch":False,
              "environment_actions_billing_verified":False,
          }
          encoded=lambda x:json.dumps(x,sort_keys=True,separators=(",",":"),allow_nan=False).encode()
          manifest["self_sha256"]=hashlib.sha256(encoded(manifest)).hexdigest()
          Path("results/final128-384-redacted-evidence-manifest.json").write_text(
             json.dumps(manifest,sort_keys=True,indent=2)+"\n")
          print("FINAL128_384_READONLY_ACTUAL_SETTINGS_OR_UNKNOWN_NO_LIVE_PROVIDER_NO_SCORE")
          print("RULE_COVERAGE="+got["rule_coverage_result"])
          PY
          sha256sum \
            scripts/final128_384_task1_live_readonly_settings_audit_v1.py \
            tests/test_final128_384_task1_live_readonly_settings_audit_v1.py \
            docs/optimization/FINAL128_384_LIVE_READONLY_GITHUB_SETTINGS_COVERAGE_GAP_V1.md \
            results/final128-384-live-github-settings-readonly-observation.json \
            results/final128-384-redacted-evidence-manifest.json \
            results/final128-384-junit.xml \
            > results/final128-384-file-evidence-sha256.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: final128-384-live-readonly-tag-ruleset-audit-no-live
          path: results/final128-384-*
          if-no-files-found: warn
