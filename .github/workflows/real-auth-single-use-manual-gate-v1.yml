name: Real Auth Single-Use Manual Gate V1
on:
  workflow_dispatch:
    inputs:
      runner_commit:
        description: Exact merged-main commit to consume against
        required: true
        type: string
      confirmation:
        description: Type CONSUME_REAL_AUTH_V2_ONCE
        required: true
        type: string
permissions:
  contents: read
jobs:
  consume-real-auth-once:
    if: ${{ inputs.confirmation == 'CONSUME_REAL_AUTH_V2_ONCE' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VERITAS_DATABASE_URL: ${{ secrets.VERITAS_ATOMIC_CONSUMPTION_DATABASE_URL }}
      VERITAS_DB_POOL_MIN_SIZE: "1"
      VERITAS_DB_POOL_MAX_SIZE: "5"
      VERITAS_DB_CONNECT_TIMEOUT: "10"
    steps:
      - name: Checkout exact requested main
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.runner_commit }}
          persist-credentials: false
      - name: Verify exact checkout and manual-gate contract
        env:
          EXPECTED_COMMIT: ${{ inputs.runner_commit }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          python - <<'PY'
          import json
          p=json.load(open("contracts/AGENTDOJO_REAL_AUTH_SINGLE_USE_MANUAL_GATE_v1.json"))
          assert p["authorization_id"]=="AGENTDOJO_CANONICAL_FINAL_128_SINGLE_USE_V2"
          assert p["provider_secret_available_to_job"] is False
          assert p["final_128_execution_available"] is False
          assert p["automatic_execution"] is False
          assert p["rerun_authorized"] is False
          PY
      - uses: actions/setup-python@v5
        with: {python-version: "3.11.16"}
      - name: Checkout exact VERITAS
        uses: actions/checkout@v4
        with:
          repository: veritasfuji-japan/veritas_os
          ref: a1d66aef02262cf8a913295270c3aafd159c6adb
          path: _veritas
          persist-credentials: false
      - name: Install atomic-consumption dependencies
        run: python -m pip install --disable-pip-version-check "./_veritas[postgresql,signing]"
      - name: Consume exact real authorization once
        run: PYTHONPATH=.:_veritas python scripts/real_auth_atomic_consume_v1.py --consume --confirmation CONSUME_REAL_AUTH_V2_ONCE
