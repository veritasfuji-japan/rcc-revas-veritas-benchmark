name: Task15 Worker Credential Egress Isolation V1
on:
  pull_request:
    paths:
      - ".github/workflows/task15-worker-credential-egress-isolation-v1.yml"
      - "scripts/task15_isolated_worker_probe_v1.py"
      - "scripts/task15_worker_credential_egress_isolation_audit_v1.py"
      - "tests/test_task15_worker_credential_egress_isolation_v1.py"
      - "contracts/TASK15_WORKER_CREDENTIAL_EGRESS_ISOLATION_V1.json"
      - "docs/TASK15_WORKER_CREDENTIAL_EGRESS_ISOLATION_V1.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/task15-worker-credential-egress-isolation-v1.yml"
      - "scripts/task15_isolated_worker_probe_v1.py"
      - "scripts/task15_worker_credential_egress_isolation_audit_v1.py"
      - "tests/test_task15_worker_credential_egress_isolation_v1.py"
      - "contracts/TASK15_WORKER_CREDENTIAL_EGRESS_ISOLATION_V1.json"
      - "docs/TASK15_WORKER_CREDENTIAL_EGRESS_ISOLATION_V1.md"
permissions:
  contents: read
jobs:
  isolated-worker-negative-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OPENAI_API_KEY: ""
      OPENAI_BASE_URL: ""
      ANTHROPIC_API_KEY: ""
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
      - name: Reject tampered container specifications without Docker
        run: python -m unittest discover -s tests -p 'test_task15_worker_credential_egress_isolation_v1.py' -v
      - name: Enforce Docker isolation and archive negative execution evidence
        run: |
          set -euo pipefail
          python scripts/task15_worker_credential_egress_isolation_audit_v1.py --output-dir results
      - name: Upload independent-review evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: task15-worker-credential-egress-isolation-v1
          path: |
            results/*
          if-no-files-found: warn
