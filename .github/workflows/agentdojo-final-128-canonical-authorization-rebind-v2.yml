name: AgentDojo Final 128 Canonical Authorization Rebind V2
on:
  pull_request:
    paths:
      - "contracts/AGENTDOJO_FINAL_128_CANONICAL_AUTHORIZATION_REBIND_v2.json"
      - ".github/workflows/agentdojo-final-128-canonical-authorization-rebind-v2.yml"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    env:
      OPENAI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify canonical target and closed gate
        run: |
          python - <<'PY'
          import json, os, subprocess
          c=json.load(open("contracts/AGENTDOJO_FINAL_128_CANONICAL_AUTHORIZATION_REBIND_v2.json"))
          i=json.load(open("contracts/AGENTDOJO_CANONICAL_FINAL_RUNNER_IMPLEMENTATION_v1.json"))
          old=json.load(open("contracts/AGENTDOJO_FINAL_128_HUMAN_AUTHORIZATION_ISSUANCE_v1.json"))
          t=c["execution_target"]; a=c["authorization_state"]
          assert os.environ.get("OPENAI_API_KEY","")==""
          assert c["base_main_sha"]=="610b2ec0960e70c75cde3a3c2501849768647d63"
          blob=subprocess.check_output(["git","rev-parse","HEAD:scripts/agentdojo_clean_ab_canonical_final_runner_v1.py"],text=True).strip()
          assert blob==t["runner_git_blob_sha"]=="d1e5d7bfda41d7dcd9ee7e16a5b0e8dbba5cb89c"
          assert t["veritas_commit"]==i["pins"]["veritas_commit"]=="a1d66aef02262cf8a913295270c3aafd159c6adb"
          assert t["runner"]==i["runner"]["source"]
          assert t["workflow"]==i["runner"]["workflow"]
          assert i["execution_gate"]=="CLOSED"
          assert i["final_128_authorized"] is False
          assert i["provider_execution_authorized"] is False
          assert c["superseded_target_usable_for_dispatch"] is False
          assert old["execution_target"]["runner"]=="scripts/agentdojo_clean_ab_final_runner_v0_1.py"
          assert a["target_rebound"] is True
          assert a["human_execution_approval_reissued"] is False
          assert a["issued"] is False and a["consumed"] is False
          assert a["dispatch_performed"] is False
          assert a["provider_api_called_by_this_pr"] is False
          assert a["automatic_dispatch"] is False and a["rerun_authorized"] is False
          assert c["execution_gate"]=="CLOSED"
          assert c["provider_execution_authorized"] is False
          assert c["candidate_disposition"]["promote_tasks"]==[2,13,15]
          assert c["candidate_disposition"]["keep_fail_closed_tasks"]==[11,12,14]
          print("FINAL_128_CANONICAL_AUTHORIZATION_REBIND_V2_AUDIT_PASS")
          PY
