name: AgentDojo Model Execution Decision v0.1
on:
  pull_request:
    paths:
      - "contracts/AGENTDOJO_MODEL_EXECUTION_DECISION_v0.1.json"
      - "scripts/verify_agentdojo_model_execution_decision_v0_1.py"
      - ".github/workflows/agentdojo-model-execution-decision-v0_1.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env: {AGENTDOJO_REPO: agentdojo_checkout}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: ethz-spylab/agentdojo
          ref: a75aba7631d3ca5fb7ab938965c97ead2f9ff84b
          path: agentdojo_checkout
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: "3.11.16"}
      - run: python scripts/verify_agentdojo_model_execution_decision_v0_1.py
      - uses: actions/upload-artifact@v4
        with:
          name: agentdojo-model-execution-decision-v0_1
          path: |
            contracts/AGENTDOJO_MODEL_EXECUTION_DECISION_v0.1.json
            agentdojo-model-execution-decision-v0_1-audit.json
          retention-days: 90
