name: AgentDojo Exact Model Configuration v0.1
on:
  pull_request:
    paths:
      - "contracts/AGENTDOJO_EXACT_MODEL_CONFIGURATION_v0.1.json"
      - "scripts/verify_agentdojo_exact_model_configuration_v0_1.py"
      - ".github/workflows/agentdojo-exact-model-configuration-v0_1.yml"
      - "docs/AGENTDOJO_EXACT_MODEL_CONFIGURATION_v0.1.md"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  freeze-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11.16"}
      - run: python scripts/verify_agentdojo_exact_model_configuration_v0_1.py
      - name: Assert definition-only freeze
        run: |
          python - <<'PY'
          import json
          c=json.load(open("contracts/AGENTDOJO_EXACT_MODEL_CONFIGURATION_v0.1.json"))
          assert c["execution_gate"]=="CLOSED"
          assert c["claim_boundary"]["model_api_called_by_this_freeze"] is False
          assert c["claim_boundary"]["clean_ab_executed"] is False
          PY
