name: Final 128 V5 Authorization Issuance Audit
on:
  pull_request:
    paths:
      - "contracts/AGENTDOJO_FINAL_128_EXECUTION_AUTHORIZATION_v5.json"
      - ".github/workflows/final-128-v5-authorization-issuance-audit.yml"
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify issued but non-dispatchable V5
        shell: python
        run: |
          import json,subprocess
          from pathlib import Path
          a=json.loads(Path("contracts/AGENTDOJO_FINAL_128_EXECUTION_AUTHORIZATION_v5.json").read_text())
          assert a["authorization"]["id"]=="AGENTDOJO_CANONICAL_FINAL_128_EXECUTION_V5"
          assert a["authorization"]["issued"] is True
          assert a["authorization"]["single_use"] is True
          assert a["authorization"]["consumed"] is False
          assert a["authorization"]["rerun_authorized"] is False
          t=a["frozen_target"]
          for path,key in [(t["wrapper_path"],"wrapper_git_blob_sha"),(t["runner_path"],"runner_git_blob_sha"),(t["workflow_path"],"workflow_git_blob_sha")]:
              assert subprocess.check_output(["git","hash-object",path],text=True).strip()==t[key]
          assert a["cost_boundary"]["maximum_usd"]==5
          assert a["cost_boundary"]["cost_confirmation_received"] is False
          d=a["dispatch"]
          assert all(d[k] is False for k in ("provider_dispatch_authorized","manual_dispatch_authorized","provider_credential_access","provider_api_called","final_128_executed"))
          print("PASS_FINAL_128_V5_AUTHORIZATION_ISSUANCE")
