name: Final 128 V10 Pre-Implementation Regression Gates
on:
  pull_request:
    paths:
      - "contracts/AGENTDOJO_FINAL_128_V10_REGRESSION_GATES_v1.json"
      - "scripts/final_128_v10_regression_gates_audit_v1.py"
      - ".github/workflows/final-128-v10-regression-gates.yml"
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11.16"}
      - run: python scripts/final_128_v10_regression_gates_audit_v1.py
