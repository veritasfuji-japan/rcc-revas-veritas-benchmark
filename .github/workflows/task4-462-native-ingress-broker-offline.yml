name: Task4 462 Ingress to Broker AEAD Native (No Provider)
on:
  pull_request:
    paths:
      - 'scripts/task4_462_ingress_broker_native_offline_v1.py'
      - 'tests/test_task4_462_ingress_broker_native_offline_v1.py'
      - 'docs/TASK4_462_INGRESS_BROKER_NATIVE_NO_GO_V1.md'
      - '.github/workflows/task4-462-native-ingress-broker-offline.yml'
permissions:
  contents: read
  actions: read
jobs:
  capped-sdk-original-response-ingress-to-local-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OPENAI_API_KEY: ''
      TASK4_OPENAI_API_KEY: ''
      ANTHROPIC_API_KEY: ''
      OPENAI_BASE_URL: ''
      VERITAS_DATABASE_URL: ''
      TASK4_462_PAID_APPROVAL: ''
      TASK4_461_PAID_APPROVAL: ''
      TASK4_455_LIVE_APPROVAL: ''
      TASK4_323_APPROVAL_PHRASE: ''
      GITHUB_TOKEN: ''
      GH_TOKEN: ''
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTEST_ADDOPTS: ''
      PYTHONNOUSERSITE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      TASK4_462_NATIVE_PROOF: '1'
      TASK4_RCC_ROOT: '_pins/rcc'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Read-only verification of the consumed historical Provider grant
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/task4-third-two-real-provider-v1-consumed" --jq '.object.sha')" = "95ff6be8c5875ed3827a00fe71fb54bd9de48130"
      - name: Clone and verify exact public frozen inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _pins results
          git clone https://github.com/ethz-spylab/agentdojo.git _pins/agentdojo
          git -C _pins/agentdojo checkout a75aba7631d3ca5fb7ab938965c97ead2f9ff84b
          git clone https://github.com/effacermonexistence/rcc-revas-veritas-benchmark.git _pins/rcc
          git -C _pins/rcc checkout 1d3782d3aae5ff9c88036709c1a5642320cc53c2
          git clone https://github.com/veritasfuji-japan/veritas_os.git _pins/veritas
          git -C _pins/veritas checkout a1d66aef02262cf8a913295270c3aafd159c6adb
          test "$(git -C _pins/agentdojo rev-parse HEAD)" = "a75aba7631d3ca5fb7ab938965c97ead2f9ff84b"
          test "$(git -C _pins/rcc rev-parse HEAD)" = "1d3782d3aae5ff9c88036709c1a5642320cc53c2"
          test "$(git -C _pins/veritas rev-parse HEAD)" = "a1d66aef02262cf8a913295270c3aafd159c6adb"
      - name: Install frozen local SDK and pinned Native test dependencies
        shell: bash
        run: |
          set -euo pipefail
          pip install --no-deps -e ./_pins/agentdojo -e ./_pins/veritas
          pip install 'pytest==9.1.1' 'cryptography==50.0.0' 'openai==1.109.1' 'pydantic==2.11.10' 'idna==3.15' 'httpx==0.28.1' 'requests==2.34.2' 'PyYAML==6.0.3'
          python scripts/final_128_v12_locked_agentdojo_requirements_v1.py \
            --lock _pins/agentdojo/uv.lock \
            --output /tmp/task4-462-agentdojo-locked.txt
          pip install -r /tmp/task4-462-agentdojo-locked.txt
      - name: Verify both original Native SDK arms through Ingress Broker AEAD and Scorer
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q -o addopts= \
            tests/test_task4_462_ingress_broker_native_offline_v1.py \
            --junitxml=results/task4-462-ingress-broker-native-junit.xml \
            | tee results/task4-462-pytest.txt
          python -m scripts.task4_462_ingress_broker_native_offline_v1 \
            --output results/task4-462-native-ingress-broker-hash-only.json
          python - <<'PY'
          import json
          r=json.load(open('results/task4-462-native-ingress-broker-hash-only.json'))
          for key in ('sdk_original_capped_requests',
                      'original_response_objects_preserved_after_ingress',
                      'local_aead_broker_attach_before_sdk_parser',
                      'broker_ciphertexts_recovered_after_restart'):
              assert r[key] == 8
          assert r['local_native_terminals'] == 2
          assert r['local_native_scorer_calls'] == 2
          assert r['real_provider_posts'] == 0
          assert r['real_provider_dispatch'] == 'DENY'
          assert r['score_status'] == 'UNSCORED'
          assert r['true_utility'] is r['true_injection'] is None
          assert r['external_provider_origin_authenticated'] is False
          assert r['remote_atomic_ledger_proven'] is False
          assert len(r['capped_sdk_vs_mock_uncapped_receipt_pairs']) == 8
          print('TASK4_462_EIGHT_REAL_SDK_SERIALIZED_LOCAL_MOCK_ORIGINS_NO_PROVIDER')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: task4-462-native-ingress-broker-hash-only-no-provider
          path: results/*
          if-no-files-found: warn