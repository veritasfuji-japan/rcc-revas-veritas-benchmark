name: Independent External Replication Handoff V1
on:
  pull_request:
    paths:
      - "contracts/AGENTDOJO_FINAL_128_INDEPENDENT_EXTERNAL_REPLICATION_HANDOFF_v1.json"
      - "docs/AGENTDOJO_FINAL_128_INDEPENDENT_EXTERNAL_REPLICATION_HANDOFF_V1.md"
      - "scripts/final_128_independent_external_replication_handoff_audit_v1.py"
      - ".github/workflows/independent-external-replication-handoff-v1.yml"
permissions:
  contents: read
  actions: read
jobs:
  handoff:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ""
      VERITAS_DATABASE_URL: ""
      GH_TOKEN: ${{ github.token }}
      V13_ARTIFACT_ZIP: /tmp/agentdojo-clean-ab-final-v13-37585673492.zip
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.11.16"}

      - name: Verify exact handoff source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object contracts/AGENTDOJO_FINAL_128_INDEPENDENT_EXTERNAL_REPLICATION_HANDOFF_v1.json)" = "c466f9e4ed347c914b9193879e6a2e494dbdc61b"
          test "$(git hash-object docs/AGENTDOJO_FINAL_128_INDEPENDENT_EXTERNAL_REPLICATION_HANDOFF_V1.md)" = "bd9843bfe2c5c29613f8b802e65e3f712e7e8b9f"
          test "$(git hash-object contracts/AGENTDOJO_FINAL_128_V13_TERMINAL_DISPOSITION_v1.json)" = "2f2a5dd1a91d4068776e39a064f167cd304767b2"
          test "$(git hash-object contracts/AGENTDOJO_FINAL_128_V13_POST_EXECUTION_ANALYSIS_BOUNDARY_v1.json)" = "6b78872b42ffae12ccd54b1802146b8a96a76469"
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/37585673492 --jq '.head_sha')" = "2454ba69818d1a46b910f33fab9b57017cd7a83e"
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/37585673492 --jq '.conclusion')" = "success"
          echo PASS_HANDOFF_SOURCE_PIN

      - name: Download exact V13 result artifact
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/$GITHUB_REPOSITORY/actions/artifacts/11466539107/zip > "$V13_ARTIFACT_ZIP"
          test "$(sha256sum "$V13_ARTIFACT_ZIP" | awk '{print $1}')" = "9fbb2a1614c237e92c4239bb5d60f83d40d33b81e0092d3f82958931969c9e7a"
          echo PASS_HANDOFF_EXACT_ARTIFACT_DOWNLOAD

      - name: Audit independent external replication handoff
        run: python scripts/final_128_independent_external_replication_handoff_audit_v1.py
