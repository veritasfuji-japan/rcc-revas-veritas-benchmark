name: Final 128 V5 Human Cost Confirmation Audit
on:
  pull_request:
    paths:
      - "contracts/AGENTDOJO_FINAL_128_EXECUTION_AUTHORIZATION_v5.json"
      - ".github/workflows/final-128-v5-human-cost-confirmation-audit.yml"
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify explicit confirmation without execution
        shell: python
        run: |
          import json
          from pathlib import Path
          a=json.loads(Path("contracts/AGENTDOJO_FINAL_128_EXECUTION_AUTHORIZATION_v5.json").read_text())
          assert a["authorization"]["issued"] is True
          assert a["authorization"]["consumed"] is False
          assert a["authorization"]["single_use"] is True
          assert a["cost_boundary"]["maximum_usd"]==5
          assert a["cost_boundary"]["cost_confirmation_received"] is True
          assert a["human_confirmation"]["received"] is True
          assert a["dispatch"]["provider_dispatch_authorized"] is True
          assert a["dispatch"]["manual_dispatch_authorized"] is True
          assert a["dispatch"]["provider_credential_access"] is False
          assert a["dispatch"]["provider_api_called"] is False
          assert a["dispatch"]["final_128_executed"] is False
          print("PASS_FINAL_128_V5_HUMAN_COST_CONFIRMATION")
