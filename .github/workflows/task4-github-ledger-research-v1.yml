name: Task4 GitHub Retained Metadata Ledger Research
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'bootstrap creates the fixed state branch once; exercise uses approved genesis'
        type: choice
        options: [exercise, bootstrap]
        default: exercise
        required: true
      acknowledgement:
        description: 'Research metadata only, no Provider or Native execution authority'
        type: string
        default: SYNTHETIC_LEDGER_ONLY_NO_PROVIDER
        required: true
      genesis_oid:
        description: 'Owner-approved 40-hex genesis from the bootstrap report (exercise only)'
        type: string
        required: false
      authorization_run_id:
        description: 'Owner-approved fresh 64-hex authorization ID, retained across retries (exercise only)'
        type: string
        required: false
      fault:
        description: 'Deliberately discard the winning mutation response before acknowledgement validation'
        type: choice
        options: [none, lost-ack]
        default: none
        required: true
permissions: {}
env:
  OPENAI_API_KEY: ''
  TASK4_OPENAI_API_KEY: ''
  TASK1_OPENAI_API_KEY: ''
  ANTHROPIC_API_KEY: ''
  OPENAI_BASE_URL: ''
  GH_TOKEN: ''
  GITHUB_TOKEN: ''
  PYTHONNOUSERSITE: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  LEDGER_ACK: ${{ inputs.acknowledgement }}
  LEDGER_GENESIS: ${{ inputs.genesis_oid }}
  LEDGER_AUTHORIZATION_RUN_ID: ${{ inputs.authorization_run_id }}
  LEDGER_FAULT: ${{ inputs.fault }}

jobs:
  bootstrap:
    if: >-
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
      github.repository == 'veritasfuji-japan/rcc-revas-veritas-benchmark' && inputs.mode == 'bootstrap'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Explicit create-only research namespace bootstrap
        run: python -m scripts.task4_github_ledger_research_v1 --action bootstrap --output results/bootstrap.json
        env:
          LEDGER_JOB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: task4-github-ledger-bootstrap
          path: results/bootstrap.json
          if-no-files-found: error

  reserve:
    if: >-
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
      github.repository == 'veritasfuji-japan/rcc-revas-veritas-benchmark' && inputs.mode == 'exercise'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      head: ${{ steps.reserve.outputs.head }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Dedicated trusted writer enrolls and reserves one synthetic operation
        id: reserve
        run: python -m scripts.task4_github_ledger_research_v1 --action reserve --output results/reserve.json
        env:
          LEDGER_JOB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: task4-github-ledger-reserve
          path: results/reserve.json
          if-no-files-found: error

  observe:
    needs: reserve
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      head: ${{ steps.observe.outputs.head }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Fresh read-only runner sees reservation and must fail an actual GitHub write probe
        id: observe
        run: python -m scripts.task4_github_ledger_research_v1 --action observe --output results/observe.json
        env:
          LEDGER_JOB_TOKEN: ${{ github.token }}
          LEDGER_EXPECTED_HEAD: ${{ needs.reserve.outputs.head }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: task4-github-ledger-observe
          path: results/observe.json
          if-no-files-found: error

  contenders:
    needs: observe
    strategy:
      fail-fast: false
      matrix:
        candidate: ['1', '2']
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Submit one mutation against the same observed head without retry
        run: python -m scripts.task4_github_ledger_research_v1 --action contend --output "results/contend-$LEDGER_CANDIDATE.json"
        env:
          LEDGER_JOB_TOKEN: ${{ github.token }}
          LEDGER_EXPECTED_HEAD: ${{ needs.observe.outputs.head }}
          LEDGER_CANDIDATE: ${{ matrix.candidate }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: task4-github-ledger-contend-${{ matrix.candidate }}
          path: results/contend-${{ matrix.candidate }}.json
          if-no-files-found: error

  replay:
    needs: contenders
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Fresh trusted writer refuses duplicate enrollment and consumed replay without mutation
        run: python -m scripts.task4_github_ledger_research_v1 --action replay --output results/replay.json
        env:
          LEDGER_JOB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: task4-github-ledger-replay
          path: results/replay.json
          if-no-files-found: error

  verify:
    needs: [reserve, observe, contenders, replay]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: task4-github-ledger-*
          path: evidence
          merge-multiple: true
      - name: Read-only final verifier joins six fresh runner witnesses and one retained consumption
        run: python -m scripts.task4_github_ledger_research_v1 --action verify --evidence evidence --output results/report.json
        env:
          LEDGER_JOB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: task4-github-ledger-verified
          path: results/report.json
          if-no-files-found: error
