name: Final 128 RCC Runtime Import Proof
on:
  pull_request:
    paths:
      - "scripts/final_128_rcc_runtime_import_proof_v1.py"
      - ".github/workflows/final-128-rcc-runtime-import-proof.yml"
  workflow_dispatch:
permissions: {contents: read}
jobs:
  proof:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11.16"}
      - name: Checkout exact RCC pin
        run: |
          mkdir -p _pins
          git clone https://github.com/veritasfuji-japan/rcc-revas-veritas-benchmark.git _pins/rcc
          git -C _pins/rcc fetch --depth=1 origin 1d3782d3aae5ff9c88036709c1a5642320cc53c2
          git -C _pins/rcc checkout 1d3782d3aae5ff9c88036709c1a5642320cc53c2
      - name: Prove exact rveval runtime import
        run: python scripts/final_128_rcc_runtime_import_proof_v1.py --rcc-root _pins/rcc
