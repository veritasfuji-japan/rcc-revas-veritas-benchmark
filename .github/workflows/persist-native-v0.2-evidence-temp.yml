name: Persist native v0.2 evidence

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/persist-native-v0.2-evidence-temp.yml"

permissions:
  contents: write
  actions: read

jobs:
  persist:
    if: github.head_ref == 'evidence/native-v0.2-run-33936308122'
    runs-on: ubuntu-latest
    steps:
      - name: Check out evidence branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Download exact successful artifact
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ARTIFACT_ID: "9960293177"
          EXPECTED_ZIP_SHA256: "aac04ab6e9842cc5315e3c6462501a41eed175c9e5ff4272e3c64cc5349d0dfc"
        run: |
          set -euo pipefail
          gh api "repos/$REPO/actions/artifacts/$ARTIFACT_ID/zip" > /tmp/native-v0.2.zip
          echo "$EXPECTED_ZIP_SHA256  /tmp/native-v0.2.zip" | sha256sum -c -

      - name: Persist exact artifact bytes and provenance
        env:
          RUN_ID: "33936308122"
          ARTIFACT_ID: "9960293177"
          ARTIFACT_ZIP_SHA256: "aac04ab6e9842cc5315e3c6462501a41eed175c9e5ff4272e3c64cc5349d0dfc"
          BENCHMARK_HEAD_SHA: "27ce2bf7348a46ef119b2ca7559a336e93cdb73e"
          PINNED_VERITAS_SHA: "4a794e31b26c28e43eb1bb8e6a2474f511c5bd7c"
          PR8_MERGE_SHA: "feb8101cab0b264a387b090d1aa9a98696a7ca55"
        run: |
          set -euo pipefail
          DEST="evidence/native-v0.2/run-$RUN_ID"
          test ! -e "$DEST"
          mkdir -p "$DEST"
          unzip -q /tmp/native-v0.2.zip -d "$DEST"

          for file in cases.jsonl summary.json run_manifest.json report.md; do
            test -s "$DEST/$file"
          done

          echo "e085f76107caf2c9e848d63e6a098bf9218b2f02f532bc593413903f9fc23dcf  $DEST/cases.jsonl" | sha256sum -c -
          echo "603841e031fba9bf5d68531cdf37bdefec399c085b0bf0c548c82044f7b5e8d4  $DEST/summary.json" | sha256sum -c -
          echo "b2d0135b5d02137913df9818003f06e996c9cb40979d4d1c492acc094907914d  $DEST/run_manifest.json" | sha256sum -c -
          echo "7c51ebd7faa44b3a5da576ce31d4627c8a45c8cfdcb32aac877d256b7b61e4d3  $DEST/report.md" | sha256sum -c -

          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          run_id = os.environ["RUN_ID"]
          dest = Path(f"evidence/native-v0.2/run-{run_id}")
          files = ["cases.jsonl", "summary.json", "run_manifest.json", "report.md"]

          persisted = {}
          for name in files:
              p = dest / name
              persisted[name] = {
                  "sha256": hashlib.sha256(p.read_bytes()).hexdigest(),
                  "size_bytes": p.stat().st_size,
              }

          workflow_evidence = {
              "artifact_type": "github_actions_workflow_evidence",
              "artifact_version": "0.2.0",
              "repository": "veritasfuji-japan/rcc-revas-veritas-benchmark",
              "workflow_name": "Native VERITAS Bind benchmark v0.2",
              "workflow_run_id": int(os.environ["RUN_ID"]),
              "workflow_run_conclusion": "success",
              "workflow_run_head_sha": os.environ["BENCHMARK_HEAD_SHA"],
              "workflow_run_head_branch": "codex/implement-v0.2-benchmark-with-bind-authorization-4qeqlc",
              "source_pull_request": 8,
              "source_pull_request_merge_sha": os.environ["PR8_MERGE_SHA"],
              "artifact_id": int(os.environ["ARTIFACT_ID"]),
              "artifact_name": "native-veritas-bind-benchmark-v0.2",
              "artifact_zip_sha256": os.environ["ARTIFACT_ZIP_SHA256"],
              "pinned_veritas_commit": os.environ["PINNED_VERITAS_SHA"],
              "claims": {
                  "real_bind_invoked": False,
                  "bind_authorization_created": False,
                  "execution_authority_created": False,
                  "bind_receipt_created": False,
                  "request_dispatched": False,
                  "credential_material_accessed": False,
                  "authorization_header_constructed": False,
                  "network_used": False,
                  "external_effect_occurred": False,
              },
          }
          (dest / "workflow_evidence.json").write_text(
              json.dumps(workflow_evidence, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          provenance = {
              "artifact_type": "native_veritas_bind_benchmark_v0_2_artifact_provenance",
              "artifact_version": "0.2.0",
              "status": "PERSISTED_EXACT_GITHUB_ACTIONS_ARTIFACT",
              "repository": "veritasfuji-japan/rcc-revas-veritas-benchmark",
              "source_workflow_run_id": int(os.environ["RUN_ID"]),
              "source_workflow_name": "Native VERITAS Bind benchmark v0.2",
              "source_workflow_conclusion": "success",
              "source_benchmark_commit": os.environ["BENCHMARK_HEAD_SHA"],
              "source_pull_request": 8,
              "source_pull_request_merge_sha": os.environ["PR8_MERGE_SHA"],
              "pinned_veritas_commit": os.environ["PINNED_VERITAS_SHA"],
              "artifact_id": int(os.environ["ARTIFACT_ID"]),
              "artifact_name": "native-veritas-bind-benchmark-v0.2",
              "artifact_zip_sha256": os.environ["ARTIFACT_ZIP_SHA256"],
              "persisted_files": persisted,
              "workflow_evidence_sha256": hashlib.sha256(
                  (dest / "workflow_evidence.json").read_bytes()
              ).hexdigest(),
              "claim_boundary": [
                  "Decision Adoption != Execution Authority",
                  "READY_FOR_GUARDED_PROMOTION != execution authorization",
                  "PASSED_FOR_FUTURE_BIND_AUTHORIZATION_ARTIFACT != execution authorization",
                  "No real Bind, dispatch, credential access, network use, or external effect occurred.",
              ],
          }
          (dest / "ARTIFACT_PROVENANCE.json").write_text(
              json.dumps(provenance, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

          git diff --exit-code -- evidence/native-v0.1 fixtures/Governance_labelled_Evaluation_Set_v0.1.1.json

      - name: Commit persisted evidence
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/native-v0.2/run-33936308122
          git commit -m "evidence: persist native v0.2 run 33936308122"
          git push origin HEAD:"$GITHUB_HEAD_REF"
