name: Task15 Mock Broker Authorization Boundary V1
on:
  pull_request:
    paths:
      - ".github/workflows/task15-mock-broker-authorization-boundary-v1.yml"
      - "task15_mock_broker_authorization_boundary_v1.py"
      - "tests/test_task15_mock_broker_authorization_boundary_v1.py"
      - "scripts/task15_mock_broker_authorization_audit_v1.py"
      - "contracts/TASK15_MOCK_BROKER_AUTHORIZATION_BOUNDARY_V1.json"
      - "docs/TASK15_MOCK_BROKER_AUTHORIZATION_BOUNDARY_V1.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/task15-mock-broker-authorization-boundary-v1.yml"
      - "task15_mock_broker_authorization_boundary_v1.py"
      - "tests/test_task15_mock_broker_authorization_boundary_v1.py"
      - "scripts/task15_mock_broker_authorization_audit_v1.py"
      - "contracts/TASK15_MOCK_BROKER_AUTHORIZATION_BOUNDARY_V1.json"
      - "docs/TASK15_MOCK_BROKER_AUTHORIZATION_BOUNDARY_V1.md"
permissions:
  contents: read
jobs:
  offline-broker-boundary-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OPENAI_API_KEY: ""
      OPENAI_BASE_URL: ""
      ANTHROPIC_API_KEY: ""
      PYTHONPATH: "."
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
      - name: Install pinned offline-only signature dependency
        run: python -m pip install "cryptography==50.0.0"
      - name: Run adversarial broker proof and persist two SQLite ledgers
        run: |
          set -euo pipefail
          mkdir -p results
          python scripts/task15_mock_broker_authorization_audit_v1.py --output-dir results | tee results.log
      - name: Upload raw auditable artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: task15-mock-broker-authorization-v1
          path: |
            results/*
            results.log
          if-no-files-found: warn
