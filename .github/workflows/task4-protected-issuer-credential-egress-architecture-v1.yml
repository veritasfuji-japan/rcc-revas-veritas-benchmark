name: Task4 Protected Issuer Credential Egress Architecture V1
on:
  pull_request:
    paths:
      - ".github/workflows/task4-protected-issuer-credential-egress-architecture-v1.yml"
      - "contracts/TASK4_PROTECTED_ISSUER_CREDENTIAL_EGRESS_ARCHITECTURE_V1.json"
      - "scripts/task4_protected_issuer_credential_egress_architecture_v1.py"
      - "tests/test_task4_protected_issuer_credential_egress_architecture_v1.py"
      - "docs/TASK4_PROTECTED_ISSUER_CREDENTIAL_EGRESS_ARCHITECTURE_V1.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/task4-protected-issuer-credential-egress-architecture-v1.yml"
      - "contracts/TASK4_PROTECTED_ISSUER_CREDENTIAL_EGRESS_ARCHITECTURE_V1.json"
      - "scripts/task4_protected_issuer_credential_egress_architecture_v1.py"
      - "tests/test_task4_protected_issuer_credential_egress_architecture_v1.py"
      - "docs/TASK4_PROTECTED_ISSUER_CREDENTIAL_EGRESS_ARCHITECTURE_V1.md"

permissions:
  contents: read
  actions: read

jobs:
  offline-static-role-graph-no-live-privilege:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OPENAI_API_KEY: ""
      TASK4_OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      OPENAI_BASE_URL: ""
      VERITAS_DATABASE_URL: ""
      TASK4_THIRD_APPROVAL_PHRASE: ""
      TASK4_307_APPROVAL_PHRASE: ""
      TASK4_308_APPROVAL_PHRASE: ""
      TASK4_309_APPROVAL_PHRASE: ""
      TASK4_310_APPROVAL_PHRASE: ""
      TASK4_311_APPROVAL_PHRASE: ""
      TASK4_312_APPROVAL_PHRASE: ""
      TASK4_312_OFFLINE_ARCH_AUDIT: "1"
      PYTHONNOUSERSITE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PYTEST_ADDOPTS: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
      - name: Verify exact parent and historical exhausted real Provider permission
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/task4-third-two-real-provider-v1-consumed" --jq '.object.sha')" = "95ff6be8c5875ed3827a00fe71fb54bd9de48130"
          test "$(git hash-object sql/task4_310_offline_postgres_consume_v1.sql)" = "0b891930f50fc17747a9854666450c9438ef7945"
          test "$(git hash-object scripts/task4_310_postgres_single_use_ci.py)" = "8e9dad92aa2b548f525b81c8fe8cc281cf97fe70"
          test "$(git hash-object sql/task4_311_committed_receipt_handoff_ci_v1.sql)" = "db93a03db99c3f714e648a03cb31a8a6c27b3884"
          test "$(git hash-object scripts/task4_311_committed_receipt_handoff_ci.py)" = "65680beb063c095b5f6d59fb2415071db05a7c8d"
          test "$(git hash-object .github/workflows/task4-committed-receipt-handoff-ci-v1.yml)" = "fe293e0f7cf7bb05bac76e8e5b73fe49539012dc"
          echo "TASK4_312_PARENT_CONSUMPTION_SOURCE_PINNED_AND_PRIOR_PROVIDER_APPROVAL_SPENT"
      - name: Install only pytest for static offline verification
        shell: bash
        run: python -m pip install --disable-pip-version-check "pytest==9.1.1"
      - name: Reject privilege escalation, fake evidence and any live authority
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          python -m pytest -q -o addopts= \
            tests/test_task4_protected_issuer_credential_egress_architecture_v1.py \
            --junitxml=results/task4-312-architecture-junit.xml \
            | tee results/task4-312-architecture-tests.log
          python scripts/task4_protected_issuer_credential_egress_architecture_v1.py \
            --output results/task4-312-architecture-audit.json \
            | tee results/task4-312-architecture-report.log
          python - <<'PY'
          import json
          d=json.load(open("results/task4-312-architecture-audit.json"))
          assert d["readiness"]=="BLOCKED_NOT_ATTESTED_NO_REAL_PROVIDER_DISPATCH"
          assert len(d["pre_send_requirements"])==12
          assert all(x["status"]=="NOT_ATTESTED" for x in d["pre_send_requirements"])
          assert len(d["post_send_requirements"])==3
          assert d["real_provider_calls"]==0
          assert d["new_human_authorization_issued"] is False
          assert d["final_live_decision"]["decision"]=="DENY"
          print("TASK4_312_DESIGN_IS_STATIC_ONLY_12_EXTERNAL_PRE_SEND_REQUIREMENTS_UNATTESTED")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: task4-protected-issuer-credential-egress-architecture-v1
          path: results/*
          if-no-files-found: warn
