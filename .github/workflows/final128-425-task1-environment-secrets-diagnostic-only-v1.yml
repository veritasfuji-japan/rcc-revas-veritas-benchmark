name: Task1 425 Secrets-Only Diagnostic NO PROVIDER NO TAG
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: task1-425-diagnostic-only-no-provider-no-tag
  cancel-in-progress: false

jobs:
  task1-secrets-only-diagnostic:
    # No paid authority is available in this workflow.
    if: github.actor == 'veritasfuji-japan' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: task1-real-model-pilot
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
      - name: Locally diagnose Task1 secret FORMATS only (NO PROVIDER, NO TAG)
        env:
          TASK1_OPENAI_API_KEY: ${{ secrets.TASK1_OPENAI_API_KEY }}
          TASK1_CAPTURE_AES256_KEY: ${{ secrets.TASK1_CAPTURE_AES256_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python scripts/final128_425_task1_environment_secrets_diagnostic_only_v1.py
