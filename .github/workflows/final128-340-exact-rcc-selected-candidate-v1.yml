name: Final128 340 Exact RCC Selected Candidate in Real VERITAS CDA V1

on:
  pull_request:
    paths:
      - ".github/workflows/final128-340-exact-rcc-selected-candidate-v1.yml"
      - "contracts/FINAL128_340_EXACT_RCC_SELECTED_CANDIDATE_LINEAGE_V1.json"
      - "scripts/final128_340_exact_rcc_selected_candidate_lineage_v1.py"
      - "tests/test_final128_340_exact_rcc_selected_candidate_lineage_v1.py"
      - "docs/optimization/FINAL128_340_EXACT_RCC_SELECTED_CANDIDATE_LINEAGE_V1.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-native-decide-cda-candidate-identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      OPENAI_API_KEY: ""
      TASK4_OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      VERITAS_API_KEY: ""
      VERITAS_DATABASE_URL: ""
      GITHUB_TOKEN: ""
      GH_TOKEN: ""
      FINAL128_340_UPSTREAM_ROOT: "${{ github.workspace }}/current-rcc-upstream"
      FINAL128_340_VERITAS_ROOT: "${{ github.workspace }}/veritas-source"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: effacermonexistence/rcc-revas-veritas-benchmark
          ref: 353ad9e6a17cda8874a129493fe0f8f4fe4427bc
          path: current-rcc-upstream
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: veritasfuji-japan/veritas_os
          ref: 299a3c4987668091f50ab3e45165bcccd1ae193f
          path: veritas-source
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
      - name: Verify frozen source HEADs and install real VERITAS dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C current-rcc-upstream rev-parse HEAD)" = "353ad9e6a17cda8874a129493fe0f8f4fe4427bc"
          test "$(git -C veritas-source rev-parse HEAD)" = "299a3c4987668091f50ab3e45165bcccd1ae193f"
          test -z "$(git -C current-rcc-upstream status --porcelain)"
          test -z "$(git -C veritas-source status --porcelain)"
          for key in OPENAI_API_KEY TASK4_OPENAI_API_KEY ANTHROPIC_API_KEY VERITAS_API_KEY VERITAS_DATABASE_URL GITHUB_TOKEN GH_TOKEN; do
            test -z "$(printenv "$key" || true)"
          done
          python -m pip install --disable-pip-version-check "./veritas-source[signing]" "pytest==9.0.3"
      - name: Execute real RCC candidate with controlled exact selection at native VERITAS route
        shell: bash
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          mkdir -p results
          git rev-parse HEAD > results/final128-340-benchmark-head.txt
          git -C current-rcc-upstream rev-parse HEAD > results/final128-340-rcc-head.txt
          git -C veritas-source rev-parse HEAD > results/final128-340-veritas-head.txt
          python scripts/final128_340_exact_rcc_selected_candidate_lineage_v1.py \
            --upstream-root current-rcc-upstream \
            --veritas-root veritas-source \
            --output-dir results/final128-340-exact-rcc-selected-candidate-lineage \
            | tee results/final128-340-route.log
      - name: Verify native CDA exact source candidate selection and fail-closed promotion
        shell: bash
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          python -m pytest -q -o addopts= \
            tests/test_final128_340_exact_rcc_selected_candidate_lineage_v1.py \
            --junitxml=results/final128-340-junit.xml \
            | tee results/final128-340-test.log
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          r=json.loads(Path("results/final128-340-exact-rcc-selected-candidate-lineage/report.json").read_text())
          digest=r.pop("report_sha256")
          assert digest==hashlib.sha256(json.dumps(r,sort_keys=True,
            separators=(",",":"),ensure_ascii=False,allow_nan=False).encode()).hexdigest()
          assert r["selected"]["actual_http_route_exercised"] is True
          assert r["selected"]["native_cda_verified"] is True
          assert r["selected"]["selected_id_exact"] is True
          assert r["selected"]["selected_canonical_description_exact"] is True
          assert r["selected"]["native_promotion_result"]=="REFUSED_NO_EXECUTION_INTENT"
          assert r["real_external_effects"]==0
          assert r["scope"]["real_model_calls"]==0
          print("340_NATIVE_CDA_CHOSEN_MATCHED_REAL_RCC_SOURCE_NO_EXECUTION_AUTHORITY")
          PY
          sha256sum \
            contracts/FINAL128_340_EXACT_RCC_SELECTED_CANDIDATE_LINEAGE_V1.json \
            scripts/final128_340_exact_rcc_selected_candidate_lineage_v1.py \
            tests/test_final128_340_exact_rcc_selected_candidate_lineage_v1.py \
            docs/optimization/FINAL128_340_EXACT_RCC_SELECTED_CANDIDATE_LINEAGE_V1.md \
            results/final128-340-exact-rcc-selected-candidate-lineage/report.json \
            > results/final128-340-sha256.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: final128-340-exact-rcc-selected-candidate-lineage-cda-v1
          path: |
            results/final128-340-benchmark-head.txt
            results/final128-340-rcc-head.txt
            results/final128-340-veritas-head.txt
            results/final128-340-route.log
            results/final128-340-test.log
            results/final128-340-junit.xml
            results/final128-340-sha256.txt
            results/final128-340-exact-rcc-selected-candidate-lineage/report.json
          if-no-files-found: warn
