name: Final128 339 Current RCC Exact Request Real VERITAS Decide V1

on:
  pull_request:
    paths:
      - ".github/workflows/final128-339-current-rcc-real-decide-v1.yml"
      - "contracts/FINAL128_339_CURRENT_RCC_REAL_DECIDE_COMPATIBILITY_V1.json"
      - "scripts/final128_339_current_rcc_real_decide_compatibility_v1.py"
      - "tests/test_final128_339_current_rcc_real_decide_compatibility_v1.py"
      - "docs/optimization/FINAL128_339_CURRENT_RCC_REAL_DECIDE_COMPATIBILITY_V1.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-native-decide-cda-candidate-identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      OPENAI_API_KEY: ""
      TASK4_OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      VERITAS_API_KEY: ""
      VERITAS_DATABASE_URL: ""
      GITHUB_TOKEN: ""
      GH_TOKEN: ""
      FINAL128_339_UPSTREAM_ROOT: "${{ github.workspace }}/current-rcc-upstream"
      FINAL128_339_VERITAS_ROOT: "${{ github.workspace }}/veritas-source"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: effacermonexistence/rcc-revas-veritas-benchmark
          ref: 353ad9e6a17cda8874a129493fe0f8f4fe4427bc
          path: current-rcc-upstream
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: veritasfuji-japan/veritas_os
          ref: 299a3c4987668091f50ab3e45165bcccd1ae193f
          path: veritas-source
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
      - name: Verify frozen source HEADs and install real VERITAS dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C current-rcc-upstream rev-parse HEAD)" = "353ad9e6a17cda8874a129493fe0f8f4fe4427bc"
          test "$(git -C veritas-source rev-parse HEAD)" = "299a3c4987668091f50ab3e45165bcccd1ae193f"
          test -z "$(git -C current-rcc-upstream status --porcelain)"
          test -z "$(git -C veritas-source status --porcelain)"
          for key in OPENAI_API_KEY TASK4_OPENAI_API_KEY ANTHROPIC_API_KEY VERITAS_API_KEY VERITAS_DATABASE_URL GITHUB_TOKEN GH_TOKEN; do
            test -z "$(printenv "$key" || true)"
          done
          python -m pip install --disable-pip-version-check ./veritas-source "pytest==9.0.3"
      - name: Execute real RCC original candidate in actual local VERITAS route
        shell: bash
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          mkdir -p results
          git rev-parse HEAD > results/final128-339-benchmark-head.txt
          git -C current-rcc-upstream rev-parse HEAD > results/final128-339-rcc-head.txt
          git -C veritas-source rev-parse HEAD > results/final128-339-veritas-head.txt
          python scripts/final128_339_current_rcc_real_decide_compatibility_v1.py \
            --upstream-root current-rcc-upstream \
            --veritas-root veritas-source \
            --output-dir results/final128-339-current-rcc-real-decide \
            | tee results/final128-339-route.log
      - name: Verify real CDA and exact-source/no-effect proof claims
        shell: bash
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          python -m pytest -q -o addopts= \
            tests/test_final128_339_current_rcc_real_decide_compatibility_v1.py \
            --junitxml=results/final128-339-junit.xml \
            | tee results/final128-339-test.log
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          r=json.loads(Path("results/final128-339-current-rcc-real-decide/report.json").read_text())
          digest=r.pop("report_sha256")
          assert digest==hashlib.sha256(json.dumps(r,sort_keys=True,
            separators=(",",":"),ensure_ascii=False,allow_nan=False).encode()).hexdigest()
          assert r["route"]["real_api_route_called"] is True
          assert r["route"]["native_cda_verified"] is True
          assert r["route"]["request_payload_exact"] is True
          assert r["actual_execution_effects"]==0
          assert r["scope"]["live_model_provider_calls"]==0
          if not r["linkage"]["response_exact_native_candidate_selection_proven"]:
            assert r["verified_rcc_execution_intent"] is None
            assert r["rcc_to_native_execution_intent_proven"] is False
          print("339_REAL_HTTP_NATIVE_CDA_VERIFIED_CANDIDATE_BINDING_REPORTED_WITHOUT_PROMOTION_FABRICATION")
          PY
          sha256sum \
            contracts/FINAL128_339_CURRENT_RCC_REAL_DECIDE_COMPATIBILITY_V1.json \
            scripts/final128_339_current_rcc_real_decide_compatibility_v1.py \
            tests/test_final128_339_current_rcc_real_decide_compatibility_v1.py \
            docs/optimization/FINAL128_339_CURRENT_RCC_REAL_DECIDE_COMPATIBILITY_V1.md \
            results/final128-339-current-rcc-real-decide/report.json \
            > results/final128-339-sha256.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: final128-339-current-rcc-real-decide-cda-v1
          path: |
            results/final128-339-benchmark-head.txt
            results/final128-339-rcc-head.txt
            results/final128-339-veritas-head.txt
            results/final128-339-route.log
            results/final128-339-test.log
            results/final128-339-junit.xml
            results/final128-339-sha256.txt
            results/final128-339-current-rcc-real-decide/report.json
          if-no-files-found: warn
