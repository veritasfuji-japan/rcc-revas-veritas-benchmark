name: Task4 371 Real VERITAS Bind Evaluator Docker Gateway Offline
on:
  pull_request:
    paths:
      - ".github/workflows/task4-371-veritas-bind-docker-gateway.yml"
      - "scripts/task4_371_veritas_bind_gateway_v1.py"
      - "scripts/task4_371_veritas_bind_agent_v1.py"
      - "scripts/task4_371_veritas_bind_docker_audit_v1.py"
      - "docker/task4_371_veritas_bind_gateway_v1.Dockerfile"
      - "docs/TASK4_371_VERITAS_BIND_DOCKER_GATEWAY_V1.md"
      - "scripts/task4_370_docker_network_service_v1.py"
      - "scripts/task4_370_docker_network_agent_v1.py"
      - "scripts/task4_370_docker_network_audit_v1.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/task4-371-veritas-bind-docker-gateway.yml"
      - "scripts/task4_371_veritas_bind_gateway_v1.py"
      - "scripts/task4_371_veritas_bind_agent_v1.py"
      - "scripts/task4_371_veritas_bind_docker_audit_v1.py"
      - "docker/task4_371_veritas_bind_gateway_v1.Dockerfile"
      - "docs/TASK4_371_VERITAS_BIND_DOCKER_GATEWAY_V1.md"
      - "scripts/task4_370_docker_network_service_v1.py"
      - "scripts/task4_370_docker_network_agent_v1.py"
      - "scripts/task4_370_docker_network_audit_v1.py"
permissions:
  contents: read
jobs:
  upstream-veritas-bind-evaluator-to-docker-mock-effect:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OPENAI_API_KEY: ""
      TASK4_OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      OPENAI_BASE_URL: ""
      AWS_SECRET_ACCESS_KEY: ""
      GH_TOKEN: ""
      GITHUB_TOKEN: ""
      VERITAS_DATABASE_URL: ""
      PYTHONNOUSERSITE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      TASK4_371_VERITAS_PIN: "b1835c9f5044855a7b69f82de997056bba8847ab"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
      - name: Exact benchmark SHA and pinned VERITAS OS upstream source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results _pins/veritas
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git -C _pins/veritas init
          git -C _pins/veritas remote add origin https://github.com/veritasfuji-japan/veritas_os.git
          git -C _pins/veritas config core.sparseCheckout true
          mkdir -p _pins/veritas/.git/info
          echo '/veritas_os/core/continuation_runtime/bind_admissibility.py' \
            > _pins/veritas/.git/info/sparse-checkout
          git -C _pins/veritas fetch --depth 1 --filter=blob:none origin "$TASK4_371_VERITAS_PIN"
          git -C _pins/veritas checkout --detach FETCH_HEAD
          test "$(git -C _pins/veritas rev-parse HEAD)" = "$TASK4_371_VERITAS_PIN"
          test -f _pins/veritas/veritas_os/core/continuation_runtime/bind_admissibility.py
          python -m py_compile \
            _pins/veritas/veritas_os/core/continuation_runtime/bind_admissibility.py \
            scripts/task4_371_veritas_bind_gateway_v1.py \
            scripts/task4_371_veritas_bind_agent_v1.py \
            scripts/task4_371_veritas_bind_docker_audit_v1.py
          git -C _pins/veritas rev-parse HEAD > results/veritas-os-exact-pin.txt
          sha256sum _pins/veritas/veritas_os/core/continuation_runtime/bind_admissibility.py \
            > results/veritas-os-actual-upstream-source.sha256
          git rev-parse HEAD > results/benchmark-checked-out-head.txt
          docker version > results/docker-version.txt
      - name: Run actual VERITAS evaluator inside broker and kernel-isolated mock sink
        shell: bash
        run: |
          set -euo pipefail
          python scripts/task4_371_veritas_bind_docker_audit_v1.py \
            --output-dir results | tee results/task4-371-run.log
          python - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path
          a=json.loads(Path("results/task4-371-veritas-bind-docker-evidence.json").read_text())
          assert a["rule"]=="TASK4_371_PINNED_VERITAS_BIND_DOCKER_GATEWAY_V1"
          assert a["veritas_os_exact_source_pin"]=="b1835c9f5044855a7b69f82de997056bba8847ab"
          assert a["actual_VERITAS_OS_bind_admissibility_evaluator_invoked"] is True
          assert a["trusted_runtime_signals_are_synthetic_fixtures"] is True
          assert a["full_VERITAS_OS_signed_authorization_issued"] is False
          assert a["production_IAM_or_external_effect_boundary_proven"] is False
          assert len(a["checks"])==24 and all(a["checks"].values())
          assert len(a["evaluations"])==10
          assert sum(not x["admissible"] for x in a["evaluations"])==7
          assert len(a["sink_effects"])==len(a["broker_sqlite_rows"])==2
          assert a["real_provider_calls"]==a["real_bank_effects"]==a["provider_spend_usd"]==0
          root=ET.parse("results/task4-371-bind-docker-junit.xml").getroot()
          assert root.attrib["tests"]=="24" and root.attrib["failures"]=="0"
          print("TASK4_371_ACTUAL_PINNED_VERITAS_BIND_IN_DOCKER_24_PASS_NOT_FULL_AUTHORITY")
          PY
          sha256sum \
            scripts/task4_371_veritas_bind_gateway_v1.py \
            scripts/task4_371_veritas_bind_agent_v1.py \
            scripts/task4_371_veritas_bind_docker_audit_v1.py \
            docker/task4_371_veritas_bind_gateway_v1.Dockerfile \
            docs/TASK4_371_VERITAS_BIND_DOCKER_GATEWAY_V1.md \
            results/task4-371-veritas-bind-docker-evidence.json \
            results/task4-371-bind-docker-junit.xml \
            results/veritas-os-actual-upstream-source.sha256 \
            > results/task4-371-evidence-sha256.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: task4-371-veritas-bind-docker-gateway-v1
          path: results/*
          if-no-files-found: warn
