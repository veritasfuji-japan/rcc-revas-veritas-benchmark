name: Task4 Future Provider SDK PreDispatch Mock V1
on:
  pull_request:
    paths:
      - ".github/workflows/task4-future-provider-sdk-predispatch-mock-v1.yml"
      - "scripts/task4_future_provider_sdk_predispatch_mock_v1.py"
      - "tests/test_task4_future_provider_sdk_predispatch_mock_v1.py"
      - "contracts/TASK4_FUTURE_PROVIDER_SDK_PREDISPATCH_MOCK_V1.json"
      - "docs/TASK4_FUTURE_PROVIDER_SDK_PREDISPATCH_MOCK_V1.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/task4-future-provider-sdk-predispatch-mock-v1.yml"
      - "scripts/task4_future_provider_sdk_predispatch_mock_v1.py"
      - "tests/test_task4_future_provider_sdk_predispatch_mock_v1.py"
      - "contracts/TASK4_FUTURE_PROVIDER_SDK_PREDISPATCH_MOCK_V1.json"
      - "docs/TASK4_FUTURE_PROVIDER_SDK_PREDISPATCH_MOCK_V1.md"

permissions:
  contents: read

jobs:
  real-openai-sdk-local-mock-pre-dispatch-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OPENAI_API_KEY: ""
      TASK4_OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      OPENAI_BASE_URL: ""
      VERITAS_DATABASE_URL: ""
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PYTHONNOUSERSITE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_ADDOPTS: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
      - name: Pin upstream offline issuance wire candidate and native Bind proof
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object task4_trusted_execution_date_profile_v1.py)" = "4eb8646b18cae7130c217fa3a04d05a3d71756d3"
          test "$(git hash-object scripts/task4_prospective_model_wire_date_boundary_v1.py)" = "83ad7d3f229084633c28729d592330c477c76316"
          test "$(git hash-object scripts/task4_prospective_offline_completion_envelope_bridge_v1.py)" = "b7ca0e41125a4a137397d41f8bc2650c7e179088"
          test "$(git hash-object scripts/task4_prospective_local_envelope_native_rcc_bind_v1.py)" = "a287ff67878f22cd552552a31c9b8451be1e5751"
          test "$(git hash-object agentdojo_constraint_resolver_v0_1.py)" = "edbf513e67efa8719de3a1193a5f3ba937afdf52"
          echo "TASK4_306_PINNED_PARENT_MODEL_DATE_ENVELOPE_AND_BIND_CODE_UNCHANGED"
      - name: Install pinned real SDK (used only with no-network MockTransport)
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "pytest==9.1.1" "openai==1.109.1" "httpx==0.28.1"
          python - <<'PY'
          from importlib.metadata import version
          assert version("openai") == "1.109.1"
          assert version("httpx") == "0.28.1"
          print("EXACT_REAL_SDK_IMPORT_VERIFIED_NO_PROVIDER_CREDS")
          PY
      - name: Offline real SDK JSON serializer interception and negative tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          python -m pytest -q -o addopts= \
            tests/test_task4_future_provider_sdk_predispatch_mock_v1.py \
            --junitxml=results/task4-306-sdk-predispatch-junit.xml \
            | tee results/task4-306-sdk-predispatch-tests.log
          python scripts/task4_future_provider_sdk_predispatch_mock_v1.py \
            --output results/task4-306-sdk-predispatch-audit.json \
            | tee results/task4-306-sdk-predispatch-audit.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: task4-future-provider-sdk-predispatch-mock-v1
          path: results/*
          if-no-files-found: warn
