name: Task4 PostgreSQL Role Separated Consumption CI V1
on:
  pull_request:
    paths:
      - ".github/workflows/task4-postgres-role-separated-consumption-v1.yml"
      - "sql/task4_310_offline_postgres_consume_v1.sql"
      - "scripts/task4_310_postgres_single_use_ci.py"
      - "tests/test_task4_310_postgres_single_use_ci.py"
      - "contracts/TASK4_POSTGRES_ROLE_SEPARATED_CONSUMPTION_CI_V1.json"
      - "docs/TASK4_POSTGRES_ROLE_SEPARATED_CONSUMPTION_CI_V1.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/task4-postgres-role-separated-consumption-v1.yml"
      - "sql/task4_310_offline_postgres_consume_v1.sql"
      - "scripts/task4_310_postgres_single_use_ci.py"
      - "tests/test_task4_310_postgres_single_use_ci.py"
      - "contracts/TASK4_POSTGRES_ROLE_SEPARATED_CONSUMPTION_CI_V1.json"
      - "docs/TASK4_POSTGRES_ROLE_SEPARATED_CONSUMPTION_CI_V1.md"

permissions:
  contents: read
  actions: read

jobs:
  postgres-ci-only-atomic-role-separated-consumption:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: task4-310-admin-ci-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TASK4_310_CI_ONLY: "1"
      TASK4_310_ADMIN_DSN: "postgresql://postgres:task4-310-admin-ci-only@127.0.0.1:5432/postgres"
      TASK4_310_ISSUER_DSN: "postgresql://task4_310_fixture_issuer:task4-310-issuer-ci-only@127.0.0.1:5432/postgres"
      TASK4_310_CONSUMER_DSN: "postgresql://task4_310_fixture_consumer:task4-310-consumer-ci-only@127.0.0.1:5432/postgres"
      OPENAI_API_KEY: ""
      TASK4_OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      OPENAI_BASE_URL: ""
      VERITAS_DATABASE_URL: ""
      TASK4_THIRD_APPROVAL_PHRASE: ""
      TASK4_307_APPROVAL_PHRASE: ""
      TASK4_308_APPROVAL_PHRASE: ""
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PYTEST_ADDOPTS: ""
      PYTHONNOUSERSITE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
      - name: Verify historical consumed Provider authorization and pinned lineage
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/task4-third-two-real-provider-v1-consumed" --jq '.object.sha')" = "95ff6be8c5875ed3827a00fe71fb54bd9de48130"
          test "$(git hash-object scripts/task4_protected_live_authorization_gap_audit_v1.py)" = "9b87c87a98e30aaa16ebceb600437d3793361621"
          test "$(git hash-object scripts/task4_future_provider_atomic_oneuse_preflight_v1.py)" = "9d14cf421a2d5e33b252bc2ae45662306cc2772b"
          test "$(git hash-object scripts/task4_prospective_model_wire_date_boundary_v1.py)" = "83ad7d3f229084633c28729d592330c477c76316"
          echo "TASK4_310_PRIOR_CONSENT_CONSUMED_AND_OFFLINE_LINEAGE_PINNED"
      - name: Install isolated PostgreSQL client and offline testing dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "pytest==9.1.1" "psycopg[binary]==3.2.10"
      - name: Set up ephemeral test-only issuer and consumer roles in PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          python scripts/task4_310_postgres_single_use_ci.py --setup
      - name: Independent client sessions, permission denial, crash/rollback and evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          python -m pytest -q -o addopts= \
            tests/test_task4_310_postgres_single_use_ci.py \
            --junitxml=results/task4-310-postgres-role-separation-junit.xml \
            | tee results/task4-310-postgres-role-separation-tests.log
          python scripts/task4_310_postgres_single_use_ci.py \
            --report results/task4-310-postgres-role-separation-report.json \
            | tee results/task4-310-postgres-role-separation-audit.log
          python - <<'PY'
          import json
          r=json.load(open("results/task4-310-postgres-role-separation-report.json"))
          assert r["atomic_fixture_consumes"]==1
          assert r["atomic_fixture_conflict_rejections"]==15
          assert r["real_provider_calls"]==0
          assert r["new_human_approval_issued"] is False
          assert r["globally_protected_single_use_proven"] is False
          assert r["future_live_dispatch_decision"]=="DENY"
          print("TASK4_310_CI_POSTGRES_CONSUMPTION_ONLY_NO_REAL_PROVIDER_AUTHORITY")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: task4-postgres-role-separated-consumption-ci-v1
          path: results/*
          if-no-files-found: warn
