name: Final128 355 Task1 Live Readback Offline Tests
on:
  pull_request:
    paths:
      - "scripts/final128_355_task1_live_ruleset_evidence_v1.py"
      - "tests/test_final128_355_task1_live_ruleset_evidence_v1.py"
      - ".github/workflows/final128-355-task1-live-readback-offline.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
      - run: python -m pip install pytest
      - run: python -m pytest -q -o addopts= tests/test_final128_355_task1_live_ruleset_evidence_v1.py
