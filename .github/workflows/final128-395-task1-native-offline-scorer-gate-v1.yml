name: Final128 395 Task1 Actual Native Scorer Offline Diagnostic
on:
  pull_request:
    paths:
      - ".github/workflows/final128-395-task1-native-offline-scorer-gate-v1.yml"
      - "scripts/final128_395_task1_offline_native_postterminal_scorer_gate_v1.py"
      - "tests/test_final128_395_task1_offline_native_postterminal_scorer_gate_v1.py"
      - "docs/optimization/FINAL128_395_TASK1_NATIVE_POSTTERMINAL_OFFLINE_SCORER_GATE_V1.md"
permissions:
  contents: read
jobs:
  task1-native-offline-scorer-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    env:
      PYTHONPATH: "."
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      FINAL128_395_AGENTDOJO_ROOT: "_pins/agentdojo"
      FINAL128_394_AGENTDOJO_ROOT: "_pins/agentdojo"
      FINAL128_381_AGENTDOJO_ROOT: "_pins/agentdojo"
      FINAL128_378_AGENTDOJO_ROOT: "_pins/agentdojo"
      FINAL128_377_AGENTDOJO_ROOT: "_pins/agentdojo"
      OPENAI_API_KEY: ""
      TASK4_OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      OPENAI_BASE_URL: ""
      GH_TOKEN: ""
      GITHUB_TOKEN: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ethz-spylab/agentdojo
          ref: a75aba7631d3ca5fb7ab938965c97ead2f9ff84b
          path: _pins/agentdojo
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
      - name: Frozen source and empty execution secrets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git rev-parse HEAD > results/final128-395-exact-head.txt
          test "$(git -C _pins/agentdojo rev-parse HEAD)" = "a75aba7631d3ca5fb7ab938965c97ead2f9ff84b"
          test "$(git -C _pins/agentdojo hash-object src/agentdojo/default_suites/v1/tools/banking_client.py)" = "941c27467b7890cced7ab70e5fd5ca32241f99a5"
          for key in OPENAI_API_KEY TASK4_OPENAI_API_KEY ANTHROPIC_API_KEY OPENAI_BASE_URL GH_TOKEN GITHUB_TOKEN; do
            test -z "$(printenv "$key" || true)"
          done
          python -m py_compile \
            scripts/final128_395_task1_offline_native_postterminal_scorer_gate_v1.py \
            tests/test_final128_395_task1_offline_native_postterminal_scorer_gate_v1.py
      - name: Install frozen Native AgentDojo and pytest
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "pytest==9.1.1"
          python -m pip install --disable-pip-version-check -e _pins/agentdojo
      - name: Genuine Native Scorer on synthetic responses, no external Provider
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q -o addopts= \
            tests/test_final128_395_task1_offline_native_postterminal_scorer_gate_v1.py \
            tests/test_final128_394_task1_paired_second_turn_terminal_quarantine_v1.py \
            tests/test_final128_381_task1_real_responses_capture_contract_v1.py \
            tests/test_final128_378_native_paired_model_input_seam_v1.py \
            tests/test_final128_377_native_preterminal_spending_projection_v1.py \
            --junitxml=results/final128-395-junit.xml | tee results/final128-395-tests.log
      - name: Enforce diagnostic-only, zero skipped and SHA evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,xml.etree.ElementTree as ET
          from pathlib import Path
          root=ET.parse("results/final128-395-junit.xml").getroot()
          suites=[root] if root.tag=="testsuite" else list(root.findall("testsuite"))
          assert suites
          counts={k:sum(int(x.get(k,"0")) for x in suites)
                  for k in ("tests","failures","errors","skipped")}
          assert counts["tests"]>=150
          assert all(counts[k]==0 for k in ("failures","errors","skipped"))
          report={
            "schema":"veritas.final128.395-native-scorer-on-offline-synthetic-terminal.v1",
            "exact_pr_head":Path("results/final128-395-exact-head.txt").read_text().strip(),
            "agentdojo_pin":"a75aba7631d3ca5fb7ab938965c97ead2f9ff84b",
            "junit":counts,
            "real_native_user_and_attack_rubric_path_exercised":True,
            "source_type":"SYNTHETIC_LOCAL_FAKE_TERMINALS",
            "authenticated_provider_response_pairs":0,
            "real_provider_calls":0,
            "external_bank_effects":0,
            "external_github_mutations":0,
            "official_native_utility_scores":None,
            "official_native_attack_scores":None,
            "new_measured_final128_cases":0,
            "real_spend_authorized":False,
            "protected_global_issuer_proven":False,
            "ready_for_live_send":False
          }
          canonical=lambda x:json.dumps(x,sort_keys=True,separators=(",",":"),allow_nan=False).encode()
          report["sha256"]=hashlib.sha256(canonical(report)).hexdigest()
          Path("results/final128-395-redacted-no-official-score.json").write_text(
            json.dumps(report,sort_keys=True,indent=2)+"\n")
          print("395_REAL_NATIVE_SCORERS_CALLED_ONLY_ON_QUARANTINED_FAKE_TERMINALS_NOT_REAL_UTILITY")
          PY
          sha256sum \
            scripts/final128_395_task1_offline_native_postterminal_scorer_gate_v1.py \
            tests/test_final128_395_task1_offline_native_postterminal_scorer_gate_v1.py \
            docs/optimization/FINAL128_395_TASK1_NATIVE_POSTTERMINAL_OFFLINE_SCORER_GATE_V1.md \
            results/final128-395-redacted-no-official-score.json \
            results/final128-395-junit.xml > results/final128-395-sha256.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: final128-395-task1-actual-native-scorer-offline-no-real-model
          path: results/final128-395-*
          if-no-files-found: warn
