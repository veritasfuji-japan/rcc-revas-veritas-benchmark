name: Task4 PostgreSQL Committed Receipt Handoff CI V1
on:
  pull_request:
    paths:
      - ".github/workflows/task4-committed-receipt-handoff-ci-v1.yml"
      - "sql/task4_311_committed_receipt_handoff_ci_v1.sql"
      - "scripts/task4_311_committed_receipt_handoff_ci.py"
      - "tests/test_task4_311_committed_receipt_handoff_ci.py"
      - "contracts/TASK4_COMMITTED_RECEIPT_HANDOFF_CI_V1.json"
      - "docs/TASK4_COMMITTED_RECEIPT_HANDOFF_CI_V1.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/task4-committed-receipt-handoff-ci-v1.yml"
      - "sql/task4_311_committed_receipt_handoff_ci_v1.sql"
      - "scripts/task4_311_committed_receipt_handoff_ci.py"
      - "tests/test_task4_311_committed_receipt_handoff_ci.py"
      - "contracts/TASK4_COMMITTED_RECEIPT_HANDOFF_CI_V1.json"
      - "docs/TASK4_COMMITTED_RECEIPT_HANDOFF_CI_V1.md"

permissions:
  contents: read
  actions: read

jobs:
  independent-db-session-committed-consumption-receipt:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    services:
      postgres:
        image: postgres:16.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: task4-310-admin-ci-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TASK4_310_CI_ONLY: "1"
      TASK4_311_CI_ONLY: "1"
      TASK4_310_ADMIN_DSN: "postgresql://postgres:task4-310-admin-ci-only@127.0.0.1:5432/postgres"
      TASK4_310_ISSUER_DSN: "postgresql://task4_310_fixture_issuer:task4-310-issuer-ci-only@127.0.0.1:5432/postgres"
      TASK4_310_CONSUMER_DSN: "postgresql://task4_310_fixture_consumer:task4-310-consumer-ci-only@127.0.0.1:5432/postgres"
      TASK4_311_CONSUMER_DSN: "postgresql://task4_311_fixture_consumer:task4-311-consumer-ci-only@127.0.0.1:5432/postgres"
      TASK4_311_HANDOFF_DSN: "postgresql://task4_311_fixture_handoff:task4-311-handoff-ci-only@127.0.0.1:5432/postgres"
      OPENAI_API_KEY: ""
      TASK4_OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      OPENAI_BASE_URL: ""
      VERITAS_DATABASE_URL: ""
      TASK4_THIRD_APPROVAL_PHRASE: ""
      TASK4_307_APPROVAL_PHRASE: ""
      TASK4_308_APPROVAL_PHRASE: ""
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PYTEST_ADDOPTS: ""
      PYTHONNOUSERSITE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
      - name: Freeze exact PR310 source, issuer, third-run consumed consent
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/task4-third-two-real-provider-v1-consumed" --jq '.object.sha')" = "95ff6be8c5875ed3827a00fe71fb54bd9de48130"
          test "$(git hash-object sql/task4_310_offline_postgres_consume_v1.sql)" = "0b891930f50fc17747a9854666450c9438ef7945"
          test "$(git hash-object scripts/task4_310_postgres_single_use_ci.py)" = "8e9dad92aa2b548f525b81c8fe8cc281cf97fe70"
          test "$(git hash-object scripts/task4_prospective_model_wire_date_boundary_v1.py)" = "83ad7d3f229084633c28729d592330c477c76316"
          echo "EXACT_PR310_PARENT_AND_HISTORICAL_PROVIDER_APPROVAL_CONSUMPTION_PINNED"
      - name: Install PostgreSQL client only, never Provider SDK
        shell: bash
        run: python -m pip install --disable-pip-version-check "pytest==9.1.1" "psycopg[binary]==3.2.10"
      - name: Setup original PostgreSQL fixture roles then isolated receipt handoff
        shell: bash
        run: |
          set -euo pipefail
          python scripts/task4_310_postgres_single_use_ci.py --setup
          python scripts/task4_311_committed_receipt_handoff_ci.py --setup
      - name: Test separate-session commit observation, no replay, rollback and privilege boundaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          python -m pytest -q -o addopts= \
            tests/test_task4_311_committed_receipt_handoff_ci.py \
            --junitxml=results/task4-311-committed-receipt-junit.xml \
            | tee results/task4-311-committed-receipt-tests.log
          python scripts/task4_311_committed_receipt_handoff_ci.py \
            --report results/task4-311-committed-receipt-report.json \
            | tee results/task4-311-committed-receipt-audit.log
          python - <<'PY'
          import json
          r=json.load(open("results/task4-311-committed-receipt-report.json"))
          assert r["fixture_successful_consumptions"]==1
          assert r["conflicting_consumption_refusals"]==11
          assert r["separate_handoff_session_verified_exact_winner"]
          assert r["real_provider_posts"]==0
          assert r["new_real_human_consent_issued"] is False
          assert r["production_handoff_proven"] is False
          assert r["future_live_provider_decision"]["decision"]=="DENY"
          print("TASK4_311_ONLY_CI_COMMITTED_RECEIPT_NO_REAL_DISPATCH_AUTHORITY")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: task4-committed-receipt-handoff-ci-v1
          path: results/*
          if-no-files-found: warn
