name: Final 128 V11 Immutable Actions Pins
on:
  pull_request:
    paths:
      - ".github/workflows/final-128-v11-manual-dispatch-template.yml"
      - ".github/workflows/final-128-v11-actual-path-provider-free.yml"
      - ".github/workflows/final-128-v11-credential-boundary-provider-free.yml"
      - ".github/workflows/final-128-v11-corrected-chain-provider-free.yml"
      - ".github/workflows/final-128-v11-immutable-actions-pins.yml"
      - "contracts/AGENTDOJO_FINAL_128_V11_TARGET_FREEZE_v1.json"
      - "scripts/final_128_v11_target_freeze_audit_v1.py"
      - "scripts/final_128_real_provider_wrapper_v9.py"
      - "scripts/final_128_v11_runtime_self_binding_audit_v1.py"
permissions: {contents: read}
jobs:
  immutable-pins:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ""
      VERITAS_DATABASE_URL: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.11.16"}
      - name: Re-traverse shared provider-free runtime path
        run: python scripts/final_128_real_provider_wrapper_v9.py --provider-free-preflight
      - name: Re-prove runtime component self-binding
        run: python scripts/final_128_v11_runtime_self_binding_audit_v1.py
      - name: Prove immutable Actions pins and zero authorization blockers
        run: python scripts/final_128_v11_target_freeze_audit_v1.py
