name: Task4 Actual SDK JSON Output Cap and Offline Prompt Proxy V1
on:
  pull_request:
    paths:
      - ".github/workflows/task4-325-exact-sdk-wire-offline-v1.yml"
      - "scripts/task4_325_exact_sdk_wire_offline_v1.py"
      - "scripts/task4_325_sdk_wire_audit_v1.py"
      - "contracts/TASK4_325_EXACT_SDK_WIRE_OFFLINE_V1.json"
      - "tests/test_task4_325_exact_sdk_wire_offline_v1.py"
      - "docs/TASK4_325_EXACT_SDK_WIRE_OFFLINE_V1.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/task4-325-exact-sdk-wire-offline-v1.yml"
      - "scripts/task4_325_exact_sdk_wire_offline_v1.py"
      - "scripts/task4_325_sdk_wire_audit_v1.py"
      - "contracts/TASK4_325_EXACT_SDK_WIRE_OFFLINE_V1.json"
      - "tests/test_task4_325_exact_sdk_wire_offline_v1.py"
      - "docs/TASK4_325_EXACT_SDK_WIRE_OFFLINE_V1.md"

permissions:
  contents: read
  actions: read

jobs:
  actual-sdk-json-from-independent-local-model-sources:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OPENAI_API_KEY: ""
      TASK4_OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      OPENAI_BASE_URL: ""
      VERITAS_DATABASE_URL: ""
      TASK4_325_APPROVAL_PHRASE: ""
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PYTEST_ADDOPTS: ""
      PYTHONNOUSERSITE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      TASK4_NATIVE_DATE_PROOF: "1"
      TASK4_TRANSPORT_PROOF: "1"
      TASK4_TRAJECTORY_PROOF: "1"
      TASK4_SCORER_OBSERVATION_PROOF: "1"
      TASK4_325_OFFLINE_WIRE_PROOF: "1"
      TASK4_RCC_ROOT: "_pins/rcc"
      TASK4_325_EVIDENCE_ROWS: "results/task4-325-real-sdk-wire-two-source-rows.jsonl"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
      - name: Previous real Provider approval permanently consumed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/task4-third-two-real-provider-v1-consumed" --jq '.object.sha')" = "95ff6be8c5875ed3827a00fe71fb54bd9de48130"
          echo "TASK4_325_PREVIOUS_PROVIDER_GRANT_SPENT"
      - name: Exact native AgentDojo, RCC and VERITAS versions only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _pins results
          git clone https://github.com/ethz-spylab/agentdojo.git _pins/agentdojo
          git -C _pins/agentdojo checkout a75aba7631d3ca5fb7ab938965c97ead2f9ff84b
          git clone https://github.com/effacermonexistence/rcc-revas-veritas-benchmark.git _pins/rcc
          git -C _pins/rcc checkout 1d3782d3aae5ff9c88036709c1a5642320cc53c2
          git clone https://github.com/veritasfuji-japan/veritas_os.git _pins/veritas
          git -C _pins/veritas checkout a1d66aef02262cf8a913295270c3aafd159c6adb
          test "$(git -C _pins/agentdojo rev-parse HEAD)" = "a75aba7631d3ca5fb7ab938965c97ead2f9ff84b"
          test "$(git -C _pins/rcc rev-parse HEAD)" = "1d3782d3aae5ff9c88036709c1a5642320cc53c2"
          test "$(git -C _pins/veritas rev-parse HEAD)" = "a1d66aef02262cf8a913295270c3aafd159c6adb"
      - name: Install pinned native-only evaluator and frozen dependencies
        shell: bash
        run: |
          set -euo pipefail
          pip install --no-deps -e ./_pins/agentdojo -e ./_pins/veritas
          pip install "pytest==9.1.1" "cryptography==50.0.0" "openai==1.109.1" "pydantic==2.11.10" "idna==3.15" "httpx==0.28.1" "requests==2.34.2" "PyYAML==6.0.3"
          python scripts/final_128_v12_locked_agentdojo_requirements_v1.py \
            --lock _pins/agentdojo/uv.lock \
            --output /tmp/task4-325-agentdojo-locked.txt
          pip install -r /tmp/task4-325-agentdojo-locked.txt
      - name: Audit real SDK JSON locally, max completion field, native scorer and no Provider
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/task4-325-agentdojo-locked.txt results/task4-325-pinned-dependencies.txt
          pip freeze > results/task4-325-pip-freeze.txt
          git rev-parse HEAD > results/task4-325-checked-out-head.txt
          echo "${{ github.event.pull_request.head.sha || github.sha }}" > results/task4-325-expected-head.txt
          test "$(cat results/task4-325-checked-out-head.txt)" = "$(cat results/task4-325-expected-head.txt)"
          python -m pytest -q -o addopts= \
            tests/test_task4_325_exact_sdk_wire_offline_v1.py \
            --junitxml=results/task4-325-junit.xml \
            | tee results/task4-325-pytest.log
          python scripts/task4_325_sdk_wire_audit_v1.py \
            --evidence "$TASK4_325_EVIDENCE_ROWS" \
            --output results/task4-325-sdk-wire-audit.json \
            | tee results/task4-325-audit.log
          sha256sum scripts/task4_325_exact_sdk_wire_offline_v1.py \
            scripts/task4_325_sdk_wire_audit_v1.py \
            contracts/TASK4_325_EXACT_SDK_WIRE_OFFLINE_V1.json \
            results/task4-325-sdk-wire-audit.json \
            > results/task4-325-source-evidence-sha256.txt
          python - <<'PY'
          import json
          d=json.load(open("results/task4-325-sdk-wire-audit.json"))
          assert d["sdk_local_interceptions"]==8
          assert d["native_selected_arm_dispatches"]==2
          assert d["native_selected_arm_scorer_invocations"]==2
          assert d["sdk_output_cap_field_present_on_all_local_post_bodies"] is True
          assert d["original_budget_10k_input_and_256_output_is_authoritatively_proven"] is False
          assert d["real_api_posts"]==d["new_final128_scores"]==0
          assert d["real_provider_dispatch"]=="DENY"
          print("TASK4_325_ACTUAL_SDK_WIRE_OFFLINE_SCOPED_NONBILLABLE_MODEL")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: task4-325-local-real-sdk-json-wire-cap-v1
          path: results/*
          if-no-files-found: warn
