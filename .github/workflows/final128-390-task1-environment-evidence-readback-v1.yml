name: Final128 390 Task1 Environment Approval Evidence Readback
on:
  pull_request:
    paths:
      - "evidence/final128_task1_environment_approval_run_38386775595_v1.json"
      - "scripts/final128_390_environment_approval_readback_v1.py"
      - "tests/test_final128_390_environment_approval_readback_v1.py"
      - "docs/optimization/FINAL128_390_TASK1_ENVIRONMENT_APPROVAL_EVIDENCE_FREEZE_V1.md"
      - ".github/workflows/final128-390-task1-environment-evidence-readback-v1.yml"
permissions:
  contents: read
jobs:
  frozen-observed-gate-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    env:
      PYTHONPATH: "."
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      OPENAI_API_KEY: ""
      TASK4_OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      GITHUB_TOKEN: ""
      GH_TOKEN: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
      - name: Confirm exact HEAD, no credentials and compile stdlib auditor
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          for k in OPENAI_API_KEY TASK4_OPENAI_API_KEY ANTHROPIC_API_KEY GITHUB_TOKEN GH_TOKEN; do
            test -z "$(printenv "$k" || true)"
          done
          mkdir -p results
          git rev-parse HEAD > results/final128-390-exact-head.txt
          python -m py_compile scripts/final128_390_environment_approval_readback_v1.py tests/test_final128_390_environment_approval_readback_v1.py
      - name: Install offline test runner only
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "pytest==9.1.1"
      - name: Run negative tests, offline snapshot and three public GitHub GET readbacks
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q -o addopts= tests/test_final128_390_environment_approval_readback_v1.py \
            --junitxml=results/final128-390-junit.xml | tee results/final128-390-tests.log
          python scripts/final128_390_environment_approval_readback_v1.py \
            --output results/final128-390-offline-evidence-check.json
          python scripts/final128_390_environment_approval_readback_v1.py \
            --readback --output results/final128-390-live-github-get-check.json
      - name: Verify unscored evidence and persist SHA-256 manifests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,xml.etree.ElementTree as ET
          from pathlib import Path
          root=ET.parse("results/final128-390-junit.xml").getroot()
          suites=[root] if root.tag=="testsuite" else list(root.findall("testsuite"))
          assert suites
          counts={k:sum(int(s.attrib.get(k,"0")) for s in suites)
                  for k in ("tests","failures","errors","skipped")}
          assert counts["tests"]>=35
          assert all(counts[x]==0 for x in ("failures","errors","skipped"))
          offline=json.loads(Path("results/final128-390-offline-evidence-check.json").read_text())
          live=json.loads(Path("results/final128-390-live-github-get-check.json").read_text())
          assert offline["source_snapshot_verified_offline"] is True
          assert offline["public_github_rest_readback_matches_frozen_subset"] is False
          assert offline["task1_live_authorized"] is False
          assert live["readback_mode"]=="PUBLIC_GET_ONLY"
          assert live["public_github_rest_readback_matches_frozen_subset"] is True
          assert live["approval_exact_timestamp_unavailable"] is True
          assert live["third_party_immutable_provenance_verified"] is False
          assert live["historical_waiting_status_not_replayable_from_current_api"] is True
          assert live["task1_live_authorized"] is False
          assert live["production_bypass_proven"] is False
          assert live["actual_paid_provider_calls_in_probe"]==0
          assert offline["evidence_file_sha256"]==live["evidence_file_sha256"]
          sha=lambda p:hashlib.sha256(Path(p).read_bytes()).hexdigest()
          record={
             "schema":"veritas.final128.390-environment-gate-evidence-audit.v1",
             "exact_pr_head":Path("results/final128-390-exact-head.txt").read_text().strip(),
             "test_counts":counts,
             "frozen_source_sha256":live["evidence_file_sha256"],
             "offline_evidence_sha256":sha("results/final128-390-offline-evidence-check.json"),
             "current_github_readback_sha256":sha("results/final128-390-live-github-get-check.json"),
             "original_waiting_state_now_replayable":False,
             "authenticated_third_party_signed_github_snapshot":False,
             "task1_real_provider_calls":0,
             "task1_real_provider_cost_usd":"0.00",
             "native_scorer_calls":0,
             "official_utility_delta":None,
             "live_task1_permission":False,
             "production_bypass_proven":False,
          }
          b=lambda x:json.dumps(x,sort_keys=True,separators=(",",":"),allow_nan=False).encode()
          record["self_sha256"]=hashlib.sha256(b(record)).hexdigest()
          Path("results/final128-390-evidence-manifest.json").write_text(
              json.dumps(record,sort_keys=True,indent=2)+"\n")
          print("FINAL128_390_GITHUB_GATE_OBSERVED_LIMITED_REAL_TASK1_DENIED")
          PY
          sha256sum \
            evidence/final128_task1_environment_approval_run_38386775595_v1.json \
            scripts/final128_390_environment_approval_readback_v1.py \
            tests/test_final128_390_environment_approval_readback_v1.py \
            docs/optimization/FINAL128_390_TASK1_ENVIRONMENT_APPROVAL_EVIDENCE_FREEZE_V1.md \
            results/final128-390-offline-evidence-check.json \
            results/final128-390-live-github-get-check.json \
            results/final128-390-junit.xml \
            results/final128-390-evidence-manifest.json > results/final128-390-sha256.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: final128-390-observed-environment-approval-gate-unscored
          path: results/final128-390-*
          if-no-files-found: warn
