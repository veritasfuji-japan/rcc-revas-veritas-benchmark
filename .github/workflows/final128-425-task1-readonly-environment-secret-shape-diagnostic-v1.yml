name: Task1 425 Read-Only Environment Secret Shape Diagnostic (NO PROVIDER)
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: task1-425-environment-secret-shape-readonly
  cancel-in-progress: false

jobs:
  read-only-secret-shape-only:
    if: github.actor == 'veritasfuji-japan' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: task1-real-model-pilot
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
      - name: Check ONLY API/AES secret shape and safe Actions context - never send
        env:
          TASK1_425_DIAGNOSTIC_ENVIRONMENT: task1-real-model-pilot
          TASK1_OPENAI_API_KEY: ${{ secrets.TASK1_OPENAI_API_KEY }}
          TASK1_CAPTURE_AES256_KEY: ${{ secrets.TASK1_CAPTURE_AES256_KEY }}
          PYTHONDONTWRITEBYTECODE: "1"
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          # Standard library ONLY; reads Environment secrets, never logs them.
          # No Provider SDK, GitHub tag authority, write permission, payments,
          # Native scoring, GitHub Actions artifacts, or retries.
          python scripts/final128_425_task1_environment_secret_diagnostic_v1.py
