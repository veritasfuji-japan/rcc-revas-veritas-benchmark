name: Task4 455 Research Native SDK First Wire HARD NO-GO
on:
  pull_request:
    paths:
      - ".github/workflows/task4-455-research-native-sdk-sender-deny.yml"
      - "scripts/task4_455_research_native_sender_hard_nogo_v1.py"
      - "tests/test_task4_455_research_native_sender_hard_nogo_v1.py"
      - "docs/TASK4_455_NATIVE_RESEARCH_SENDER_HARD_NO_GO_V1.md"

permissions:
  contents: read
  actions: read

jobs:
  research-native-first-sdk-wire-default-deny:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OPENAI_API_KEY: ""
      TASK4_OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      OPENAI_BASE_URL: ""
      VERITAS_DATABASE_URL: ""
      TASK4_323_APPROVAL_PHRASE: ""
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PYTEST_ADDOPTS: ""
      PYTHONNOUSERSITE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      TASK4_NATIVE_DATE_PROOF: "1"
      TASK4_TRANSPORT_PROOF: "1"
      TASK4_TRAJECTORY_PROOF: "1"
      TASK4_SCORER_OBSERVATION_PROOF: "1"
      TASK4_455_NATIVE_PROOF: "1"
      TASK4_RCC_ROOT: "_pins/rcc"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
      - name: Previous real Provider approval permanently consumed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/task4-third-two-real-provider-v1-consumed" --jq '.object.sha')" = "95ff6be8c5875ed3827a00fe71fb54bd9de48130"
          echo "TASK4_323_PREVIOUS_PROVIDER_GRANT_SPENT"
      - name: Exact native AgentDojo, RCC and VERITAS versions only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _pins results
          git clone https://github.com/ethz-spylab/agentdojo.git _pins/agentdojo
          git -C _pins/agentdojo checkout a75aba7631d3ca5fb7ab938965c97ead2f9ff84b
          git clone https://github.com/effacermonexistence/rcc-revas-veritas-benchmark.git _pins/rcc
          git -C _pins/rcc checkout 1d3782d3aae5ff9c88036709c1a5642320cc53c2
          git clone https://github.com/veritasfuji-japan/veritas_os.git _pins/veritas
          git -C _pins/veritas checkout a1d66aef02262cf8a913295270c3aafd159c6adb
          test "$(git -C _pins/agentdojo rev-parse HEAD)" = "a75aba7631d3ca5fb7ab938965c97ead2f9ff84b"
          test "$(git -C _pins/rcc rev-parse HEAD)" = "1d3782d3aae5ff9c88036709c1a5642320cc53c2"
          test "$(git -C _pins/veritas rev-parse HEAD)" = "a1d66aef02262cf8a913295270c3aafd159c6adb"
      - name: Install pinned native-only evaluator and frozen dependencies
        shell: bash
        run: |
          set -euo pipefail
          pip install --no-deps -e ./_pins/agentdojo -e ./_pins/veritas
          pip install "pytest==9.1.1" "cryptography==50.0.0" "openai==1.109.1" "pydantic==2.11.10" "idna==3.15" "httpx==0.28.1" "requests==2.34.2" "PyYAML==6.0.3"
          python scripts/final_128_v12_locked_agentdojo_requirements_v1.py \
            --lock _pins/agentdojo/uv.lock \
            --output /tmp/task4-323-agentdojo-locked.txt
          pip install -r /tmp/task4-323-agentdojo-locked.txt
          pip install "tiktoken==0.12.0"
      - name: Actual pinned Native first OpenAI SDK serialized requests MUST be denied
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q -o addopts= \
            tests/test_task4_455_research_native_sender_hard_nogo_v1.py \
            --junitxml=results/task4-455-deny-junit.xml \
            | tee results/task4-455-test.log
          python -m scripts.task4_455_research_native_sender_hard_nogo_v1 \
            --mode offline-native-prewire \
            --output results/task4-455-native-sdk-prewire-denied.json
          python - <<'PY'
          import json
          r=json.load(open("results/task4-455-native-sdk-prewire-denied.json"))
          assert r["new_live_provider_dispatch"] == "DENY"
          assert r["actual_provider_calls"] == 0
          assert r["new_true_model_utility_recoveries"] == 0
          assert [x["arm"] for x in r["arms"]] == ["A", "B"]
          assert all(x["sdk_request"]["provider_post_allowed"] is False
                     and x["first_model_query_attempts"] == 1
                     and x["native_tool_effects"] == 0
                     and x["native_terminal_responses"] == 0
                     and x["native_scorer_calls"] == 0 for x in r["arms"])
          print("TASK4_455_NATIVE_OPENAI_SDK_FIRST_WIRE_DENIED_0_PROVIDER_CALLS")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: task4-455-native-first-wire-denial-v1
          path: results/*
          if-no-files-found: warn
