name: AgentDojo Final Runner Implementation Audit v0.1

on:
  pull_request:
    paths:
      - "scripts/agentdojo_clean_ab_final_runner_v0_1.py"
      - "tests/test_agentdojo_clean_ab_final_runner_v0_1.py"
      - "contracts/AGENTDOJO_FINAL_RUNNER_IMPLEMENTATION_v0.1.json"
      - "contracts/AGENTDOJO_FINAL_CLEAN_AB_RESULT_v0.1.json"
      - ".github/workflows/agentdojo-clean-ab-final-v0_1.yml"
      - ".github/workflows/agentdojo-final-runner-implementation-audit-v0_1.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: ethz-spylab/agentdojo
          ref: a75aba7631d3ca5fb7ab938965c97ead2f9ff84b
          path: _pins/agentdojo
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: effacermonexistence/rcc-revas-veritas-benchmark
          ref: 1d3782d3aae5ff9c88036709c1a5642320cc53c2
          path: _pins/rcc
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: veritasfuji-japan/veritas_os
          ref: 825e5c5c539c98e12b0c9702f3cb4a12d67539d3
          path: _pins/veritas
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.16"

      - run: python -m pip install -U pip
      - run: python -m pip install -e _pins/agentdojo pytest cryptography==50.0.1
      - run: python -m pip install -e '_pins/rcc/external-eval/v0.3.9[crypto]'
      - run: python -m pip install -e _pins/veritas --no-deps

      - name: Verify exact source pins
        run: |
          test "$(git -C _pins/agentdojo rev-parse HEAD)" = "a75aba7631d3ca5fb7ab938965c97ead2f9ff84b"
          test "$(git -C _pins/rcc rev-parse HEAD)" = "1d3782d3aae5ff9c88036709c1a5642320cc53c2"
          test "$(git -C _pins/veritas rev-parse HEAD)" = "825e5c5c539c98e12b0c9702f3cb4a12d67539d3"

      - name: Pure tests
        env:
          OPENAI_API_KEY: ""
        run: PYTHONPATH=.:_pins/veritas pytest -q tests/test_agentdojo_clean_ab_final_runner_v0_1.py

      - name: Offline implementation audit
        env:
          OPENAI_API_KEY: ""
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import scripts.agentdojo_clean_ab_final_runner_v0_1 as runner

          assert os.environ.get("OPENAI_API_KEY", "") == ""

          impl = json.load(open("contracts/AGENTDOJO_FINAL_RUNNER_IMPLEMENTATION_v0.1.json"))
          freeze = json.load(open("contracts/AGENTDOJO_FINAL_RUNNER_FREEZE_v0.3.json"))
          gate = impl["execution_gate"]
          assert gate in {"CLOSED", "OPEN"}

          cases = runner.assert_frozen_configuration(
              runner.contracts(),
              expected_execution_gate=gate,
          )
          assert len(cases) == 128

          runner_path = "scripts/agentdojo_clean_ab_final_runner_v0_1.py"
          workflow_path = ".github/workflows/agentdojo-clean-ab-final-v0_1.yml"
          actual = hashlib.sha256(Path(runner_path).read_bytes()).hexdigest()
          expected = freeze["frozen_files"][runner_path]

          assert actual == expected, (actual, expected)

          remediation = impl.get("remediation_pending")
          resolved = impl.get("remediation_resolved")
          if remediation is not None:
              assert impl["execution_gate"] == "CLOSED"
              assert impl["status"] == "RESULT_BEARING_RUNNER_REMEDIATION_PENDING_EXECUTION_GATE_CLOSED"
              assert remediation["failed_workflow_run"] == 36691824480
              assert remediation["failure_stage"] == "PRE_PROVIDER_DIRECT_ATTACK_CONSTRUCTION"
              assert remediation["api_call_reached"] is False
              assert remediation["provider_cost_incurred"] is False
          if gate == "OPEN":
              assert remediation is None
              assert resolved is not None
              assert resolved["failed_workflow_run"] == 36691824480
              assert resolved["freeze_contract"] == "contracts/AGENTDOJO_FINAL_RUNNER_FREEZE_v0.3.json"
              auth = impl["gate_open_authorization"]
              assert auth["freeze_contract"] == "contracts/AGENTDOJO_FINAL_RUNNER_FREEZE_v0.3.json"
              assert auth["workflow_confirmation_required"] == "RUN_FROZEN_AGENTDOJO_CLEAN_AB_V0_1"

          assert impl["api_called_by_this_pr"] is False
          if impl["clean_ab_executed"]:
              assert gate == "CLOSED"
              assert impl["status"] == "RESULT_BEARING_RUNNER_EXECUTED_EXECUTION_GATE_CLOSED"
              assert impl["api_called_by_result_run"] is True
              assert impl["rerun_authorized"] is False
              auth = impl["gate_open_authorization"]
              assert auth["consumed"] is True
              assert auth["consumed_by_run"] == 36694228490
              assert auth["consumed_by_job"] == 109818240438
              assert auth["consumed_runner_commit"] == "406c2baf50edb05952f6a622cc27a261b39fdf06"
              assert auth["rerun_authorized"] is False
              result = json.load(open("contracts/AGENTDOJO_FINAL_CLEAN_AB_RESULT_v0.1.json"))
              assert result["status"] == "VALID_CLEAN_INTEGRATION_REPLICATION_RESULT"
              assert result["execution"]["run_id"] == 36694228490
              assert result["execution"]["runner_commit"] == "406c2baf50edb05952f6a622cc27a261b39fdf06"
              assert result["artifact"]["github_artifact_digest"] == "sha256:497dbb170440af7112b93592f2682e02168d0623ec4e84412b326c63f2a73c87"
              assert result["integrity"]["execution_errors"] == 0
              assert result["integrity"]["same_initial_prestate_count"] == 128
              assert result["native_agentdojo_scores"]["arm_A_RCC_REVAS_ONLY"]["injection_task_success_count"] == 21
              assert result["native_agentdojo_scores"]["arm_B_RCC_REVAS_PLUS_VERITAS_BIND"]["injection_task_success_count"] == 0
              assert result["native_agentdojo_scores"]["arm_A_RCC_REVAS_ONLY"]["utility_success_count"] == 92
              assert result["native_agentdojo_scores"]["arm_B_RCC_REVAS_PLUS_VERITAS_BIND"]["utility_success_count"] == 60
          assert freeze["clean_ab_executed"] is False
          assert freeze["api_called"] is False

          src = Path(runner_path).read_text()
          workflow = Path(workflow_path).read_text()
          assert 'if c["execution_gate"] != "OPEN":' in src
          assert 'raise RunnerError("EXECUTION_GATE_CLOSED")' in src
          assert "args.confirmation != GATE_CONFIRMATION" in src
          assert 'raise RunnerError("EXPLICIT_HUMAN_EXECUTION_CONFIRMATION_REQUIRED")' in src
          assert "DirectAttack(suite, pipeline)" in src
          assert "OPENAI_API_KEY_MISSING" in workflow
          assert "secrets.OPENAI_API_KEY" in workflow

          print(json.dumps({
              "execution_gate": gate,
              "api_called": False,
              "clean_ab_executed": impl["clean_ab_executed"],
              "case_count": len(cases),
              "runner_sha256": actual,
          }, indent=2))
          PY
