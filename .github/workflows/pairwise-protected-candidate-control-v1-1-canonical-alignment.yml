name: Pairwise Protected Candidate Control V1.1 Canonical Alignment
on:
  pull_request:
    paths:
      - "contracts/PAIRWISE_PROTECTED_CANDIDATE_CONTROL_V1_1_CANONICAL_ALIGNMENT.json"
      - "scripts/pairwise_protected_candidate_control_v1_1.py"
      - "scripts/pairwise_protected_candidate_control_v1_1_audit.py"
      - ".github/workflows/pairwise-protected-candidate-control-v1-1-canonical-alignment.yml"
permissions:
  contents: read
jobs:
  alignment:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ""
      VERITAS_DATABASE_URL: ""
      RCC_ROOT: _pins/rcc
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"

      - name: Checkout exact RCC pin
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/effacermonexistence/rcc-revas-veritas-benchmark.git "$RCC_ROOT"
          git -C "$RCC_ROOT" checkout 1d3782d3aae5ff9c88036709c1a5642320cc53c2

      - name: Audit canonical candidate hash alignment
        run: python scripts/pairwise_protected_candidate_control_v1_1_audit.py
