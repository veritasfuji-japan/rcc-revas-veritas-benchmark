name: Task4 465 Native Signed Scope Before Broker HARD NO-GO
on:
  pull_request:
    paths:
      - "scripts/task4_465_native_signed_scope_prebroker_no_go_v1.py"
      - "tests/test_task4_465_native_signed_scope_prebroker_no_go_v1.py"
      - "docs/TASK4_465_NATIVE_SIGNED_SCOPE_PREBROKER_NO_GO_V1.md"
      - ".github/workflows/task4-465-native-signed-prebroker-nogo.yml"

permissions:
  contents: read
  actions: read

jobs:
  native-signed-issuer-before-broker-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      OPENAI_API_KEY: ""
      TASK4_OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      OPENAI_BASE_URL: ""
      VERITAS_DATABASE_URL: ""
      TASK4_465_PAID_APPROVAL: ""
      GITHUB_TOKEN: ""
      GH_TOKEN: ""
      TASK4_323_APPROVAL_PHRASE: ""
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PYTEST_ADDOPTS: ""
      PYTHONNOUSERSITE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      TASK4_465_NATIVE_PROOF: "1"
      TASK4_RCC_ROOT: "_pins/rcc"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
      - name: Confirm historical real Provider grant was consumed (read-only)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/task4-third-two-real-provider-v1-consumed" --jq '.object.sha')" = "95ff6be8c5875ed3827a00fe71fb54bd9de48130"
      - name: Checkout exact frozen Native inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _pins results
          git clone https://github.com/ethz-spylab/agentdojo.git _pins/agentdojo
          git -C _pins/agentdojo checkout a75aba7631d3ca5fb7ab938965c97ead2f9ff84b
          git clone https://github.com/effacermonexistence/rcc-revas-veritas-benchmark.git _pins/rcc
          git -C _pins/rcc checkout 1d3782d3aae5ff9c88036709c1a5642320cc53c2
          git clone https://github.com/veritasfuji-japan/veritas_os.git _pins/veritas
          git -C _pins/veritas checkout a1d66aef02262cf8a913295270c3aafd159c6adb
          test "$(git -C _pins/agentdojo rev-parse HEAD)" = "a75aba7631d3ca5fb7ab938965c97ead2f9ff84b"
          test "$(git -C _pins/rcc rev-parse HEAD)" = "1d3782d3aae5ff9c88036709c1a5642320cc53c2"
          test "$(git -C _pins/veritas rev-parse HEAD)" = "a1d66aef02262cf8a913295270c3aafd159c6adb"
      - name: Install pinned Native and SDK offline dependencies
        shell: bash
        run: |
          set -euo pipefail
          pip install --no-deps -e ./_pins/agentdojo -e ./_pins/veritas
          pip install "pytest==9.1.1" "cryptography==50.0.0" "openai==1.109.1" "pydantic==2.11.10" "idna==3.15" "httpx==0.28.1" "requests==2.34.2" "PyYAML==6.0.3"
          python scripts/final_128_v12_locked_agentdojo_requirements_v1.py \
            --lock _pins/agentdojo/uv.lock \
            --output /tmp/task4-465-locked.txt
          pip install -r /tmp/task4-465-locked.txt
          pip install "tiktoken==0.12.0"
      - name: Verify signed synthetic claim before Broker consume then Provider denial
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q -o addopts= \
            tests/test_task4_465_native_signed_scope_prebroker_no_go_v1.py \
            --junitxml=results/task4-465-native-signed-prebroker-junit.xml \
            | tee results/task4-465-test.log
          python -m scripts.task4_465_native_signed_scope_prebroker_no_go_v1 \
            --output results/task4-465-native-signed-prebroker-hashes.json
          python - <<'PY'
          import json
          report=json.load(open("results/task4-465-native-signed-prebroker-hashes.json"))
          assert report["first_native_sdk_requests"] == 2
          assert report["signed_fixture_inspected_before_broker"] == 2
          assert report["local_broker_consumptions"] == 2
          assert report["broker_duplicate_denials_after_restart"] == 2
          assert report["real_issuer_attested"] is False
          assert report["real_date_attested"] is False
          assert report["real_recipient_amount_authority_attested"] is False
          assert report["fresh_owner_paid_consent"] is False
          assert report["actual_provider_calls"] == 0
          assert report["external_bank_effects"] == 0
          assert report["real_provider_dispatch"] == "DENY"
          assert report["score_status"] == "UNSCORED"
          print("TASK4_465_REAL_SDK_SYNTHETIC_SIGNED_PREBROKER_PROVIDER_DENIED")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: task4-465-native-signed-prebroker-offline-junit-hashes
          path: results/*
          if-no-files-found: warn
