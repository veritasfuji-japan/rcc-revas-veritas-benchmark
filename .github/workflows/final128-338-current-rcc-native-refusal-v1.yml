name: Final128 338 Current RCC → VERITAS Native Refusal V1

on:
  pull_request:
    paths:
      - ".github/workflows/final128-338-current-rcc-native-refusal-v1.yml"
      - "contracts/FINAL128_338_CURRENT_RCC_NATIVE_REFUSAL_V1.json"
      - "scripts/final128_338_current_rcc_native_refusal_v1.py"
      - "tests/test_final128_338_current_rcc_native_refusal_v1.py"
      - "docs/optimization/FINAL128_338_CURRENT_RCC_NATIVE_REFUSAL_V1.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-cda-and-unverified-bind-refusal:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      OPENAI_API_KEY: ""
      TASK4_OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      VERITAS_API_KEY: ""
      VERITAS_DATABASE_URL: ""
      GITHUB_TOKEN: ""
      GH_TOKEN: ""
      FINAL128_338_UPSTREAM_ROOT: "${{ github.workspace }}/current-rcc-upstream"
      FINAL128_338_VERITAS_ROOT: "${{ github.workspace }}/veritas-source"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Checkout current RCC source at exact frozen main HEAD
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: effacermonexistence/rcc-revas-veritas-benchmark
          ref: 353ad9e6a17cda8874a129493fe0f8f4fe4427bc
          path: current-rcc-upstream
          persist-credentials: false
      - name: Checkout current VERITAS source at exact frozen main HEAD
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: veritasfuji-japan/veritas_os
          ref: 299a3c4987668091f50ab3e45165bcccd1ae193f
          path: veritas-source
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
      - name: Verify both source HEADs and install pinned native VERITAS implementation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C current-rcc-upstream rev-parse HEAD)" = "353ad9e6a17cda8874a129493fe0f8f4fe4427bc"
          test "$(git -C veritas-source rev-parse HEAD)" = "299a3c4987668091f50ab3e45165bcccd1ae193f"
          test -z "$(git -C current-rcc-upstream status --porcelain)"
          test -z "$(git -C veritas-source status --porcelain)"
          for key in OPENAI_API_KEY TASK4_OPENAI_API_KEY ANTHROPIC_API_KEY VERITAS_API_KEY VERITAS_DATABASE_URL GITHUB_TOKEN GH_TOKEN; do
            test -z "$(printenv "$key" || true)"
          done
          python -m pip install --disable-pip-version-check ./veritas-source "pytest==9.0.3"
      - name: Verify one actual RCC-released candidate is refused by real native gates
        shell: bash
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          mkdir -p results
          git rev-parse HEAD > results/final128-338-ci-head.txt
          git -C current-rcc-upstream rev-parse HEAD > results/final128-338-rcc-head.txt
          git -C veritas-source rev-parse HEAD > results/final128-338-os-head.txt
          python scripts/final128_338_current_rcc_native_refusal_v1.py \
            --upstream-root current-rcc-upstream \
            --veritas-root veritas-source \
            --output-dir results/final128-338-current-rcc-native-refusal \
            | tee results/final128-338-run.log
      - name: Test source, authority, CDA, Bind nonpromotion and tamper rejections
        shell: bash
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          python -m pytest -q -o addopts= \
            tests/test_final128_338_current_rcc_native_refusal_v1.py \
            --junitxml=results/final128-338-junit.xml \
            | tee results/final128-338-tests.log
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path("results/final128-338-current-rcc-native-refusal/report.json")
          r=json.loads(p.read_text());digest=r.pop("report_sha256")
          assert digest==hashlib.sha256(json.dumps(r,sort_keys=True,
            separators=(",",":"),ensure_ascii=False,allow_nan=False).encode()).hexdigest()
          assert r["observed"]["native_bind_probe"]["final_outcome"]=="BLOCKED"
          assert r["observed"]["native_bind_probe"]["apply_count"]==0
          assert r["observed"]["native_cda_promotion"]=="REFUSED_NO_EXECUTION_INTENT"
          assert r["scope"]["provider_calls"]==r["scope"]["external_effects"]==0
          print("FINAL128_338_ACTUAL_NATIVE_VERITAS_CDA_REFUSED_AND_BIND_PROBE_NO_EFFECT")
          PY
          sha256sum \
            contracts/FINAL128_338_CURRENT_RCC_NATIVE_REFUSAL_V1.json \
            scripts/final128_338_current_rcc_native_refusal_v1.py \
            tests/test_final128_338_current_rcc_native_refusal_v1.py \
            docs/optimization/FINAL128_338_CURRENT_RCC_NATIVE_REFUSAL_V1.md \
            results/final128-338-current-rcc-native-refusal/report.json \
            > results/final128-338-evidence-sha256.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: final128-338-current-rcc-native-refusal-v1
          path: |
            results/final128-338-ci-head.txt
            results/final128-338-rcc-head.txt
            results/final128-338-os-head.txt
            results/final128-338-run.log
            results/final128-338-tests.log
            results/final128-338-junit.xml
            results/final128-338-evidence-sha256.txt
            results/final128-338-current-rcc-native-refusal/report.json
          if-no-files-found: warn
