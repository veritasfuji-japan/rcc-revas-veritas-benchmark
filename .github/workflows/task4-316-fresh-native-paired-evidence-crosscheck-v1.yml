name: Task4 Fresh Native Paired Evidence Crosscheck V1
on:
  pull_request:
    paths:
      - ".github/workflows/task4-316-fresh-native-paired-evidence-crosscheck-v1.yml"
      - "contracts/TASK4_316_FRESH_NATIVE_PAIRED_EVIDENCE_CROSSCHECK_V1.json"
      - "scripts/task4_316_fresh_native_paired_evidence_crosscheck_v1.py"
      - "tests/test_task4_316_fresh_native_paired_evidence_crosscheck_v1.py"
      - "docs/TASK4_316_FRESH_NATIVE_PAIRED_EVIDENCE_CROSSCHECK_V1.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/task4-316-fresh-native-paired-evidence-crosscheck-v1.yml"
      - "contracts/TASK4_316_FRESH_NATIVE_PAIRED_EVIDENCE_CROSSCHECK_V1.json"
      - "scripts/task4_316_fresh_native_paired_evidence_crosscheck_v1.py"
      - "tests/test_task4_316_fresh_native_paired_evidence_crosscheck_v1.py"
      - "docs/TASK4_316_FRESH_NATIVE_PAIRED_EVIDENCE_CROSSCHECK_V1.md"

permissions:
  contents: read
  actions: read

jobs:
  rerun-task4-native-scripted-paired-trajectory-and-crosscheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OPENAI_API_KEY: ""
      TASK4_OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      OPENAI_BASE_URL: ""
      VERITAS_DATABASE_URL: ""
      GH_TOKEN: ""
      GITHUB_TOKEN: ""
      TASK4_315_APPROVAL_PHRASE: ""
      TASK4_316_APPROVAL_PHRASE: ""
      TASK4_316_NATIVE_CROSSCHECK: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PYTEST_ADDOPTS: ""
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
      - name: Verify historical real Provider consent is exhausted
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/task4-third-two-real-provider-v1-consumed" --jq '.object.sha')" = "95ff6be8c5875ed3827a00fe71fb54bd9de48130"
          echo "TASK4_316_OLD_PROVIDER_PERMISSION_CONSUMED"
      - name: Checkout original immutable native evaluator and VERITAS pins
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _pins
          git clone https://github.com/ethz-spylab/agentdojo.git _pins/agentdojo
          git -C _pins/agentdojo checkout a75aba7631d3ca5fb7ab938965c97ead2f9ff84b
          git clone https://github.com/effacermonexistence/rcc-revas-veritas-benchmark.git _pins/rcc
          git -C _pins/rcc checkout 1d3782d3aae5ff9c88036709c1a5642320cc53c2
          git clone https://github.com/veritasfuji-japan/veritas_os.git _pins/veritas
          git -C _pins/veritas checkout a1d66aef02262cf8a913295270c3aafd159c6adb
      - name: Install only pinned native evaluator dependencies (no Provider key)
        shell: bash
        run: |
          set -euo pipefail
          pip install --no-deps -e ./_pins/agentdojo -e ./_pins/veritas
          pip install "pytest==9.1.1" "cryptography==50.0.0" "openai==1.109.1" "pydantic==2.11.10" "idna==3.15" "httpx==0.28.1" "requests==2.34.2" "PyYAML==6.0.3"
          python scripts/final_128_v12_locked_agentdojo_requirements_v1.py \
            --lock _pins/agentdojo/uv.lock \
            --output /tmp/task4-316-agentdojo-pins.txt
          pip install -r /tmp/task4-316-agentdojo-pins.txt
      - name: Fresh native model-free Task4 counterfactual rerun from #288
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          cp /tmp/task4-316-agentdojo-pins.txt results/task4-316-dependency-lock.txt
          pip freeze > results/task4-316-runtime-pip-freeze.txt
          python scripts/task4_prospective_date_utility_counterfactual_audit_v1.py \
            --agentdojo-root _pins/agentdojo \
            --rcc-root _pins/rcc \
            --veritas-root _pins/veritas \
            --output-dir results \
            | tee results/task4-316-original-native-rerun.log
      - name: Bind fresh 16 native rows to #315 structural evidence requirements
        shell: bash
        env:
          TASK4_316_NATIVE_ROWS: results/task4-prospective-date-utility-counterfactual-rows.jsonl
        run: |
          set -euo pipefail
          python scripts/task4_316_fresh_native_paired_evidence_crosscheck_v1.py \
            --rows "$TASK4_316_NATIVE_ROWS" \
            --output results/task4-316-native-evidence-audit.json \
            | tee results/task4-316-crosscheck.log
          python -m pytest -q -o addopts= \
            tests/test_task4_316_fresh_native_paired_evidence_crosscheck_v1.py \
            --junitxml=results/task4-316-native-crosscheck-junit.xml \
            | tee results/task4-316-negative-tests.log
          python - <<'PY'
          import json
          r=json.load(open("results/task4-316-native-evidence-audit.json"))
          assert len(r["pairs"])==16
          assert r["new_historical_v13_utility_recoveries"]==0
          assert r["new_canonical_attack_trials"]==0
          assert r["new_real_provider_calls"]==0
          assert r["live_provider_dispatch"]=="DENY"
          print("TASK4_316_NATIVE_PAIR_EVIDENCE_VALIDATED_WITHOUT_FINAL128_CLAIM")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: task4-316-fresh-native-paired-evidence-crosscheck-v1
          path: results/*
          if-no-files-found: warn
