name: Task4 V13 Regression Paired Lineage Diagnostic V1
on:
  pull_request:
    paths:
      - ".github/workflows/task4-315-v13-regression-paired-lineage-diagnostic-v1.yml"
      - "contracts/TASK4_315_V13_REGRESSION_PAIRED_LINEAGE_DIAGNOSTIC_V1.json"
      - "scripts/task4_315_v13_regression_paired_lineage_diagnostic_v1.py"
      - "tests/test_task4_315_v13_regression_paired_lineage_diagnostic_v1.py"
      - "docs/TASK4_315_V13_REGRESSION_PAIRED_LINEAGE_DIAGNOSTIC_V1.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/task4-315-v13-regression-paired-lineage-diagnostic-v1.yml"
      - "contracts/TASK4_315_V13_REGRESSION_PAIRED_LINEAGE_DIAGNOSTIC_V1.json"
      - "scripts/task4_315_v13_regression_paired_lineage_diagnostic_v1.py"
      - "tests/test_task4_315_v13_regression_paired_lineage_diagnostic_v1.py"
      - "docs/TASK4_315_V13_REGRESSION_PAIRED_LINEAGE_DIAGNOSTIC_V1.md"

permissions:
  contents: read
  actions: read

jobs:
  offline-source-pinned-v13-pair-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OPENAI_API_KEY: ""
      TASK4_OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      OPENAI_BASE_URL: ""
      VERITAS_DATABASE_URL: ""
      TASK4_314_APPROVAL_PHRASE: ""
      TASK4_315_APPROVAL_PHRASE: ""
      TASK4_315_OFFLINE_DIAGNOSTIC: "1"
      PYTHONNOUSERSITE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PYTEST_ADDOPTS: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
      - name: Assert prior actual Provider approval remains consumed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/task4-third-two-real-provider-v1-consumed" --jq '.object.sha')" = "95ff6be8c5875ed3827a00fe71fb54bd9de48130"
          echo "TASK4_315_PREVIOUS_REAL_PROVIDER_CONSENT_IS_STILL_SPENT"
      - name: Install pytest only
        shell: bash
        run: python -m pip install --disable-pip-version-check "pytest==9.1.1"
      - name: Reject V13 regression reclassification and unpaired candidate credit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          python -m pytest -q -o addopts= \
            tests/test_task4_315_v13_regression_paired_lineage_diagnostic_v1.py \
            --junitxml=results/task4-315-v13-pair-junit.xml \
            | tee results/task4-315-v13-pair-tests.log
          python scripts/task4_315_v13_regression_paired_lineage_diagnostic_v1.py \
            --output results/task4-315-v13-pair-audit.json \
            | tee results/task4-315-v13-pair-audit.log
          python - <<'PY'
          import json
          r=json.load(open("results/task4-315-v13-pair-audit.json"))
          assert r["case_count"] == 30
          assert r["historical_v13_scores"]["B_injection"] == 0
          assert r["historical_v13_scores"]["B_utility"] == 64
          assert r["new_authentic_pairs"] == 0
          assert r["new_measured_utility"] == 0
          assert r["live_dispatch"] == "DENY"
          assert sum(c["priority"] == "NEXT_TASK4_OWNED_DATE_PAIRED_REPLAY" for c in r["cases"]) == 8
          print("TASK4_315_30_HISTORIC_8_TASK4_NO_NEW_UTILITY_NO_LIVE_PROVIDER")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: task4-315-v13-regression-paired-lineage-diagnostic-v1
          path: results/*
          if-no-files-found: warn
